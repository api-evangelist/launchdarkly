providerId: launchdarkly
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-04'
reconciled: true
tags:
  - Rate Limiting
  - Feature Flags
description: LaunchDarkly REST API rate limits per token.
sources:
  - https://launchdarkly.com/pricing/
  - https://launchdarkly.com/docs/api/rate-limiting
headers:
  limit: X-Ratelimit-Route-Limit
  remaining: X-Ratelimit-Route-Remaining
  reset: X-Ratelimit-Reset
  globalLimit: X-Ratelimit-Global-Limit
  globalRemaining: X-Ratelimit-Global-Remaining
responseCodes:
  throttled: 429
limits:
  - name: Per route
    scope: token
    metric: requests_per_10s
    limit: varies by route
  - name: Global
    scope: token
    metric: requests_per_10s
    limit: 200
    timeFrame: 10 seconds
  - name: Flag evaluations (SDK streaming)
    scope: environment
    metric: events_per_second
    limit: high

# Probe record for LaunchDarkly's llms.txt surface.
#
# 2026-08-17 (round 1): probed https://apidocs.launchdarkly.com/llms.txt and recorded a
# soft-404 — HTTP 200 serving 72,904 bytes of HTML, not a text llms.txt. That verdict
# still stands and is preserved below. apidocs.launchdarkly.com answers 200 with the SAME
# JavaScript redirect shell for EVERY path.
#
# 2026-08-27 (round 2): the pointer was on the WRONG HOST. LaunchDarkly does publish a
# real llms.txt — on the docs host, not the apidocs redirect host. It is saved verbatim
# to llms/launchdarkly-llms.txt and the apis.yml pointer now targets it.
llms:
  published: true
  url: https://launchdarkly.com/docs/llms.txt
  file: launchdarkly-llms.txt
  probed: '2026-08-27'
  http_status: 200
  content_type: text/plain; charset=utf-8
  bytes: 40348
  lines: 974
  verdict: real
  method: searched
  content:
    format: llms.txt
    scope: >-
      Complete index of the LaunchDarkly product documentation — Home, SDK, guides,
      tutorials and integrations — as titled links with one-line descriptions.
    excludes: >-
      The REST API reference is deliberately NOT in this file. The document says so in its
      own header and points to https://launchdarkly.com/docs/api instead.
    extra_affordances:
      - >-
        Declares a markdown convention: append .md to any https://launchdarkly.com/docs/
        URL to get clean Markdown of that page. Verified working on eight docs pages
        during this pass.
      - >-
        Names an MCP endpoint for AI clients in its header
        (https://launchdarkly.com/_mcp/server) — an llms.txt that points at a live agent
        surface rather than only at documents.
  negative_probes:
    - url: https://apidocs.launchdarkly.com/llms.txt
      probed: '2026-08-27'
      http_status: 200
      content_type: text/html
      bytes: 72904
      verdict: soft-404
      note: >-
        Identical shell to every other path on this host. A 200 is not evidence. This is
        the URL the apis.yml LlmsText pointer used to name.
    - url: https://launchdarkly.com/llms.txt
      probed: '2026-08-27'
      http_status: 404
    - url: https://launchdarkly.com/_mcp/server/
      probed: '2026-08-27'
      http_status: 404
      note: >-
        The docs-MCP endpoint advertised in the llms.txt header does not answer a
        JSON-RPC tools/list on the marketing host — a GET 308-redirects to a trailing
        slash which then 404s. LaunchDarkly's REAL, working MCP server is
        https://mcp.launchdarkly.com/mcp/launchdarkly (see mcp/launchdarkly-mcp.yml).
        Recorded as a genuine defect in the provider's own llms.txt, not as our failure.

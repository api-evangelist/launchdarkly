naftiko: 1.0.0-alpha2
info:
  label: LaunchDarkly REST API — Code References
  description: 'LaunchDarkly REST API — Code References. 1 operations. Lead operation: List code reference repositories. Self-contained
    Naftiko capability covering one Launchdarkly business surface.'
  tags:
  - Launchdarkly
  - Code References
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LAUNCHDARKLY_API_KEY: LAUNCHDARKLY_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-code-references
    baseUri: https://app.launchdarkly.com/api/v2
    description: LaunchDarkly REST API — Code References business capability. Self-contained, no shared references.
    resources:
    - name: code-refs-repositories
      path: /code-refs/repositories
      operations:
      - name: listcodereferencerepositories
        method: GET
        description: List code reference repositories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.LAUNCHDARKLY_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-code-references-rest
    port: 8080
    description: REST adapter for LaunchDarkly REST API — Code References. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/code-refs/repositories
      name: code-refs-repositories
      description: REST surface for code-refs-repositories.
      operations:
      - method: GET
        name: listcodereferencerepositories
        description: List code reference repositories
        call: rest-code-references.listcodereferencerepositories
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-code-references-mcp
    port: 9090
    transport: http
    description: MCP adapter for LaunchDarkly REST API — Code References. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-code-reference-repositories
      description: List code reference repositories
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-code-references.listcodereferencerepositories
      outputParameters:
      - type: object
        mapping: $.

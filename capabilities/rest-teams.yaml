naftiko: 1.0.0-alpha2
info:
  label: LaunchDarkly REST API — Teams
  description: 'LaunchDarkly REST API — Teams. 2 operations. Lead operation: List teams. Self-contained Naftiko capability
    covering one Launchdarkly business surface.'
  tags:
  - Launchdarkly
  - Teams
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LAUNCHDARKLY_API_KEY: LAUNCHDARKLY_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-teams
    baseUri: https://app.launchdarkly.com/api/v2
    description: LaunchDarkly REST API — Teams business capability. Self-contained, no shared references.
    resources:
    - name: teams
      path: /teams
      operations:
      - name: listteams
        method: GET
        description: List teams
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Maximum number of teams to return.
        - name: offset
          in: query
          type: integer
          description: Number of teams to skip for pagination.
        - name: filter
          in: query
          type: string
          description: A filter expression to apply to the team list.
      - name: createteam
        method: POST
        description: Create a team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.LAUNCHDARKLY_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-teams-rest
    port: 8080
    description: REST adapter for LaunchDarkly REST API — Teams. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/teams
      name: teams
      description: REST surface for teams.
      operations:
      - method: GET
        name: listteams
        description: List teams
        call: rest-teams.listteams
        with:
          limit: rest.limit
          offset: rest.offset
          filter: rest.filter
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createteam
        description: Create a team
        call: rest-teams.createteam
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-teams-mcp
    port: 9090
    transport: http
    description: MCP adapter for LaunchDarkly REST API — Teams. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-teams
      description: List teams
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-teams.listteams
      with:
        limit: tools.limit
        offset: tools.offset
        filter: tools.filter
      outputParameters:
      - type: object
        mapping: $.
    - name: create-team
      description: Create a team
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-teams.createteam
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.

    - name: flags-projectKey-flagKey-triggers-environmentKey
      path: /flags/{projectKey}/{flagKey}/triggers/{environmentKey}
      operations:
      - name: listflagtriggers
        method: GET
        description: List flag triggers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createflagtrigger
        method: POST
        description: Create a flag trigger
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body

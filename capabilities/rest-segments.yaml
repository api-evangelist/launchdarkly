      call: rest-segments.getsegment
      outputParameters:
      - type: object
        mapping: $.
    - name: update-segment
      description: Update a segment
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rest-segments.patchsegment
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-segment
      description: Delete a segment
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: rest-segments.deletesegment
      outputParameters:
      - type: object
        mapping: $.

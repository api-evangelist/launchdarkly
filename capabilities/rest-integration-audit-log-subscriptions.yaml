naftiko: 1.0.0-alpha2
info:
  label: LaunchDarkly REST API — Integration Audit Log Subscriptions
  description: 'LaunchDarkly REST API — Integration Audit Log Subscriptions. 1 operations. Lead operation: List integration
    audit log subscriptions. Self-contained Naftiko capability covering one Launchdarkly business surface.'
  tags:
  - Launchdarkly
  - Integration Audit Log Subscriptions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LAUNCHDARKLY_API_KEY: LAUNCHDARKLY_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-integration-audit-log-subscriptions
    baseUri: https://app.launchdarkly.com/api/v2
    description: LaunchDarkly REST API — Integration Audit Log Subscriptions business capability. Self-contained, no shared
      references.
    resources:
    - name: integrations-integrationKey-subscriptions
      path: /integrations/{integrationKey}/subscriptions
      operations:
      - name: listintegrationsubscriptions
        method: GET
        description: List integration audit log subscriptions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: integrationKey
          in: path
          type: string
          description: The key identifying the integration type.
          required: true
    authentication:
      type: bearer
      token: '{{env.LAUNCHDARKLY_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-integration-audit-log-subscriptions-rest
    port: 8080
    description: REST adapter for LaunchDarkly REST API — Integration Audit Log Subscriptions. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/integrations/{integrationkey}/subscriptions
      name: integrations-integrationkey-subscriptions
      description: REST surface for integrations-integrationKey-subscriptions.
      operations:
      - method: GET
        name: listintegrationsubscriptions
        description: List integration audit log subscriptions
        call: rest-integration-audit-log-subscriptions.listintegrationsubscriptions
        with:
          integrationKey: rest.integrationKey
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-integration-audit-log-subscriptions-mcp
    port: 9090
    transport: http
    description: MCP adapter for LaunchDarkly REST API — Integration Audit Log Subscriptions. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: list-integration-audit-log-subscriptions
      description: List integration audit log subscriptions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-integration-audit-log-subscriptions.listintegrationsubscriptions
      with:
        integrationKey: tools.integrationKey
      outputParameters:
      - type: object
        mapping: $.

      type: bearer
      token: '{{env.LAUNCHDARKLY_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-workflows-rest
    port: 8080
    description: REST adapter for LaunchDarkly REST API — Workflows. One Spectral-compliant resource per consumed operation,

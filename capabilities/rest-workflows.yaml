  description: 'LaunchDarkly REST API — Workflows. 1 operations. Lead operation: List workflows. Self-contained Naftiko capability
    covering one Launchdarkly business surface.'
  tags:
  - Launchdarkly
  - Workflows
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LAUNCHDARKLY_API_KEY: LAUNCHDARKLY_API_KEY
capability:

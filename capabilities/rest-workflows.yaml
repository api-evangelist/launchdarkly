    port: 9090
    transport: http
    description: MCP adapter for LaunchDarkly REST API — Workflows. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-workflows
      description: List workflows
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-workflows.listworkflows
      outputParameters:
      - type: object
        mapping: $.

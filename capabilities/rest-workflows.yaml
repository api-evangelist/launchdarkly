    resources:
    - path: /v1/projects/{projectkey}/flags/{flagkey}/environments/{environmentkey}/workflows
      name: projects-projectkey-flags-flagkey-environments-environmentkey-workflows
      description: REST surface for projects-projectKey-flags-flagKey-environments-environmentKey-workflows.
      operations:
      - method: GET
        name: listworkflows
        description: List workflows
        call: rest-workflows.listworkflows
        outputParameters:
        - type: object
          mapping: $.

  - type: http
    namespace: rest-workflows
    baseUri: https://app.launchdarkly.com/api/v2
    description: LaunchDarkly REST API — Workflows business capability. Self-contained, no shared references.
    resources:
    - name: projects-projectKey-flags-flagKey-environments-environmentKey-workflows
      path: /projects/{projectKey}/flags/{flagKey}/environments/{environmentKey}/workflows
      operations:
      - name: listworkflows
        method: GET
        description: List workflows
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.

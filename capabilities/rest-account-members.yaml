naftiko: 1.0.0-alpha2
info:
  label: LaunchDarkly REST API — Account Members
  description: 'LaunchDarkly REST API — Account Members. 2 operations. Lead operation: List account members. Self-contained
    Naftiko capability covering one Launchdarkly business surface.'
  tags:
  - Launchdarkly
  - Account Members
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LAUNCHDARKLY_API_KEY: LAUNCHDARKLY_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-account-members
    baseUri: https://app.launchdarkly.com/api/v2
    description: LaunchDarkly REST API — Account Members business capability. Self-contained, no shared references.
    resources:
    - name: members
      path: /members
      operations:
      - name: listmembers
        method: GET
        description: List account members
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Maximum number of members to return.
        - name: offset
          in: query
          type: integer
          description: Number of members to skip for pagination.
        - name: filter
          in: query
          type: string
          description: A filter expression to apply to the member list.
      - name: invitemember
        method: POST
        description: Invite a new member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.LAUNCHDARKLY_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-account-members-rest
    port: 8080
    description: REST adapter for LaunchDarkly REST API — Account Members. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/members
      name: members
      description: REST surface for members.
      operations:
      - method: GET
        name: listmembers
        description: List account members
        call: rest-account-members.listmembers
        with:
          limit: rest.limit
          offset: rest.offset
          filter: rest.filter
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: invitemember
        description: Invite a new member
        call: rest-account-members.invitemember
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-account-members-mcp
    port: 9090
    transport: http
    description: MCP adapter for LaunchDarkly REST API — Account Members. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-account-members
      description: List account members
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-account-members.listmembers
      with:
        limit: tools.limit
        offset: tools.offset
        filter: tools.filter
      outputParameters:
      - type: object
        mapping: $.
    - name: invite-new-member
      description: Invite a new member
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-account-members.invitemember
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.

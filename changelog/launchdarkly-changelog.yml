note: >-
  LaunchDarkly maintains TWO changelogs and they answer different questions. The product
  changelog below is dated, attributed and filterable by topic. The API VERSION changelog
  — the one that tells an integrator whether their code will break — lives inside
  info.description of https://app.launchdarkly.com/api/v2/openapi.json and is recorded in
  lifecycle/launchdarkly-lifecycle.yml with its EOL dates.

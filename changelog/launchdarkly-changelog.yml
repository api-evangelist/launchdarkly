entries:
  - date: '2026-08-26'
    topic: AI Engineering
    author: Paul Loeb
    title: Use AgentControl from your Go and Java applications
    kind: addition
    breaking: false
    highlights: >-
      AI SDKs released for Go and Java. Prompts, model settings and targeting rules move
      out of code into AgentControl configs; both SDKs report generation counts, token
      usage, latency and errors, and both run multi-step agent graphs.
  - date: '2026-08-26'
    topic: AI Engineering
    author: Paul Loeb
    title: Serve different models to different users through your LiteLLM gateway
    kind: addition
    breaking: false
    highlights: >-
      Per-request model, prompt and parameter selection through an existing LiteLLM
      gateway, without editing YAML, restarting the proxy or deploying code. Changes are
      attributed and approval-gated like any flag change.
  - date: '2026-08-26'
    topic: AI Engineering
    author: Paul Loeb
    title: AgentControl now supports EU data residency
    kind: addition
    breaking: false
    highlights: >-
      Prompts, configs, variations and targeting rules can now be managed in the EU
      instance, with the same approval workflows and audit history as feature flags.
      Model choices are limited to providers approved for the region.
  - date: '2026-08-26'
    topic: AI Engineering
    author: Paul Loeb
    title: Read a full agent run as a single conversation
    kind: addition
    breaking: false
  - date: '2026-08-26'
    topic: AI Engineering
    author: Paul Loeb
    title: Use your Amazon Bedrock models in AgentControl
    kind: addition
    breaking: false
window:
  from: '2026-08-26'
  to: '2026-08-26'
  entries_captured: 5
  note: >-
    Only the server-rendered first page was harvestable; the site paginates the rest with
    JavaScript. All five most recent entries are AgentControl/AI, which is itself the
    finding — LaunchDarkly's shipping velocity in August 2026 is almost entirely on the
    agent-control surface, not on feature flags.
recent_api_changes:
  last_breaking_version: '20240415'
  last_breaking_date: '2024-04-15'
  note: >-
    No breaking REST API version has shipped in roughly 28 months. The product surface
    moves weekly; the API contract's version axis has been still since April 2024, and
    new capability arrives as new (beta) tags inside the current version rather than as a
    new version.

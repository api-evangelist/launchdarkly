tags:
- name: IP Allowlist (beta)
  description: '> ### This feature is in beta

    >

    > To use this feature, pass in a header including the `LD-API-Version` key with value set to `beta`. Use this header with each call. To learn more, read Beta resources.

    >

    > Resources that are in beta are still undergoing testing and development. They may change without notice, including becoming backwards incompatible.


    The IP allowlist feature lets you configure specific IP addresses that can access your LaunchDarkly app using a browser,

    the LaunchDarkly REST API, or both. This gives you control over the locations from which

    your members can access their LaunchDarkly account.


    The IP allowlist supports both individual IP addresses and classless inter-domain routing (CIDR) ranges. The

    allowlist only supports IPv4 values.


    Use of the IP allowlist is an Enterprise and Guardian feature.


    To learn more, read IP allowlist.'
paths:
  /api/v2/account/ip-allowlist:
    get:
      description: Get the current IP allowlist configuration and entries.
      operationId: getIpAllowlist
      parameters:
      - description: A case-insensitive substring to filter entries by. Matches against the IP address or CIDR block and the description.
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: The number of entries to return. Defaults to 20. Maximum is 100.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: The number of entries to skip. Used for pagination.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpAllowlistResponse'
          description: IP allowlist configuration and entries
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid access token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Get IP Allowlist
      tags:

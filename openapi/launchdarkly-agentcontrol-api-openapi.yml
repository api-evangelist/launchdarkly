    patch:
      description: 'Edit an existing variation of an AI Config. This creates a new version of the variation.


        The request body must be a JSON object of the fields to update. The values you include replace the existing values for the fields.


        If the variation is in use in a project environment where approval settings require review for this AI Config, this endpoint returns 403 and the change must be submitted through an approval request.


        Here''s an example:

        ```

        {

        "messages": [

        {

        "role": "system",

        "content": "The new message"

        }

        ]

        }

        ```'
      operationId: patchAIConfigVariation
      parameters:
      - explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: configKey
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: variationKey
        required: true
        schema:
          type: string
        style: simple
      requestBody:

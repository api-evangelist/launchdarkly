    post:
      description: 'Create a new variation for a given AI Config.


        The model in the request body requires a modelName and parameters, for example:


        ```

        "model": {

        "modelName": "claude-3-opus-20240229",

        "parameters": {

        "max_tokens": 1024

        }

        }

        ```'
      operationId: postAIConfigVariation
      parameters:
      - explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: configKey
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIConfigVariationPost'
        description: AI Config variation object to create
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConfigVariation'
          description: AI Config variation created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate Limited
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error

tags:
- name: AgentControl
  description: 'The AgentControl API allows you to create, retrieve, and edit AgentControl configs, config variations, and AI model configurations.


    **This product name has changed, but the API has not.** AgentControl was previously called AI Configs. Resources previously called "AI Configs" are now referred to as "AgentControl configs" or "configs." This is not a breaking change to the API. Existing AI Configs API endpoints, paths, request/response bodies, and operation IDs are unchanged. Integrations that use those resources still work and do not need modification.


    An AgentControl config is a resource in LaunchDarkly that you can use to customize, test, and roll out new large language models (LLMs) within your generative AI applications. Within each config, you define one or more variations, each of which includes a model configuration and one or more messages. The model configuration can be a standard one from the list provided by LaunchDarkly, or you can define your own custom AI model configuration.


    To learn more, read AgentControl.'
paths:
  /api/v2/projects/{projectKey}/ai-configs/{configKey}/targeting:
    get:
      description: Retrieves a specific AI Config's targeting by its key
      operationId: getAIConfigTargeting
      parameters:
      - explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: configKey
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConfigTargeting'
          description: Successful response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Show an AI Config's targeting
      tags:
      - AgentControl
    patch:
      description: 'Perform a partial update to an AI Config''s targeting. The request body must be a valid semantic patch. ### Using semantic patches on an AI Config


        To make a semantic patch request, you must append `domain-model=launchdarkly.semanticpatch` to your `Content-Type` header. To learn more, read Updates using semantic patch. The body of a semantic patch request for updating an AI Config''s targeting takes the following properties:


        * `comment` (string): (Optional) A description of the update. * `environmentKey` (string): The key of the LaunchDarkly environment. * `instructions` (array): (Required) A list of actions the update should perform. Each action in the list must be an object with a `kind` property that indicates the instruction. If the action requires parameters, you must include those parameters as additional fields in the object. The body of a single semantic patch can contain many different instructions. ### Instructions


        Semantic patch requests support the following `kind` instructions for updating AI Configs. Click to expand instructions for working with targeting and variations for AI Configs


        #### addClauses


        Adds the given clauses to the rule indicated by `ruleId`. ##### Parameters


        - `ruleId`: ID of a rule in the AI Config. - `clauses`: Array of clause objects, with `contextKind` (string), `attribute` (string), `op` (string), `negate` (boolean), and `values` (array of strings, numbers, or dates) properties. The `contextKind`, `attribute`, and `values` are case sensitive. The `op` must be lower-case. Here''s an example:


        ```json

        {

        "environmentKey": "environment-key-123abc",

        "instructions": [{

        "kind": "addClauses",

        "ruleId": "a902ef4a-2faf-4eaf-88e1-ecc356708a29",

        "clauses": [{

        "contextKind": "user",

        "attribute": "country",

        "op": "in",

        "negate": false,

        "values": ["USA", "Canada"]

        }]

        }]

        }

        ```


        #### addRule


        Adds a new targeting rule to the AI Config. The rule may contain `clauses` and serve the variation that `variationId` indicates, or serve a percentage rollout that `rolloutWeights`, `rolloutBucketBy`, and `rolloutContextKind` indicate. If you set `beforeRuleId`, this adds the new rule before the indicated rule. Otherwise, adds the new rule to the end of the list. ##### Parameters


        - `clauses`: Array of clause objects, with `contextKind` (string), `attribute` (string), `op` (string), `negate` (boolean), and `values` (array of strings, numbers, or dates) properties. The `contextKind`, `attribute`, and `values` are case sensitive. The `op` must be lower-case. - `beforeRuleId`: (Optional) ID of a rule. - Either

        - `variationId`: ID of a variation. or


        - `rolloutWeights`: (Optional) Map of `variationId` to weight, in thousandths of a percent (0-100000). - `rolloutBucketBy`: (Optional) Context attribute available in the specified `rolloutContextKind`. - `rolloutContextKind`: (Optional) Context kind, defaults to `user`


        Here''s an example that uses a `variationId`:


        ```json

        {

        "environmentKey": "environment-key-123abc",

        "instructions": [{

        "kind": "addRule",

        "variationId": "2f43f67c-3e4e-4945-a18a-26559378ca00",

        "clauses": [{

        "contextKind": "organization",

        "attribute": "located_in",

        "op": "in",

        "negate": false,

        "values": ["Sweden", "Norway"]

        }]

        }]

        }

        ```


        Here''s an example that uses a percentage rollout:


        ```json

        {

        "environmentKey": "environment-key-123abc",

        "instructions": [{

        "kind": "addRule",

        "clauses": [{

        "contextKind": "organization",

        "attribute": "located_in",

        "op": "in",

        "negate": false,

        "values": ["Sweden", "Norway"]

        }],

        "rolloutContextKind": "organization",

        "rolloutWeights": {

        "2f43f67c-3e4e-4945-a18a-26559378ca00": 15000, // serve 15% this variation

        "e5830889-1ec5-4b0c-9cc9-c48790090c43": 85000 // serve 85% this variation

        }

        }]

        }

        ```


        #### addTargets


        Adds context keys to the individual context targets for the context kind that `contextKind` specifies and the variation that `variationId` specifies. Returns an error if this causes the AI Config to target the same context key in multiple variations.'
      operationId: patchAIConfigTargeting
      parameters:
      - explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: configKey
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIConfigTargetingPatch'
        description: AI Config targeting semantic patch instructions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConfigTargeting'
          description: AI Config targeting updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Update AI Config targeting
      tags:
      - AgentControl
  /api/v2/projects/{projectKey}/ai-configs:
    get:

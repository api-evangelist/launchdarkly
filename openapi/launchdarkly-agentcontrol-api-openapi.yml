      - explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIConfigPost'
        description: AI Config object to create
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:

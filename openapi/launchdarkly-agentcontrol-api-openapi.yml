        style: simple
      - description: A sort to apply to the list of AgentControl configs.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          type: string
        style: form
      - description: The number of resources to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      - description: A filter to apply to the list.
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:

      tags:
      - AgentControl
    patch:
      description: 'Edit an existing AI Config.


        The request body must be a JSON object of the fields to update. The values you include replace the existing values for the fields.


        Here''s an example:

        ```

        {

        "description": "Example updated description",

        "tags": ["new-tag"]

        }

        ```'
      operationId: patchAIConfig
      parameters:
      - explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: configKey
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIConfigPatch'
        description: AI Config object to update
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConfig'
          description: AI Config updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Update AI Config
      tags:
      - AgentControl

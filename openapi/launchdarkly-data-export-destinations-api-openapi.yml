          type: string
          format: string
          description: The project key
      - name: envKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      - name: kind
        in: path
        description: The destination kind (snowflake-v2, redshift, clickhouse)
        required: true
        schema:

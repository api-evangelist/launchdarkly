        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Data Export destinations
      summary: Create Data Export destination
      description: 'Create a new Data Export destination.


        In the `config` request body parameter, the fields required depend on the type of Data Export destination.


        Click to expand config parameter details


        #### Azure Event Hubs


        To create a Data Export destination with a `kind` of `azure-event-hubs`, the `config` object requires the following fields:


        * `namespace`: The Event Hub Namespace name

        * `name`: The Event Hub name

        * `policyName`: The shared access signature policy name. You can find your policy name in the settings of your Azure Event Hubs Namespace.

        * `policyKey`: The shared access signature key. You can find your policy key in the settings of your Azure Event Hubs Namespace.


        #### Google Cloud Pub/Sub


        To create a Data Export destination with a `kind` of `google-pubsub`, the `config` object requires the following fields:


        * `project`: The Google PubSub project ID for the project to publish to

        * `topic`: The Google PubSub topic ID for the topic to publish to


        #### Amazon Kinesis


        To create a Data Export destination with a `kind` of `kinesis`, the `config` object requires the following fields:


        * `region`: The Kinesis stream''s AWS region key

        * `roleArn`: The Amazon Resource Name (ARN) of the AWS role that will be writing to Kinesis

        * `streamName`: The name of the Kinesis stream that LaunchDarkly is sending events to. This is not the ARN of the stream.


        #### mParticle


        To create a Data Export destination with a `kind` of `mparticle`, the `config` object requires the following fields:


        * `apiKey`: The mParticle API key

        * `secret`: The mParticle API secret

        * `userIdentity`: The type of identifier you use to identify your end users in mParticle

        * `anonymousUserIdentity`: The type of identifier you use to identify your anonymous end users in mParticle


        #### Segment


        To create a Data Export destination with a `kind` of `segment`, the `config` object requires the following fields:


        * `writeKey`: The Segment write key. This is used to authenticate LaunchDarkly''s calls to Segment.


        #### Snowflake


        To create a Data Export destination with a `kind` of `snowflake-v2`, the `config` object requires the following fields:


        * `publicKey`: The `publicKey` is returned as part of the Generate Snowflake destination key pair response. It is the `public_key` field.

        * `snowflakeHostAddress`: Your Snowflake account URL.'
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationPost'
            example:
              config:
                project: test-prod
                topic: ld-pubsub-test-192301
              kind: google-pubsub
        required: true
      operationId: postDestination
  /api/v2/destinations/{projectKey}/{environmentKey}/{id}:
    get:
      responses:
        '200':
          description: Destination response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Data Export destinations
      summary: Get destination
      description: Get a single Data Export destination by ID. The destination must belong to the environment in the URL. Otherwise, the response is 404.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      - name: id
        in: path
        description: The Data Export destination ID
        required: true
        schema:
          type: string
          format: string
          description: The Data Export destination ID
      operationId: getDestination
    patch:
      responses:
        '200':
          description: Destination response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Data Export destinations
      summary: Update Data Export destination
      description: Update a Data Export destination. The destination must belong to the environment in the URL. Otherwise, the response is 404. Updating a destination uses a JSON patch or JSON merge patch representation of the desired changes. To learn more, read Updates.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      - name: id
        in: path
        description: The Data Export destination ID
        required: true
        schema:
          type: string
          format: string
          description: The Data Export destination ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
            example:
            - op: replace
              path: /config/topic
              value: ld-pubsub-test-192302
        required: true
      operationId: patchDestination
    delete:
      responses:
        '204':
          description: Destination response
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Data Export destinations
      summary: Delete Data Export destination
      description: Delete a Data Export destination by ID. The destination must belong to the environment in the URL. Otherwise, the response is 404.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      - name: id
        in: path
        description: The Data Export destination ID
        required: true
        schema:
          type: string
          format: string
          description: The Data Export destination ID
      operationId: deleteDestination
components:
  schemas:
    JSONPatch:
      type: array
      items:
        $ref: '#/components/schemas/PatchOperation'
    AccessDenied:
      type: object
      required:
      - action
      - reason
      properties:
        action:
          $ref: '#/components/schemas/ActionIdentifier'
        reason:
          $ref: '#/components/schemas/AccessDeniedReason'
    Destination:
      type: object
      properties:
        _id:
          type: string
          description: The ID of this Data Export destination
          example: 610addeadbeefaa86ec9a7d4
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
          example:
            parent:
              href: /api/v2/destinations
              type: application/json
            self:
              href: /api/v2/destinations/my-project/my-environment/610addeadbeefaa86ec9a7d4
              type: application/json
        name:
          type: string
          description: A human-readable name for your Data Export destination
          example: example-destination
        kind:
          type: string
          description: The type of Data Export destination
          example: google-pubsub
          enum:
          - google-pubsub
          - kinesis
          - mparticle
          - segment
          - azure-event-hubs
          - snowflake-v2
          - databricks
          - bigquery
          - redshift
        version:
          type: number
          example: 1
        config:
          description: An object with the configuration parameters required for the destination type
          example: '{"project":"test-prod","topic":"ld-pubsub-test-192301"}'
        'on':
          type: boolean
          description: Whether the export is on, that is, the status of the integration
          example: true
        createdAt:
          description: Timestamp of when the Data Export destination was created (as Unix milliseconds since epoch)
          example: '1628001602644'
          $ref: '#/components/schemas/UnixMillis'
        maintainerId:
          type: string
          description: The ID of the member who maintains this Data Export destination
          example: 569f183514f4432160000007
        _access:
          description: Details on the allowed and denied actions for this Data Export destination
          $ref: '#/components/schemas/Access'
        completedArtifacts:
          description: For completed Redshift Data Export destinations, the SQL setup script and S3 staging bucket name rehydrated from the persisted config. Omitted otherwise.
          $ref: '#/components/schemas/RedshiftDataExportCompletedArtifactsRep'
    GenerateTrustPolicyPostRep:
      type: object
      properties:
        awsTrustPolicy:
          description: The AWS trust policy
          $ref: '#/components/schemas/TrustPolicyDetails'
    InvalidRequestErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: invalid_request
        message:
          type: string
          description: Description of the error
          example: Invalid request body
    DestinationPost:
      type: object
      properties:
        name:
          type: string
          description: A human-readable name for your Data Export destination
          example: example-destination
        kind:
          type: string
          description: The type of Data Export destination
          example: google-pubsub
          enum:
          - google-pubsub
          - kinesis
          - mparticle
          - segment
          - azure-event-hubs
          - snowflake-v2
          - databricks
          - bigquery
          - redshift
        config:
          description: An object with the configuration parameters required for the destination type
          example: '{"project":"test-prod","topic":"ld-pubsub-test-192301"}'
        'on':
          type: boolean
          description: Whether the export is on. Displayed as the integration status in the LaunchDarkly UI.
          example: true
    RateLimitedErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: rate_limited
        message:

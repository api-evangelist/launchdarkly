          type: string
          format: string
          description: The environment key
      - name: kind
        in: path
        description: The destination kind (snowflake-v2, bigquery, clickhouse, redshift, databricks)
        required: true
        schema:
          type: string
          format: string
          description: The destination kind (snowflake-v2, bigquery, clickhouse, redshift, databricks)

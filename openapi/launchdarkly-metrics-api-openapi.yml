openapi: 3.2.0
info:
  title: Launchdarkly Metrics API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
  description: 'Operations tagged Metrics across 2 of this provider''s published API definitions: launchdarkly-openapi.json, launchdarkly-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.launchdarkly.com
  description: ' Default'
- url: https://app.launchdarkly.us
  description: ' Federal'
- url: https://app.launchdarkly.com/api/v2
  description: LaunchDarkly Production API
tags:
- name: Metrics
  description: 'Metrics track flag behavior over time when an experiment is running. The data generated from experiments gives you more insight into the impact of a particular flag. To learn more, read Metrics.


    Using the metrics API, you can create, delete, and manage metrics.


    > ### Metric keys and event keys are different

    >

    > LaunchDarkly automatically generates a metric key when you create a metric. You can use the metric key to identify the metric in API calls.

    >

    > Custom conversion/binary and custom numeric metrics also require an event key. You can set the event key to anything you want. Adding this event key to your codebase lets your SDK track actions customers take in your app as events. To learn more, read Sending custom events.


    ### Importing metric events


    The metric import API is separate from the metrics API.


    The metric import API lets you import metric events from your data pipeline for use with Experimentation and guarded rollouts. This means you can send your already-instrumented metrics into LaunchDarkly without writing and deploying new code for each metric.


    For details on the metric import API, read Importing metric events.


    > #### The metric import API uses a different base URL

    >

    > The metric import API differs from other LaunchDarkly REST APIs because it uses a different base URL: it requires `https://events.launchdarkly.com` rather than `https://app.launchdarkly.com`. For this reason, the metric import API is also not included as part of LaunchDarkly''s generated client libraries, and details are not included in the OpenAPI specification. To learn more, read Importing metric events.'
paths:
  /api/v2/metrics/{projectKey}:
    get:
      responses:
        '200':
          description: Metrics collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricCollectionRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
      tags:
      - Metrics
      summary: List metrics
      description: 'Get a list of all metrics for the specified project.


        ### Filtering metrics


        The `filter` parameter supports the following operators: `contains`, `equals`, `anyOf`.


        #### Supported fields and operators


        You can only filter certain fields in metrics when using the `filter` parameter. Additionally, you can only filter some fields with certain operators.


        When you search for metrics, the `filter` parameter supports the following fields and operators:


        |

        Field

        |Description |Supported operators |

        |---|---|---|

        | `dataSourceKeys` | The data source that provides events for this metric (for example, "launchdarkly-hosted"). | `anyOf`, `notEquals` |

        | `eventKeys` | The metric event key. | `anyOf` |

        | `eventKind` | The metric event kind. One of `custom`, `pageview`, `click`. | `equals` |

        | `hasConnections` | Whether the metric has connections to experiments or guarded rollouts. One of `true`, `false`. | `equals` |

        | `isNumeric` | Whether the metric is numeric. One of `true`, `false`. | `equals` |

        | `maintainerIds` | A comma-separated list of metric maintainer IDs. | `anyOf` |

        | `maintainerTeamKey` | The metric maintainer team key. | `equals` |

        | `metricUsedIn` | Filter by where the metric is used. One of `experiments`, `guarded_rollouts`, `any`, `none`. | `equals` |

        | `query` | A "fuzzy" search across metric key and name. Supply a string or list of strings to the operator. | `equals` |

        | `tags` | The metric tags. | `contains` |

        | `unitAggregationType` | The metric''s unit aggregation type. One of `sum`, `average`. | `equals` |

        | `versionIds` | The metric version number. | `anyOf` |

        | `view` | The view used to restrict access to the metric. | `equals` |


        For example, the filter `?filter=tags contains ["tag1", "tag2", "tag3"]` matches metrics that have all three tags.


        The documented values for `filter` query parameters are prior to URL encoding. For example, the `[` in `?filter=tags contains ["tag1", "tag2", "tag3"]` must be encoded to `%5B`.


        ### Expanding the metric list response


        LaunchDarkly supports expanding the "List metrics" response. By default, the expandable field is **not** included in the response.


        To expand the response, append the `expand` query parameter and add the following supported field:


        - `experimentCount` includes the number of experiments from the specific project that use the metric


        For example, `expand=experimentCount` includes the `experimentCount` field for each metric in the response.'
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: expand
        in: query
        description: A comma-separated list of properties that can reveal additional information in the response.
        schema:
          type: string
          format: string
          description: A comma-separated list of properties that can reveal additional information in the response.
      - name: limit
        in: query
        description: The number of metrics to return in the response. Defaults to 20. Maximum limit is 50.
        schema:
          type: integer
          format: int64
          description: The number of metrics to return in the response. Defaults to 20. Maximum limit is 50.
      - name: offset
        in: query
        description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and returns the next `limit` items.
        schema:
          type: integer
          format: int64
          description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and returns the next `limit` items.
      - name: sort
        in: query
        description: A field to sort the items by. Prefix field by a dash ( - ) to sort in descending order. This endpoint supports sorting by `createdAt` or `name`.
        schema:
          type: string
          format: string
          description: A field to sort the items by. Prefix field by a dash ( - ) to sort in descending order. This endpoint supports sorting by `createdAt` or `name`.
      - name: filter
        in: query
        description: A comma-separated list of filters. This endpoint accepts filtering by `query`, `tags`, `eventKind`, `isNumeric`, `unitAggregationType`, `hasConnections`, `maintainerIds`, `maintainerTeamKey`, `view`, `dataSourceKeys`, `metricUsedIn`, `eventKeys`, and `versionIds`. To learn more about the filter syntax, read the 'Filtering metrics' section above.
        schema:
          type: string
          format: string
          description: A comma-separated list of filters. This endpoint accepts filtering by `query`, `tags`, `eventKind`, `isNumeric`, `unitAggregationType`, `hasConnections`, `maintainerIds`, `maintainerTeamKey`, `view`, `dataSourceKeys`, `metricUsedIn`, `eventKeys`, and `versionIds`. To learn more about the filter syntax, read the 'Filtering metrics' section above.
      operationId: getMetrics
      security:
      - ApiKey:
        - read
        - write
    post:
      responses:
        '201':
          description: Metric response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Metrics
      summary: Create metric
      description: Create a new metric in the specified project. The expected `POST` body differs depending on the specified `kind` property.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricPost'
            example:
              eventKey: Order placed
              isNumeric: false
              key: metric-key-123abc
              kind: custom
        required: true
      operationId: postMetric
      security:
      - ApiKey:
        - read
        - write
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'
  /api/v2/metrics/{projectKey}/{metricKey}:
    get:
      responses:
        '200':
          description: Metric response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Metrics
      summary: Get metric
      description: 'Get information for a single metric from the specific project.


        ### Expanding the metric response

        LaunchDarkly supports four fields for expanding the "Get metric" response. By default, these fields are **not** included in the response.


        To expand the response, append the `expand` query parameter and add a comma-separated list with any of the following fields:


        - `experiments` includes all experiments from the specific project that use the metric

        - `experimentCount` includes the number of experiments from the specific project that use the metric

        - `metricGroups` includes all metric groups from the specific project that use the metric

        - `metricGroupCount` includes the number of metric groups from the specific project that use the metric


        For example, `expand=experiments` includes the `experiments` field in the response.'
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: metricKey
        in: path
        description: The metric key
        required: true
        schema:
          type: string
          format: string
          description: The metric key
      - name: expand
        in: query
        description: A comma-separated list of properties that can reveal additional information in the response. Supported fields are `experiments`, `experimentCount`, `metricGroups`, `metricGroupCount`, `eventSources`, `guardedRollouts`, `guardedRolloutCount`, `lastUsedInExperiment`, and `lastUsedInGuardedRollout`.
        schema:
          type: string
          format: string
          description: A comma-separated list of properties that can reveal additional information in the response. Supported fields are `experiments`, `experimentCount`, `metricGroups`, `metricGroupCount`, `eventSources`, `guardedRollouts`, `guardedRolloutCount`, `lastUsedInExperiment`, and `lastUsedInGuardedRollout`.
      - name: versionId
        in: query
        description: The specific version ID of the metric
        schema:
          type: string
          format: string
          description: The specific version ID of the metric
      operationId: getMetric
      security:
      - ApiKey:
        - read
        - write
    patch:
      responses:
        '200':
          description: Metric response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Metrics
      summary: Update metric
      description: Patch a metric by key. Updating a metric uses a JSON patch representation of the desired changes. To learn more, read Updates.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: metricKey
        in: path
        description: The metric key
        required: true
        schema:
          type: string
          format: string
          description: The metric key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
            example:
            - op: replace
              path: /name
              value: my-updated-metric
        required: true
      operationId: patchMetric
      security:
      - ApiKey:
        - read
        - write
    delete:
      responses:
        '204':
          description: Action succeeded
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Metrics
      summary: Delete metric
      description: Delete a metric by key.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: metricKey
        in: path
        description: The metric key
        required: true
        schema:
          type: string
          format: string
          description: The metric key
      operationId: deleteMetric
      security:
      - ApiKey:
        - read
        - write
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'
  /metrics/{projectKey}:
    get:
      operationId: listMetrics
      summary: List metrics
      description: Returns a list of all metrics defined in the specified project.
      tags:
      - Metrics
      parameters:
      - $ref: '#/components/parameters/ProjectKey'
      responses:
        '200':
          description: Successful response containing a list of metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
        '401':
          description: Unauthorized. Invalid or missing access token.
        '404':
          description: Project not found.
      security:
      - bearerAuth: []
    post:
      operationId: createMetric
      summary: Create a metric
      description: Creates a new metric in the specified project for use in experiments and monitoring.
      tags:
      - Metrics
      parameters:
      - $ref: '#/components/parameters/ProjectKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricBody'
      responses:
        '201':
          description: Metric created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'
        '400':
          description: Invalid request body.
        '401':
          description: Unauthorized. Invalid or missing access token.
        '409':
          description: A metric with the given key already exists.
      security:
      - bearerAuth: []
    servers:
    - url: https://app.launchdarkly.com/api/v2
      description: LaunchDarkly Production API
components:
  schemas:
    MetricRep:
      type: object
      required:
      - _id
      - _versionId
      - key
      - name
      - kind
      - _links
      - tags
      - _creationDate
      - dataSource
      properties:
        experimentCount:
          type: integer
          description: The number of experiments using this metric
          example: 0
        metricGroupCount:
          type: integer
          description: The number of metric groups using this metric
          example: 0
        activeExperimentCount:
          type: integer
          description: The number of active experiments using this metric
          example: 2
        activeGuardedRolloutCount:
          type: integer
          description: The number of active guarded rollouts using this metric
          example: 1
        _id:
          type: string
          description: The ID of this metric
          example: 5902deadbeef667524a01290
        _versionId:
          type: string
          description: The version ID of the metric
          example: version-id-123abc
        _version:
          type: integer
          description: Version of the metric
          example: 1
        key:
          type: string
          description: A unique key to reference the metric
          example: metric-key-123abc
        name:
          type: string
          description: A human-friendly name for the metric
          example: My metric
        kind:
          type: string
          description: The kind of event the metric tracks
          example: custom
          enum:
          - pageview
          - click
          - custom
          - trace
        _attachedFlagCount:
          type: integer
          description: The number of feature flags currently attached to this metric
          example: 0
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
          example:
            parent:
              href: /api/v2/metrics/my-project
              type: application/json
            self:
              href: /api/v2/metrics/my-project/my-metric
              type: application/json
        _site:
          description: Details on how to access the metric in the LaunchDarkly UI
          example: '{"href":"/my-project/metrics/my-metric/details","type":"text/html"}'
          $ref: '#/components/schemas/Link'
        _access:
          description: Details on the allowed and denied actions for this metric
          $ref: '#/components/schemas/Access'
        tags:
          type: array
          description: Tags for the metric
          items:
            type: string
          example: []
        _creationDate:
          description: Timestamp of when the metric was created
          example: '1628192791148'
          $ref: '#/components/schemas/UnixMillis'
        lastModified:
          $ref: '#/components/schemas/Modification'
        maintainerId:
          type: string
          description: The ID of the member who maintains this metric
          example: 569fdeadbeef1644facecafe
        _maintainer:
          description: Details on the member who maintains this metric
          example: '{"_links":{"self":{"href":"/api/v2/members/569fdeadbeef1644facecafe","type":"application/json"}},"_id":"569fdeadbeef1644facecafe","firstName":"Ariel","lastName":"Flores","role":"owner","email":"ariel@acme.com"}'
          $ref: '#/components/schemas/MemberSummary'
        description:
          type: string
          description: Description of the metric
        category:
          type: string
          description: The category of the metric
          example: Error monitoring
        isNumeric:
          type: boolean
          description: For custom and trace metrics, whether to track numeric changes in value against a baseline (<code>true</code>) or to track a conversion when an end user takes an action (<code>false</code>).
          example: true
        successCriteria:
          type: string
          description: For custom and trace metrics, the success criteria
          enum:
          - HigherThanBaseline
          - LowerThanBaseline
        unit:
          type: string
          description: For numeric custom and trace metrics, the unit of measure
        eventKey:
          type: string
          description: For custom metrics, the event key to use in your code
          example: Order placed
        randomizationUnits:
          type: array
          description: Deprecated, use <code>analysisUnits</code> instead.
          items:
            type: string
          example:
          - user
          deprecated: true
        analysisUnits:
          type: array
          description: An array of analysis units allowed for this metric.
          items:
            type: string
          example:
          - user
        filters:
          description: The filters narrowing down the audience based on context attributes or event properties.
          example: '{"type":"group","op":"and","values":[{"type":"contextAttribute","op":"in","contextKind":"user","attribute":"country","values":["JP"],"negate":false},{"type":"eventProperty","op":"in","attribute":"category","values":["magic-wands"],"negate":false}]}'
          $ref: '#/components/schemas/Filter'
        unitAggregationType:
          type: string
          description: The method by which multiple unit event values are aggregated
          example: average
          enum:
          - average
          - sum
          - count_distinct
        analysisType:
          type: string
          description: The method for analyzing metric events
          example: mean
          enum:
          - mean
          - percentile
        percentileValue:
          type: integer
          description: The percentile for the analysis method. An integer denoting the target percentile between 0 and 100. Required when <code>analysisType</code> is <code>percentile</code>.
          example: 95
        eventDefault:
          $ref: '#/components/schemas/MetricEventDefaultRep'
        dataSource:
          $ref: '#/components/schemas/MetricDataSourceRefRep'
        lastSeen:
          description: Timestamp of most recent data for this metric, at one-hour fidelity
          $ref: '#/components/schemas/UnixMillis'
        archived:
          type: boolean
          description: Whether the metric version is archived
        archivedAt:
          description: Timestamp when the metric version was archived
          example: '1609459200000'
          $ref: '#/components/schemas/UnixMillis'
        selector:
          type: string
          description: For click metrics, the CSS selectors
        urls:
          description: For click and pageview metrics, the target URLs
          example: '[{"kind":"exact","url":"https://www.example.com/page1"}]'
          $ref: '#/components/schemas/UrlMatchers'
        windowStartOffset:
          type: integer
          format: int64
          description: Not yet implemented - The start of the measurement window, in milliseconds relative to the unit's first exposure to a flag variation
        windowEndOffset:
          type: integer
          format: int64
          description: Not yet implemented - The end of the measurement window, in milliseconds relative to the unit's first exposure to a flag variation
        winsorLowerPercentile:
          type: number
          description: Lower winsorization percentile, expressed as a percent in the open interval (0, 100). When both bounds are set, defines a two-sided clamp range. Otherwise lower-only winsorization.
          example: 1
        winsorUpperPercentile:
          type: number
          description: Upper winsorization percentile, expressed as a percent in the open interval (0, 100). When both bounds are set, must be greater than winsorLowerPercentile.
          example: 99.5
        winsorIncludeImputed:
          type: boolean
          description: When true, the percentile bound calculation includes imputed zeros. Only meaningful when at least one bound is set and the metric includes units that didn't send events.
          example: false
        traceQuery:
          type: string
          description: For trace metrics, the trace query to use for the metric.
          example: service.name = "checkout"
        traceValueLocation:
          type: string
          description: For trace metrics, the location in the trace to use for numeric values.
          example: duration
        unitAggregationField:
          type: string
          description: For count_distinct metrics, the column to count distinct values of
        denominator:
          description: For ratio metrics, the denominator event configuration
          $ref: '#/components/schemas/MetricDenominatorRep'
        experiments:
          description: Experiments that use this metric, including those using a metric group that contains this metric
          $ref: '#/components/schemas/DependentExperimentListRep'
        metricGroups:
          type: array
          description: Metric groups that use this metric
          items:
            $ref: '#/components/schemas/DependentMetricGroupRep'
        lastUsedInExperiment:
          description: The most recent experiment that used this metric
          $ref: '#/components/schemas/DependentExperimentRep'
        lastUsedInGuardedRollout:
          description: The most recent guarded rollout that used this metric
          $ref: '#/components/schemas/DependentReleasePhaseRep'
        isActive:
          type: boolean
          description: Whether the metric is active
          example: true
        _attachedFeatures:
          type: array
          description: Details on the flags attached to this metric
          items:
            $ref: '#/components/schemas/FlagListingRep'
    JSONPatch:
      type: array
      items:
        $ref: '#/components/schemas/PatchOperation'
    AccessDenied:
      type: object
      required:
      - action
      - reason
      properties:
        action:
          $ref: '#/components/schemas/ActionIdentifier'
        reason:
          $ref: '#/components/schemas/AccessDeniedReason'
    EventFilter:
      type: object
      required:
      - type
      - op
      - values
      - negate
      properties:
        type:
          type: string
          description: Filter type. One of [contextAttribute, eventProperty, group]
          example: contextAttribute
        attribute:
          type: string
          description: If not a group node, the context attribute name or event property name to filter on
          example: country
        op:
          description: The function to perform
          example: in
          $ref: '#/components/schemas/Operator'
        values:
          type: array
          description: The context attribute / event property values or group member nodes. Numeric values must not exceed 14 decimal places.
          items: {}
          example:
          - JP
        contextKind:
          type: string
          description: For context attribute filters, the context kind.
          example: user
        negate:
          type: boolean
          description: If set, then take the inverse of the operator. 'in' becomes 'not in'.
          example: false
    MetricCollectionRep:
      type: object
      properties:
        items:
          type: array
          description: An array of metrics
          items:
            $ref: '#/components/schemas/MetricListingRep'
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
          example:
            self:
              href: /api/v2/metrics/my-project?limit=20
              type: application/json
        totalCount:
          type: integer
    UrlMatcher:
      additionalProperties: {}
      type: object

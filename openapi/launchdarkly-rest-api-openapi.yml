components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        LaunchDarkly API access token. Create personal or service
        tokens in the LaunchDarkly dashboard under Account Settings.
  parameters:
    ProjectKey:
      name: projectKey
      in: path
      required: true
      description: >-
        The project key identifying a LaunchDarkly project.
      schema:
        type: string
        pattern: '^[a-z0-9]([a-z0-9-])*$'
    FlagKey:
      name: flagKey
      in: path
      required: true
      description: >-
        The feature flag key identifying a specific flag.
      schema:
        type: string
        pattern: '^[a-z0-9]([a-z0-9._-])*$'
    EnvironmentKey:
      name: environmentKey
      in: path
      required: true
      description: >-
        The environment key identifying a specific environment.
      schema:
        type: string
        pattern: '^[a-z0-9]([a-z0-9-])*$'
    SegmentKey:
      name: segmentKey
      in: path
      required: true
      description: >-
        The segment key identifying a specific user segment.
      schema:
        type: string
    WebhookId:
      name: webhookId
      in: path
      required: true
      description: >-
        The unique identifier of a webhook.
      schema:
        type: string
  schemas:
    FeatureFlags:
      type: object
      description: >-
        A paginated collection of feature flags.
      properties:
        items:
          type: array
          description: >-
            The list of feature flags.
          items:
            $ref: '#/components/schemas/FeatureFlag'
        totalCount:
          type: integer
          description: >-
            The total number of feature flags matching the query.
        _links:
          $ref: '#/components/schemas/Links'
    FeatureFlag:
      type: object
      description: >-
        A feature flag with its configuration across all environments.
      properties:
        key:
          type: string
          description: >-
            The unique key identifying this feature flag.
        name:
          type: string
          description: >-
            The human-readable name of the feature flag.
        description:
          type: string
          description: >-
            A description of the feature flag purpose and behavior.
        kind:
          type: string
          description: >-
            The type of flag, such as boolean or multivariate.
          enum:
            - boolean
            - multivariate
        tags:
          type: array
          description: >-
            Tags applied to this feature flag.
          items:
            type: string
        creationDate:
          type: integer
          format: int64
          description: >-
            Unix epoch timestamp in milliseconds when the flag was created.
        variations:
          type: array
          description: >-
            The possible values this flag can serve.
          items:
            $ref: '#/components/schemas/Variation'
        temporary:
          type: boolean
          description: >-
            Whether this flag is intended to be temporary.
        archived:
          type: boolean
          description: >-
            Whether this flag has been archived.
        environments:
          type: object
          description: >-
            A map of environment keys to their flag configurations.
          additionalProperties:
            $ref: '#/components/schemas/FlagEnvironment'
        _links:
          $ref: '#/components/schemas/Links'
        _version:
          type: integer
          description: >-
            The current version number of this flag for concurrency control.
    FeatureFlagBody:
      type: object
      description: >-
        The request body for creating a new feature flag.
      required:
        - name
        - key
      properties:
        name:
          type: string
          description: >-
            The human-readable name of the feature flag.
        key:
          type: string
          description: >-
            The unique key identifying this feature flag.
          pattern: '^[a-z0-9]([a-z0-9._-])*$'
        description:
          type: string
          description: >-
            A description of the feature flag purpose.
        tags:
          type: array
          description: >-
            Tags to apply to the feature flag.
          items:
            type: string
        variations:
          type: array
          description: >-
            The variations this flag can serve.
          items:
            $ref: '#/components/schemas/Variation'
        temporary:
          type: boolean
          description: >-
            Whether this flag is intended to be temporary.
        clientSideAvailability:
          type: object
          description: >-
            Client-side SDK availability settings.
          properties:
            usingEnvironmentId:
              type: boolean
              description: >-
                Whether this flag is available to client-side SDKs
                using the environment ID.
            usingMobileKey:
              type: boolean
              description: >-
                Whether this flag is available to mobile SDKs.
        defaults:
          type: object
          description: >-
            Default variation settings for new environments.
          properties:
            onVariation:
              type: integer
              description: >-
                The index of the variation to serve when the flag is on.
            offVariation:
              type: integer
              description: >-
                The index of the variation to serve when the flag is off.
    Variation:
      type: object
      description: >-
        A single variation value that a feature flag can serve.
      properties:
        _id:
          type: string
          description: >-
            The unique identifier of this variation.
        value:
          description: >-
            The value of this variation. Can be any JSON type.
        name:
          type: string
          description: >-
            An optional human-readable name for this variation.
        description:
          type: string
          description: >-
            An optional description of this variation.
    FlagEnvironment:
      type: object
      description: >-
        The configuration of a feature flag for a specific environment.
      properties:
        on:
          type: boolean
          description: >-
            Whether the flag is currently enabled in this environment.
        archived:
          type: boolean
          description: >-
            Whether the flag is archived in this environment.
        salt:
          type: string
          description: >-
            The salt used for percentage rollout hashing.
        sel:
          type: string
          description: >-
            The selection identifier.
        lastModified:
          type: integer
          format: int64
          description: >-
            Unix epoch timestamp of the last modification.
        version:
          type: integer
          description: >-
            The version number of this flag configuration.
        targets:
          type: array
          description: >-
            Individual context targets for each variation.
          items:
            $ref: '#/components/schemas/Target'
        rules:
          type: array
          description: >-
            Targeting rules that determine which variation to serve.
          items:
            $ref: '#/components/schemas/Rule'
        fallthrough:
          type: object
          description: >-
            The default rule applied when no other rules match.
          properties:
            variation:
              type: integer
              description: >-
                The variation index to serve.
            rollout:
              $ref: '#/components/schemas/Rollout'
        offVariation:
          type: integer
          description: >-
            The variation index to serve when the flag is off.
    Target:
      type: object
      description: >-
        An individual targeting entry for a specific variation.
      properties:
        values:
          type: array
          description: >-
            The list of context keys targeted.
          items:
            type: string
        variation:
          type: integer
          description: >-
            The variation index to serve to these targets.
        contextKind:
          type: string
          description: >-
            The context kind for this target.
    Rule:
      type: object
      description: >-
        A targeting rule with clauses and a variation or rollout.
      properties:
        _id:
          type: string
          description: >-
            The unique identifier for this rule.
        clauses:
          type: array
          description: >-
            The conditions that must be met for this rule to apply.
          items:
            $ref: '#/components/schemas/Clause'
        variation:
          type: integer
          description: >-
            The variation index to serve when this rule matches.
        rollout:
          $ref: '#/components/schemas/Rollout'
        trackEvents:
          type: boolean
          description: >-
            Whether to track events for this rule.
    Clause:
      type: object
      description: >-
        A condition clause used in targeting rules.
      properties:
        attribute:
          type: string
          description: >-
            The context attribute to evaluate.
        op:
          type: string
          description: >-
            The comparison operator.
          enum:
            - in
            - endsWith
            - startsWith
            - matches
            - contains
            - lessThan
            - lessThanOrEqual
            - greaterThan
            - greaterThanOrEqual
            - before
            - after
            - segmentMatch
            - semVerEqual
            - semVerLessThan
            - semVerGreaterThan
        values:
          type: array
          description: >-
            The values to compare against.
          items: {}
        negate:
          type: boolean
          description: >-
            Whether to negate the clause.
        contextKind:
          type: string
          description: >-
            The context kind to evaluate.
    Rollout:
      type: object
      description: >-
        A percentage rollout configuration.
      properties:
        variations:
          type: array
          description: >-
            The weighted variations in this rollout.
          items:
            type: object
            properties:
              variation:
                type: integer
                description: >-
                  The variation index.
              weight:
                type: integer
                description: >-
                  The rollout weight in thousandths of a percent (0-100000).
        bucketBy:
          type: string
          description: >-
            The context attribute used for bucketing.
        contextKind:
          type: string
          description: >-
            The context kind for rollout bucketing.
    Projects:
      type: object
      description: >-
        A paginated collection of projects.
      properties:
        items:
          type: array
          description: >-
            The list of projects.
          items:
            $ref: '#/components/schemas/Project'
        totalCount:
          type: integer
          description: >-
            The total number of projects.
        _links:
          $ref: '#/components/schemas/Links'
    Project:
      type: object
      description: >-
        A LaunchDarkly project containing feature flags and environments.
      properties:
        _id:
          type: string
          description: >-
            The unique identifier of this project.
        key:
          type: string
          description: >-
            The project key.
        name:
          type: string
          description: >-
            The human-readable name of the project.
        tags:
          type: array
          description: >-
            Tags applied to this project.
          items:
            type: string
        environments:
          $ref: '#/components/schemas/Environments'
        _links:
          $ref: '#/components/schemas/Links'
    ProjectBody:
      type: object
      description: >-
        The request body for creating a new project.
      required:
        - name
        - key
      properties:
        name:
          type: string
          description: >-
            The human-readable name of the project.
        key:
          type: string
          description: >-
            The project key.
          pattern: '^[a-z0-9]([a-z0-9-])*$'
        tags:
          type: array
          description: >-
            Tags to apply to the project.
          items:
            type: string
        environments:
          type: array
          description: >-
            Initial environments to create with the project.
          items:
            $ref: '#/components/schemas/EnvironmentBody'
    Environments:
      type: object
      description: >-
        A collection of environments.
      properties:
        items:
          type: array
          description: >-
            The list of environments.
          items:
            $ref: '#/components/schemas/Environment'
        totalCount:
          type: integer
          description: >-
            The total number of environments.
        _links:
          $ref: '#/components/schemas/Links'
    Environment:
      type: object
      description: >-
        An environment within a project, such as production or staging.
      properties:
        _id:
          type: string
          description: >-
            The unique identifier of this environment.
        key:
          type: string
          description: >-
            The environment key.
        name:
          type: string
          description: >-
            The human-readable name of the environment.
        color:
          type: string
          description: >-
            The color swatch for the environment in the dashboard.
          pattern: '^[0-9a-fA-F]{6}$'
        apiKey:
          type: string
          description: >-
            The SDK key for server-side SDKs.
        mobileKey:
          type: string
          description: >-

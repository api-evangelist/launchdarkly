openapi: 3.2.0
info:
  title: Launchdarkly Approvals API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
  description: 'Operations tagged Approvals across 2 of this provider''s published API definitions: launchdarkly-openapi.json, launchdarkly-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.launchdarkly.com
  description: ' Default'
- url: https://app.launchdarkly.us
  description: ' Federal'
- url: https://app.launchdarkly.com/api/v2
  description: LaunchDarkly Production API
tags:
- name: Approvals
  description: 'An account member can request approval on changes to a flag or AgentControl config''s targeting or variations, or to a segment''s targeting. Members may be required to request approval depending on the settings in their LaunchDarkly project. Members can optionally request an approval even if it is not required.


    An approval request prevents a change from being applied without approval from another member. Select up to ten members as reviewers. Reviewers receive an email notification, but anyone with sufficient permissions can review a pending approval request. A change needs at least one approval before you can apply it. To learn more, read Approvals.


    Changes that conflict will fail if approved and applied, and the flag or segment will not be updated.


    Several of the endpoints in the approvals API require an approval request ID. The approval request ID is returned as part of the Create approval request and List approval requests for a flag responses. It is the `_id` field, or the `_id` field of each element in the `items` array. If you created the approval request as part of a workflow, you can also use a workflow ID as the approval request ID. The workflow ID is returned as part of the Create workflow and Get workflows responses. It is the `_id` field, or the `_id` field of each element in the `items` array.'
paths:
  /api/v2/approval-requests:
    get:
      responses:
        '200':
          description: Approval request collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpandableApprovalRequestsResponse'
        '400':
          description: 'Unsupported filter field. Filter field must be one of: requestorId, projectKey, notifyMemberIds, reviewStatus, or status'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Approvals
      summary: List approval requests
      description: 'Get all approval requests.


        ### Filtering approvals


        LaunchDarkly supports the `filter` query param for filtering, with the following fields:


        - `notifyMemberIds` filters for only approvals that are assigned to a member in the specified list. For example: `filter=notifyMemberIds anyOf ["memberId1", "memberId2"]`.

        - `requestorId` filters for only approvals that correspond to the ID of the member who requested the approval. For example: `filter=requestorId equals 457034721476302714390214`.

        - `resourceId` filters for only approvals that correspond to the the specified resource identifier. For example: `filter=resourceId equals proj/my-project:env/my-environment:flag/my-flag`.

        - `resourceKind` filters for only approvals that correspond to the specified resource kind. For example: `filter=resourceKind equals flag`. Currently, `flag`, `segment`, and `aiConfig` resource kinds are supported.

        - `reviewStatus` filters for only approvals which correspond to the review status in the specified list. The possible values are `approved`, `declined`, and `pending`. For example: `filter=reviewStatus anyOf ["pending", "approved"]`.

        - `status` filters for only approvals which correspond to the status in the specified list. The possible values are `pending`, `scheduled`, `failed`, and `completed`. For example: `filter=status anyOf ["pending", "scheduled"]`.


        You can also apply multiple filters at once. For example, setting `filter=projectKey equals my-project, reviewStatus anyOf ["pending","approved"]` matches approval requests which correspond to the `my-project` project key, and a review status of either `pending` or `approved`.


        ### Expanding approval response


        LaunchDarkly supports the `expand` query param to include additional fields in the response, with the following fields:


        - `flag` includes the flag the approval request belongs to

        - `project` includes the project the approval request belongs to

        - `environments` includes the environments the approval request relates to


        For example, `expand=project,flag` includes the `project` and `flag` fields in the response.'
      parameters:
      - name: filter
        in: query
        description: A comma-separated list of filters. Each filter is of the form `field operator value`. Supported fields are explained above.
        schema:
          type: string
          format: string
          description: A comma-separated list of filters. Each filter is of the form `field operator value`. Supported fields are explained above.
      - name: expand
        in: query
        description: A comma-separated list of fields to expand in the response. Supported fields are explained above.
        schema:
          type: string
          format: string
          description: A comma-separated list of fields to expand in the response. Supported fields are explained above.
      - name: limit
        in: query
        description: The number of approvals to return. Defaults to 20. Maximum limit is 200.
        schema:
          type: integer
          format: int64
          description: The number of approvals to return. Defaults to 20. Maximum limit is 200.
      - name: offset
        in: query
        description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
        schema:
          type: integer
          format: int64
          description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
      operationId: getApprovalRequests
      security:
      - ApiKey:
        - read
        - write
    post:
      responses:
        '201':
          description: Approval request response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Approvals
      summary: Create approval request
      description: 'Create an approval request.


        This endpoint requires a list of `instructions`, in semantic patch format, that will be applied when the approval request is approved and applied.


        ### Flags


        If you are creating an approval request for a flag, you can use the following `instructions`:


        - `addVariation`

        - `removeVariation`

        - `updateVariation`

        - `updateDefaultVariation`


        For details on using these instructions, read Update feature flag.


        To create an approval for a flag specific to an environment, use Create approval request for a flag.


        ### AgentControl


        If you are creating an approval request for an AgentControl config, you can use the semantic patch instructions listed under Update config targeting.


        ### Segments


        If you are creating an approval request for a segment, you can use the semantic patch instructions listed under Patch segment.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApprovalRequestRequest'
        required: true
      operationId: postApprovalRequest
      security:
      - ApiKey:
        - read
        - write
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'

      - name: projKey
        in: query
        description: Filter results to a specific project
        schema:
          type: string
          format: string
          description: Filter results to a specific project
      - name: flagKey
        in: query
        description: Filter results to a specific flag key
        schema:
          type: string
          format: string
          description: Filter results to a specific flag key
      operationId: getBranch
      security:
      - ApiKey:
        - read
        - write
    put:

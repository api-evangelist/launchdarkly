openapi: 3.2.0
info:
  title: Launchdarkly Code references API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
  description: 'Operations tagged Code references across 2 of this provider''s published API definitions: launchdarkly-openapi.json, launchdarkly-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.launchdarkly.com
  description: ' Default'
- url: https://app.launchdarkly.us
  description: ' Federal'
- url: https://app.launchdarkly.com/api/v2
  description: LaunchDarkly Production API
tags:
- name: Code references
  description: '> ### Code references is an Enterprise feature

    >

    > Code references is available to customers on an Enterprise plan. To learn more, read about our pricing. To upgrade your plan, contact Sales.


    > ### Use ld-find-code-refs

    >

    > LaunchDarkly provides the ld-find-code-refs utility that creates repository connections, generates code reference data, and creates calls to the code references API. Most customers do not need to call this API directly.


    The code references API provides access to all resources related to each connected repository, and associated feature flag code reference data for all branches. To learn more, read Code references.'
paths:
  /api/v2/code-refs/extinctions:
    get:
      responses:
        '200':
          description: Extinction collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtinctionCollectionRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Code references
      summary: List extinctions
      description: Get a list of all extinctions. LaunchDarkly creates an extinction event after you remove all code references to a flag. To learn more, read About extinction events.
      parameters:
      - name: repoName
        in: query
        description: Filter results to a specific repository
        schema:
          type: string
          format: string
          description: Filter results to a specific repository
      - name: branchName
        in: query
        description: Filter results to a specific branch. By default, only the default branch will be queried for extinctions.
        schema:
          type: string
          format: string
          description: Filter results to a specific branch. By default, only the default branch will be queried for extinctions.
      - name: projKey
        in: query
        description: Filter results to a specific project
        schema:
          type: string
          format: string
          description: Filter results to a specific project
      - name: flagKey
        in: query
        description: Filter results to a specific flag key
        schema:
          type: string
          format: string
          description: Filter results to a specific flag key
      - name: from
        in: query
        description: Filter results to a specific timeframe based on commit time, expressed as a Unix epoch time in milliseconds. Must be used with `to`.
        schema:
          type: integer
          format: int64
          description: Filter results to a specific timeframe based on commit time, expressed as a Unix epoch time in milliseconds. Must be used with `to`.
      - name: to
        in: query
        description: Filter results to a specific timeframe based on commit time, expressed as a Unix epoch time in milliseconds. Must be used with `from`.
        schema:
          type: integer
          format: int64
          description: Filter results to a specific timeframe based on commit time, expressed as a Unix epoch time in milliseconds. Must be used with `from`.
      operationId: getExtinctions
      security:
      - ApiKey:
        - read
        - write
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'
  /api/v2/code-refs/repositories:
    get:
      responses:
        '200':
          description: Repository collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryCollectionRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Code references
      summary: List repositories
      description: Get a list of connected repositories. Optionally, you can include branch metadata with the `withBranches` query parameter. Embed references for the default branch with `ReferencesForDefaultBranch`. You can also filter the list of code references by project key and flag key.
      parameters:
      - name: withBranches
        in: query
        description: If set to any value, the endpoint returns repositories with associated branch data
        schema:
          type: string
          format: string
          description: If set to any value, the endpoint returns repositories with associated branch data
      - name: withReferencesForDefaultBranch
        in: query
        description: If set to any value, the endpoint returns repositories with associated branch data, as well as code references for the default git branch
        schema:
          type: string
          format: string
          description: If set to any value, the endpoint returns repositories with associated branch data, as well as code references for the default git branch
      - name: projKey
        in: query
        description: A LaunchDarkly project key. If provided, this filters code reference results to the specified project.
        schema:
          type: string
          format: string
          description: A LaunchDarkly project key. If provided, this filters code reference results to the specified project.
      - name: flagKey
        in: query
        description: If set to any value, the endpoint returns repositories with associated branch data, as well as code references for the default git branch
        schema:
          type: string
          format: string
          description: If set to any value, the endpoint returns repositories with associated branch data, as well as code references for the default git branch
      operationId: getRepositories
      security:
      - ApiKey:
        - read
        - write
    post:
      responses:
        '200':
          description: Repository response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Code references
      summary: Create repository
      description: Create a repository with the specified name.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/repositoryPost'
        required: true
      operationId: postRepository
      security:
      - ApiKey:
        - read
        - write
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'
  /api/v2/code-refs/repositories/{repo}:

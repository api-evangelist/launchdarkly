        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Code references
      summary: Get branch
      description: Get a specific branch in a repository.
      parameters:
      - name: repo
        in: path
        description: The repository name
        required: true
        schema:
          type: string
          format: string
          description: The repository name
      - name: branch
        in: path
        description: The url-encoded branch name
        required: true
        schema:
          type: string

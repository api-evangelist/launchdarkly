          type: boolean
          description: Indicates if the holdout experiment is running and if any related experiments are running.
        createdAt:
          $ref: '#/components/schemas/UnixMillis'
        updatedAt:
          $ref: '#/components/schemas/UnixMillis'
        baseExperiment:

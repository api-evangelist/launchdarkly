openapi: 3.2.0
info:
  title: Launchdarkly Teams API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
  description: 'Operations tagged Teams across 2 of this provider''s published API definitions: launchdarkly-openapi.json, launchdarkly-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.launchdarkly.com
  description: ' Default'
- url: https://app.launchdarkly.us
  description: ' Federal'
- url: https://app.launchdarkly.com/api/v2
  description: LaunchDarkly Production API
tags:
- name: Teams
  description: '> ### Teams is an Enterprise feature

    >

    > Teams is available to customers on an Enterprise plan. To learn more, read about our pricing. To upgrade your plan, contact Sales.


    A team is a group of members in your LaunchDarkly account. Members of the team have access to various resources in LaunchDarkly, such as projects or flags, based on the role or roles you assign to the team. To learn more, read Teams.


    The Teams API allows you to create, read, update, and delete a team.


    Several of the endpoints in the Teams API require one or more member IDs. The member ID is returned as part of the List account members response. It is the `_id` field of each element in the `items` array.'
paths:
  /api/v2/teams:
    get:
      responses:
        '200':
          description: Teams collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowedErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Teams
      summary: List teams
      description: 'Return a list of teams.


        By default, this returns the first 20 teams. Page through this list with the `limit` parameter and by following the `first`, `prev`, `next`, and `last` links in the `_links` field that returns. If those links do not appear, the pages they refer to don''t exist. For example, the `first` and `prev` links will be missing from the response on the first page, because there is no previous page and you cannot return to the first page when you are already on the first page.


        ### Filtering teams


        LaunchDarkly supports the following fields for filters:


        - `query` is a string that matches against the teams'' names and keys. It is not case-sensitive.

        - A request with `query:abc` returns teams with the string `abc` in their name or key.

        - `nomembers` is a boolean that filters the list of teams who have 0 members

        - A request with `nomembers:true` returns teams that have 0 members

        - A request with `nomembers:false` returns teams that have 1 or more members


        ### Sorting teams


        LaunchDarkly supports the following fields for sorting:


        - `name` sorts by team name. It is not case-sensitive.

        - `memberCount` sorts by the number of members on the team.


        By default, the sort is in ascending order. Use `-` to sort in descending order. For example, `?sort=name` sorts the response by team name in ascending order, and `?sort=-memberCount` sorts by member count from largest to smallest. Combine fields with a comma to break ties, for example `?sort=-memberCount,name`.


        ### Expanding the teams response

        LaunchDarkly supports expanding several fields in the "List teams" response. By default, these fields are **not** included in the response.


        To expand the response, append the `expand` query parameter and add a comma-separated list with any of the following fields:


        * `members` includes the total count of members that belong to the team.

        * `roles` includes a paginated list of the custom roles that you have assigned to the team.

        * `roleAttributes` includes a list of the role attributes that you have assigned to the team.

        * `projects` includes a paginated list of the projects that the team has any write access to.

        * `maintainers` includes a paginated list of the maintainers that you have assigned to the team.


        For example, `expand=members,maintainers` includes the `members` and `maintainers` fields in the response.'
      parameters:
      - name: limit
        in: query
        description: The number of teams to return in the response. Defaults to 20.
        schema:
          type: integer
          format: int64
          description: The number of teams to return in the response. Defaults to 20.
      - name: offset
        in: query
        description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and returns the next `limit` items.
        schema:
          type: integer
          format: int64
          description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and returns the next `limit` items.
      - name: filter
        in: query
        description: A comma-separated list of filters. Each filter is constructed as `field:value`.
        schema:
          type: string
          format: string
          description: A comma-separated list of filters. Each filter is constructed as `field:value`.
      - name: sort
        in: query
        description: 'A comma-separated list of fields to sort by. Fields are sorted in ascending order by default. Prefix a field with `-` to sort in descending order. Supported fields: `name`, `memberCount`.'
        schema:
          type: string
          format: string
          description: 'A comma-separated list of fields to sort by. Fields are sorted in ascending order by default. Prefix a field with `-` to sort in descending order. Supported fields: `name`, `memberCount`.'
      - name: expand
        in: query
        description: A comma-separated list of properties that can reveal additional information in the response.
        schema:
          type: string
          format: string
          description: A comma-separated list of properties that can reveal additional information in the response.
      operationId: getTeams
      security:
      - ApiKey:
        - read
        - write
    post:
      responses:
        '201':
          description: Teams response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowedErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Teams
      summary: Create team
      description: 'Create a team. To learn more, read Creating a team.


        ### Expanding the teams response

        LaunchDarkly supports four fields for expanding the "Create team" response. By default, these fields are **not** included in the response.


        To expand the response, append the `expand` query parameter and add a comma-separated list with any of the following fields:


        * `members` includes the total count of members that belong to the team.

        * `roles` includes a paginated list of the custom roles that you have assigned to the team.

        * `projects` includes a paginated list of the projects that the team has any write access to.

        * `maintainers` includes a paginated list of the maintainers that you have assigned to the team.


        For example, `expand=members,roles` includes the `members` and `roles` fields in the response.'
      parameters:
      - name: expand
        in: query
        description: A comma-separated list of properties that can reveal additional information in the response. Supported fields are explained above.
        schema:
          type: string
          format: string
          description: A comma-separated list of properties that can reveal additional information in the response. Supported fields are explained above.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/teamPostInput'
            example:
              customRoleKeys:
              - example-role1
              - example-role2
              description: An example team
              key: team-key-123abc
              memberIDs:
              - 12ab3c45de678910fgh12345
              name: Example team
        required: true
      operationId: postTeam
      security:
      - ApiKey:
        - read
        - write
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'

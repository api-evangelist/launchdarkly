        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Teams
      summary: Update team
      description: 'Perform a partial update to a team. Updating a team uses the semantic patch format. To make a semantic patch request, you must append `domain-model=launchdarkly.semanticpatch` to your `Content-Type` header. To learn more, read Updates using semantic patch. ### Instructions


        Semantic patch requests support the following `kind` instructions for updating teams. Several of the instructions require one or more member IDs as parameters. The member ID is returned as part of the List account members response. It is the `_id` field of each element in the `items` array. Click to expand instructions for updating teams


        #### addCustomRoles


        Adds custom roles to the team. Team members will have these custom roles granted to them. ##### Parameters


        - `values`: List of custom role keys. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "addCustomRoles",

        "values": [ "example-custom-role" ]

        }]

        }

        ```


        #### addMembers


        Adds members to the team. ##### Parameters


        - `values`: List of member IDs to add. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "addMembers",

        "values": [ "1234a56b7c89d012345e678f", "507f1f77bcf86cd799439011" ]

        }]

        }

        ```


        #### addPermissionGrants


        Adds permission grants to members for the team. For example, a permission grant could allow a member to act as a team maintainer. A permission grant may have either an `actionSet` or a list of `actions` but not both at the same time. The members do not have to be team members to have a permission grant for the team. ##### Parameters


        - `actionSet`: Name of the action set. - `actions`: List of actions. - `memberIDs`: List of member IDs. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "addPermissionGrants",

        "actions": [ "updateTeamName", "updateTeamDescription" ],

        "memberIDs": [ "1234a56b7c89d012345e678f", "507f1f77bcf86cd799439011" ]

        }]

        }

        ```


        #### addRoleAttribute


        Adds a role attribute to a team. Team members will have these role attribute values scoped for all custom roles granted to them. ##### Parameters


        - `key`: The role attribute key to add. - `values`: List of role attribute values for that key. Here''s an example:


        ```json

        {

        "instructions": [

        {

        "kind": "addRoleAttribute",

        "key": "testAttribute",

        "values": ["someNewValue", "someOtherNewValue"]

        }

        ]

        }

        ```


        #### removeCustomRoles


        Removes custom roles from the team. The app will no longer grant these custom roles to the team members. ##### Parameters


        - `values`: List of custom role keys. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "removeCustomRoles",

        "values": [ "example-custom-role" ]

        }]

        }

        ```


        #### removeMembers


        Removes members from the team. ##### Parameters


        - `values`: List of member IDs to remove. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "removeMembers",

        "values": [ "1234a56b7c89d012345e678f", "507f1f77bcf86cd799439011" ]

        }]

        }

        ```


        #### removePermissionGrants


        Removes permission grants from members for the team. A permission grant may have either an `actionSet` or a list of `actions` but not both at the same time. The `actionSet` and `actions` must match an existing permission grant. ##### Parameters


        - `actionSet`: Name of the action set. - `actions`: List of actions. - `memberIDs`: List of member IDs. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "removePermissionGrants",

        "actions": [ "updateTeamName", "updateTeamDescription" ],

        "memberIDs": [ "1234a56b7c89d012345e678f", "507f1f77bcf86cd799439011" ]

        }]

        }

        ```


        #### removeRoleAttribute


        Removes a role attribute from the team. ##### Parameters


        - `key`: The role attribute key to remove. Here''s an example:

        ```json

        {

        "instructions": [

        {

        "kind": "removeRoleAttribute",

        "key": "testAttribute"

        }

        ]

        }

        ```


        #### replaceMembers


        Replaces the existing members of the team with the new members. ##### Parameters


        - `values`: List of member IDs of the new members.'
      parameters:
      - name: teamKey
        in: path
        description: The team key
        required: true
        schema:
          type: string
          format: string
          description: The team key
      - name: expand
        in: query
        description: A comma-separated list of properties that can reveal additional information in the response. Supported fields are explained above.
        schema:
          type: string
          format: string
          description: A comma-separated list of properties that can reveal additional information in the response. Supported fields are explained above.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/teamPatchInput'
            example:
              comment: Optional comment about the update
              instructions:
              - kind: updateDescription
                value: New description for the team
        required: true
      operationId: patchTeam
      security:
      - ApiKey:
        - read
        - write
    delete:
      responses:
        '204':

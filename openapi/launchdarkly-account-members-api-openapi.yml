openapi: 3.2.0
info:
  title: Launchdarkly Account members API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
  description: 'Operations tagged Account members across 2 of this provider''s published API definitions: launchdarkly-openapi.json, launchdarkly-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.launchdarkly.com
  description: ' Default'
- url: https://app.launchdarkly.us
  description: ' Federal'
- url: https://app.launchdarkly.com/api/v2
  description: LaunchDarkly Production API
tags:
- name: Account members
  description: 'The account members API allows you to invite new members to an account by making a `POST` request to `/api/v2/members`. When you invite a new member to an account, an invitation is sent to the email you provided. Members with Admin or Owner roles may create new members, as well as anyone with a `createMember` permission for "member/\*". To learn more, read LaunchDarkly account members.


    Any member may request the complete list of account members with a `GET` to `/api/v2/members`.


    Several of the endpoints in the account members API require a member ID. The member ID is returned as part of the Invite new members and List account members responses. It is the `_id` field of each element in the `items` array.'
paths:
  /api/v2/members:
    get:
      responses:
        '200':
          description: Members collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Members'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Account members
      summary: List account members
      description: 'Return a list of account members.


        By default, this returns the first 20 members. Page through this list with the `limit` parameter and by following the `first`, `prev`, `next`, and `last` links in the returned `_links` field. These links are not present if the pages they refer to don''t exist. For example, the `first` and `prev` links will be missing from the response on the first page.


        ### Filtering members


        LaunchDarkly supports the following fields for filters:


        - `query` is a string that matches against the members'' emails and names. It is not case sensitive.

        - `role` is a `|` separated list of roles and custom roles. It filters the list to members who have any of the roles in the list. For the purposes of this filtering, `Owner` counts as `Admin`.

        - `id` is a `|` separated list of member IDs. It filters the list to members who match any of the IDs in the list.

        - `email` is a `|` separated list of member emails. It filters the list to members who match any of the emails in the list.

        - `team` is a string that matches against the key of the teams the members belong to. It is not case sensitive.

        - `noteam` is a boolean that filters the list of members who are not on a team if true and members on a team if false.

        - `lastSeen` is a JSON object in one of the following formats:

        - `{"never": true}` - Members that have never been active, such as those who have not accepted their invitation to LaunchDarkly, or have not logged in after being provisioned via SCIM.

        - `{"noData": true}` - Members that have not been active since LaunchDarkly began recording last seen timestamps.

        - `{"before": 1608672063611}` - Members that have not been active since the provided value, which should be a timestamp in Unix epoch milliseconds.

        - `accessCheck` is a string that represents a specific action on a specific resource and is in the format `:`. It filters the list to members who have the ability to perform that action on that resource. Note: `accessCheck` is only supported in API version `20220603` and earlier. To learn more, read Versioning.

        - For example, the filter `accessCheck:createApprovalRequest:proj/default:env/test:flag/alternate-page` matches members with the ability to create an approval request for the `alternate-page` flag in the `test` environment of the `default` project.

        - Wildcard and tag filters are not supported when filtering for access.


        For example, the filter `query:abc,role:admin|customrole` matches members with the string `abc` in their email or name, ignoring case, who also are either an `Owner` or `Admin` or have the custom role `customrole`.


        ### Sorting members


        LaunchDarkly supports two fields for sorting: `displayName` and `lastSeen`:


        - `displayName` sorts by first + last name, using the member''s email if no name is set.

        - `lastSeen` sorts by the `_lastSeen` property. LaunchDarkly considers members that have never been seen or have no data the oldest.


        ### Expanding the members response

        LaunchDarkly supports two fields for expanding the "List members" response. By default, these fields are **not** included in the response.


        To expand the response, append the `expand` query parameter and add a comma-separated list with any of the following fields:


        * `customRoles` includes a list of the roles that you have assigned to the member.

        * `roleAttributes` includes a list of the role attributes that you have assigned to the member.


        For example, `expand=roleAttributes` includes `roleAttributes` field in the response.'
      parameters:
      - name: limit
        in: query
        description: The number of members to return in the response. Defaults to 20.
        schema:
          type: integer
          format: int64
          description: The number of members to return in the response. Defaults to 20.
      - name: offset
        in: query
        description: Where to start in the list. This is for use with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
        schema:
          type: integer
          format: int64
          description: Where to start in the list. This is for use with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
      - name: filter
        in: query
        description: A comma-separated list of filters. Each filter is of the form `field:value`. Supported fields are explained above.
        schema:
          type: string
          format: string
          description: A comma-separated list of filters. Each filter is of the form `field:value`. Supported fields are explained above.
      - name: expand
        in: query
        description: A comma-separated list of properties that can reveal additional information in the response.
        schema:
          type: string
          format: string
          description: A comma-separated list of properties that can reveal additional information in the response.
      - name: sort
        in: query
        description: A comma-separated list of fields to sort by. Fields prefixed by a dash ( - ) sort in descending order.
        schema:
          type: string
          format: string
          description: A comma-separated list of fields to sort by. Fields prefixed by a dash ( - ) sort in descending order.
      operationId: getMembers
      security:
      - ApiKey:
        - read
        - write
    post:
      responses:
        '201':
          description: Member collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Members'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Account members
      summary: Invite new members
      description: 'Invite one or more new members to join an account. Each member is sent an invitation. Members with Admin or Owner roles may create new members, as well as anyone with a `createMember` permission for "member/\*". If a member cannot be invited, the entire request is rejected and no members are invited from that request.


        Each member _must_ have an `email` field and either a `role` or a `customRoles` field. If any of the fields are not populated correctly, the request is rejected with the reason specified in the "message" field of the response.


        Valid base role names that you can provide for the `role` field include `reader`, `writer`, `admin`, `owner/admin`, and `no_access`. To learn more about base roles, read Organization roles.


        If you are using the `customRoles` field instead, you can provide the key for any role that you have created, or for any preset organization role or project role provided by LaunchDarkly. Some preset roles additionally require that you specify `roleAttributes`. To learn more, read Using role scope.


        Requests to create account members will not work if SCIM is enabled for the account.


        You can assign new members to teams with the `teamKeys` field. Teams are available only on Enterprise plans. If your plan does not include teams, a request that includes a non-empty `teamKeys` field returns an HTTP response code of 403 (Forbidden). Omit `teamKeys` to invite members without assigning them to a team.


        _No more than 50 members may be created per request._


        A request may also fail because of conflicts with existing members. These conflicts are reported using the additional `code` and `invalid_emails` response fields with the following possible values for `code`:


        - **email_already_exists_in_account**: A member with this email address already exists in this account.

        - **email_taken_in_different_account**: A member with this email address exists in another account.

        - **duplicate_email**s: This request contains two or more members with the same email address.


        A request that fails for one of the above reasons returns an HTTP response code of 400 (Bad Request).'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMemberFormListPost'
        required: true
      operationId: postMembers
      security:
      - ApiKey:
        - read
        - write
    patch:
      responses:
        '200':
          description: Members response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkEditMembersRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Account members
      summary: Modify account members
      description: '> ### Full use of this API resource is an Enterprise feature

        >

        > The ability to perform a partial update to multiple members is available to customers on an Enterprise plan. If you are on another plan, you can update members individually. To learn more, read about our pricing. To upgrade your plan, contact Sales. Perform a partial update to multiple members. Updating members uses the semantic patch format. To make a semantic patch request, you must append `domain-model=launchdarkly.semanticpatch` to your `Content-Type` header. To learn more, read Updates using semantic patch. ### Instructions


        Semantic patch requests support the following `kind` instructions for updating members. Click to expand instructions for updating members


        #### replaceMembersRoles


        Replaces the roles of the specified members. This also removes all custom roles assigned to the specified members. ##### Parameters


        - `value`: The new role. Must be a valid base role. To learn more, read Roles. - `memberIDs`: List of member IDs. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "replaceMembersRoles",

        "value": "reader",

        "memberIDs": [

        "1234a56b7c89d012345e678f",

        "507f1f77bcf86cd799439011"

        ]

        }]

        }

        ```


        #### replaceAllMembersRoles


        Replaces the roles of all members. This also removes all custom roles assigned to the specified members. Members that match any of the filters are **excluded** from the update. ##### Parameters


        - `value`: The new role. Must be a valid base role. To learn more, read Roles. - `filterLastSeen`: (Optional) A JSON object with one of the following formats:

        - `{"never": true}` - Members that have never been active, such as those who have not accepted their invitation to LaunchDarkly, or have not logged in after being provisioned via SCIM. - `{"noData": true}` - Members that have not been active since LaunchDarkly began recording last seen timestamps. - `{"before": 1608672063611}` - Members that have not been active since the provided value, which should be a timestamp in Unix epoch milliseconds. - `filterQuery`: (Optional) A string that matches against the members'' emails and names. It is not case sensitive. - `filterRoles`: (Optional) A `|` separated list of roles and custom roles. For the purposes of this filtering, `Owner` counts as `Admin`. - `filterTeamKey`: (Optional) A string that matches against the key of the team the members belong to. It is not case sensitive. - `ignoredMemberIDs`: (Optional) A list of member IDs. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "replaceAllMembersRoles",

        "value": "reader",

        "filterLastSeen": { "never": true }

        }]

        }

        ```


        #### replaceMembersCustomRoles


        Replaces the custom roles of the specified members. ##### Parameters


        - `values`: List of new custom roles. Must be a valid custom role key or ID. - `memberIDs`: List of member IDs. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "replaceMembersCustomRoles",

        "values": [ "example-custom-role" ],

        "memberIDs": [

        "1234a56b7c89d012345e678f",

        "507f1f77bcf86cd799439011"

        ]

        }]

        }

        ```


        #### replaceAllMembersCustomRoles


        Replaces the custom roles of all members. Members that match any of the filters are **excluded** from the update. ##### Parameters


        - `values`: List of new roles. Must be a valid custom role key or ID. - `filterLastSeen`: (Optional) A JSON object with one of the following formats:

        - `{"never": true}` - Members that have never been active, such as those who have not accepted their invitation to LaunchDarkly, or have not logged in after being provisioned via SCIM. - `{"noData": true}` - Members that have not been active since LaunchDarkly began recording last seen timestamps. - `{"before": 1608672063611}` - Members that have not been active since the provided value, which should be a timestamp in Unix epoch milliseconds. - `filterQuery`: (Optional) A string that matches against the members'' emails and names. It is not case sensitive. - `filterRoles`: (Optional) A `|` separated list of roles and custom roles.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/membersPatchInput'
            example:
              comment: Optional comment about the update
              instructions:
              - kind: replaceMembersRoles
                memberIDs:
                - 1234a56b7c89d012345e678f
                - 507f1f77bcf86cd799439011
                value: reader
        required: true
      operationId: patchMembers
      security:
      - ApiKey:
        - read
        - write
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'
  /api/v2/members/{id}:
    get:
      responses:
        '200':
          description: Member response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Account members
      summary: Get account member
      description: 'Get a single account member by member ID.


        `me` is a reserved value for the `id` parameter that returns the caller''s member information.


        ### Expanding the member response

        LaunchDarkly supports the following fields for expanding the "Get member" response. By default, these fields are **not** included in the response.


        To expand the response, append the `expand` query parameter and add a comma-separated list with any of the following fields:


        * `customRoles` includes details on each custom role assigned to the member, including the role key, name, and ID.

        * `roleAttributes` includes a list of the role attributes that you have assigned to the member.


        For example, `expand=customRoles,roleAttributes` includes both the `customRolesInfo` and `roleAttributes` fields in the response.'
      parameters:
      - name: id
        in: path
        description: The member ID
        required: true
        schema:
          type: string
          format: string
          description: The member ID
      - name: expand
        in: query
        description: A comma-separated list of properties that can reveal additional information in the response.
        schema:
          type: string
          format: string
          description: A comma-separated list of properties that can reveal additional information in the response.
      operationId: getMember
      security:
      - ApiKey:
        - read
        - write
    patch:
      responses:
        '200':
          description: Member response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Account members
      summary: Modify an account member
      description: 'Update a single account member. Updating a member uses a JSON patch representation of the desired changes. To learn more, read Updates.


        To update fields in the account member object that are arrays, set the `path` to the name of the field and then append `/`. Use `/0` to add to the beginning of the array. Use `/-` to add to the end of the array. For example, to add a new custom role to a member, use the following request body:


        ```

        [

        {

        "op": "add",

        "path": "/customRoles/0",

        "value": "some-role-id"

        }

        ]

        ```


        You can update only an account member''s role or custom role using a JSON patch. Members can update their own names and email addresses though the LaunchDarkly UI.


        When SAML SSO or SCIM is enabled for the account, account members are managed in the Identity Provider (IdP). Requests to update account members will succeed, but the IdP will override the update shortly afterwards.'
      parameters:
      - name: id
        in: path
        description: The member ID
        required: true
        schema:
          type: string
          format: string
          description: The member ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
            example:
            - op: add
              path: /role
              value: writer
        required: true
      operationId: patchMember
      security:
      - ApiKey:
        - read
        - write
    delete:
      responses:
        '204':
          description: Action succeeded
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Account members
      summary: Delete account member
      description: Delete a single account member by ID. Requests to delete account members will not work if SCIM is enabled for the account.
      parameters:
      - name: id
        in: path
        description: The member ID
        required: true
        schema:
          type: string
          format: string
          description: The member ID
      operationId: deleteMember
      security:
      - ApiKey:
        - read
        - write
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'
  /api/v2/members/{id}/teams:
    post:
      responses:
        '201':
          description: Member response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Account members
      summary: Add a member to teams
      description: Add one member to one or more teams.
      parameters:
      - name: id
        in: path
        description: The member ID
        required: true
        schema:
          type: string
          format: string
          description: The member ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberTeamsPostInput'
        required: true
      operationId: postMemberTeams
      security:
      - ApiKey:
        - read
        - write
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'
  /members:
    get:
      operationId: listMembers
      summary: List account members
      description: Returns a paginated list of all members in the LaunchDarkly account.
      tags:
      - Account members
      parameters:
      - name: limit
        in: query
        description: Maximum number of members to return.
        schema:
          type: integer
      - name: offset
        in: query
        description: Number of members to skip for pagination.
        schema:
          type: integer
      - name: filter
        in: query
        description: A filter expression to apply to the member list.
        schema:
          type: string
      responses:
        '200':
          description: Successful response containing a list of members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Members_2'
        '401':
          description: Unauthorized. Invalid or missing access token.
      security:
      - bearerAuth: []
    post:
      operationId: inviteMember
      summary: Invite a new member
      description: Sends an invitation to a new member to join the LaunchDarkly account.
      tags:
      - Account members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInviteBody'
      responses:
        '201':
          description: Invitation sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Members_2'
        '400':
          description: Invalid request body.
        '401':
          description: Unauthorized. Invalid or missing access token.
        '409':
          description: A member with this email already exists.
      security:
      - bearerAuth: []
    servers:
    - url: https://app.launchdarkly.com/api/v2
      description: LaunchDarkly Production API
components:
  schemas:
    OAuthProviderKind:
      type: string
    NewMemberFormListPost:
      type: array
      items:
        $ref: '#/components/schemas/NewMemberForm'
    JSONPatch:
      type: array
      items:
        $ref: '#/components/schemas/PatchOperation'
    Instructions:
      type: array
      items:
        $ref: '#/components/schemas/Instruction'
    InvalidRequestErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: invalid_request
        message:
          type: string
          description: Description of the error
          example: Invalid request body
    MemberTeamsPostInput:
      type: object
      required:
      - teamKeys
      properties:
        teamKeys:
          type: array
          description: List of team keys
          items:
            type: string
          example:
          - team1
          - team2
    RateLimitedErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: rate_limited
        message:
          type: string
          description: Description of the error
          example: You've exceeded the API rate limit. Try again later.
    UnauthorizedErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: unauthorized
        message:
          type: string
          description: Description of the error
          example: Invalid access token
    ForbiddenErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: forbidden
        message:
          type: string

      tags:
      - Segments
      summary: Patch segment
      description: 'Update a segment. The request body must be a valid semantic patch, JSON patch, or JSON merge patch. To learn more the different formats, read Updates. ### Using semantic patches on a segment


        To make a semantic patch request, you must append `domain-model=launchdarkly.semanticpatch` to your `Content-Type` header. To learn more, read Updates using semantic patch. The body of a semantic patch request for updating segments requires an `environmentKey` in addition to `instructions` and an optional `comment`. The body of the request takes the following properties:


        * `comment` (string): (Optional) A description of the update. * `environmentKey` (string): (Required) The key of the LaunchDarkly environment. * `instructions` (array): (Required) A list of actions the update should perform. Each action in the list must be an object with a `kind` property that indicates the instruction. If the action requires parameters, you must include those parameters as additional fields in the object. ### Instructions


        Semantic patch requests support the following `kind` instructions for updating segments. Click to expand instructions for updating segment details and settings


        #### addTags


        Adds tags to the segment. ##### Parameters


        - `values`: A list of tags to add. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "addTags",

        "values": ["tag1", "tag2"]

        }]

        }

        ```


        #### removeTags


        Removes tags from the segment. ##### Parameters


        - `values`: A list of tags to remove. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "removeTags",

        "values": ["tag1", "tag2"]

        }]

        }

        ```


        #### updateName


        Updates the name of the segment. ##### Parameters


        - `value`: Name of the segment. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "updateName",

        "value": "Updated segment name"

        }]

        }

        ```


        Click to expand instructions for updating segment individual targets


        #### addExcludedTargets


        Adds context keys to the individual context targets excluded from the segment for the specified `contextKind`. Returns an error if this causes the same context key to be both included and excluded, or if the number of operations on targets exceeds the batch limit of 1,500. ##### Parameters


        - `contextKind`: The context kind the targets should be added to. - `values`: List of keys. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "addExcludedTargets",

        "contextKind": "org",

        "values": [ "org-key-123abc", "org-key-456def" ]

        }]

        }

        ```


        #### addExcludedUsers


        Adds user keys to the individual user targets excluded from the segment. Returns an error if this causes the same user key to be both included and excluded, or if the number of operations on targets exceeds the batch limit of 1,500. If you are working with contexts, use `addExcludedTargets` instead of this instruction. ##### Parameters


        - `values`: List of user keys. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "addExcludedUsers",

        "values": [ "user-key-123abc", "user-key-456def" ]

        }]

        }

        ```


        #### addIncludedTargets


        Adds context keys to the individual context targets included in the segment for the specified `contextKind`. Returns an error if this causes the same context key to be both included and excluded, or if the number of operations on targets exceeds the batch limit of 1,500. ##### Parameters


        - `contextKind`: The context kind the targets should be added to. - `values`: List of keys. Here''s an example:


        ```json

        {

        "instructions": [{

        "kind": "addIncludedTargets",

        "contextKind": "org",

        "values": [ "org-key-123abc", "org-key-456def" ]

        }]

        }

        ```


        #### addIncludedUsers


        Adds user keys to the individual user targets included in the segment. Returns an error if this causes the same user key to be both included and excluded, or if the number of operations on targets exceeds the batch limit of 1,500. If you are working with contexts, use `addIncludedTargets` instead of this instruction. ##### Parameters


        - `values`: List of user keys.'
      parameters:

openapi: 3.2.0
info:
  title: LaunchDarkly REST Views API
  description: 'This documentation describes LaunchDarkly''s REST API. To access the complete OpenAPI spec directly, use Get OpenAPI spec. To learn how to use LaunchDarkly using the user interface (UI) instead, read our product documentation. ## Authentication


    LaunchDarkly''s REST API uses the HTTPS protocol with a minimum TLS version of 1.2. All REST API resources are authenticated with either personal or service access tokens, or session cookies. Other authentication mechanisms are not supported. You can manage personal access tokens on your **Authorization** page in the LaunchDarkly UI. LaunchDarkly also has SDK keys, mobile keys, and client-side IDs that are used by our server-side SDKs, mobile SDKs, and JavaScript-based SDKs, respectively. **These keys cannot be used to access our REST API**. These keys are environment-specific, and can only perform read-only operations such as fetching feature flag settings. | Auth mechanism | Allowed resources | Use cases |

    | ----------------------------------------------------------------------------------------------- | ----------------------------------------------------------------------------------------------------- | -------------------------------------------------- |

    | Personal or service access tokens | Can be customized on a per-token basis | Building scripts, custom integrations, data export. |

    | SDK keys | Can only access read-only resources specific to server-side SDKs. Restricted to a single environment. | Server-side SDKs |

    | Mobile keys | Can only access read-only resources specific to mobile SDKs, and only for flags marked available to mobile keys. Restricted to a single environment. | Mobile SDKs |

    | Client-side ID | Can only access read-only resources specific to JavaScript-based client-side SDKs, and only for flags marked available to client-side. Restricted to a single environment. | Client-side JavaScript |


    > #### Keep your access tokens and SDK keys private

    >

    > Access tokens should _never_ be exposed in untrusted contexts. Never put an access token in client-side JavaScript, or embed it in a mobile application. LaunchDarkly has special mobile keys that you can embed in mobile apps. If you accidentally expose an access token or SDK key, you can reset it from your **Authorization** page. >

    > The client-side ID is safe to embed in untrusted contexts. It''s designed for use in client-side JavaScript. ### Authentication using request header


    The preferred way to authenticate with the API is by adding an `Authorization` header containing your access token to your requests. The value of the `Authorization` header must be your access token. Manage personal access tokens from the **Authorization** page. ### Authentication using session cookie


    For testing purposes, you can make API calls directly from your web browser. If you are logged in to the LaunchDarkly application, the API will use your existing session to authenticate calls. Depending on the permissions granted as part of your role, you may not have permission to perform some API calls. You will receive a `401` response code in that case. > ### Modifying the Origin header causes an error

    >

    > LaunchDarkly validates that the Origin header for any API request authenticated by a session cookie matches the expected Origin header. The expected Origin header is `https://app.launchdarkly.com`. >

    > If the Origin header does not match what''s expected, LaunchDarkly returns an error. This error can prevent the LaunchDarkly app from working correctly. >

    > Any browser extension that intentionally changes the Origin header can cause this problem. For example, Cross-Origin Resource Sharing (CORS) extensions used during development can modify the Origin header and cause the app to fail. >

    > To prevent this error, do not modify your Origin header. >

    > LaunchDarkly does not require origin matching when authenticating with an access token, so this issue does not affect normal API usage.'
  contact:
    name: LaunchDarkly Technical Support Team
    url: https://support.launchdarkly.com
    email: support@launchdarkly.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '2.0'
servers:
- url: https://app.launchdarkly.com
  description: ' Default'
- url: https://app.launchdarkly.us
  description: ' Federal'
security:
- ApiKey:
  - read
  - write
tags:
- name: Views
  description: 'The views API allows you to create, retrieve, and edit views, and link other resources to views.


    A view is a resource in LaunchDarkly that you can use to logically group other resources within a project, such as flags or segments. For example, views let you restrict access to sets of flags, so that members of your organization can focus on just the flags they work with.


    To learn more, read Views.'
paths:
  /api/v2/projects/{projectKey}/views:
    get:
      description: Get a list of all views in the given project.
      operationId: getViews
      parameters:
      - example: default
        explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - description: A sort to apply to the list of views.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          enum:
          - key
          - name
          - updatedAt
          type: string
        style: form
      - description: The number of views to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      - description: 'A filter to apply to the list of views. Supports the following fields and operators: `name` (equals, notEquals, startsWith, contains, anyOf), `key` (equals, notEquals, startsWith, contains, anyOf), `tag` (equals, anyOf), `maintainerId` (equals, anyOf), `isPayloadView` (equals).'
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: A comma-separated list of fields to expand.
        explode: false
        in: query
        name: expand
        required: false
        schema:
          items:
            enum:
            - flagsSummary
            - segmentsSummary
            - metricsSummary
            - aiConfigsSummary
            - resourceSummary
            type: string
          type: array
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Views'
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: List views
      tags:
      - Views
    post:
      description: Create a new view in the given project.
      operationId: createView
      parameters:
      - example: default
        explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewPost'
        description: View object to create
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Create view
      tags:
      - Views
  /api/v2/projects/{projectKey}/views/{viewKey}:
    delete:
      description: Delete a specific view by its key.
      operationId: deleteView
      parameters:
      - example: default
        explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - example: my-view
        explode: false
        in: path
        name: viewKey
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: No content
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Delete view
      tags:
      - Views
    get:
      description: Retrieve a specific view by its key.
      operationId: getView
      parameters:
      - example: default
        explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - example: my-view
        explode: false
        in: path
        name: viewKey
        required: true
        schema:
          type: string
        style: simple
      - description: A sort to apply to the list of views.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          enum:
          - key
          - name
          - updatedAt
          type: string
        style: form
      - description: The number of views to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      - description: 'A filter to apply to the list of views. Supports the following fields and operators: `name` (equals, notEquals, startsWith, contains, anyOf), `key` (equals, notEquals, startsWith, contains, anyOf), `tag` (equals, anyOf), `maintainerId` (equals, anyOf), `isPayloadView` (equals).'
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: A comma-separated list of fields to expand.
        explode: true
        in: query
        name: expand
        required: false
        schema:
          items:
            enum:
            - allFlags
            - allSegments
            - allMetrics
            - allAIConfigs
            - allResources
            - maintainer
            - flagsSummary
            - segmentsSummary
            - metricsSummary
            - aiConfigsSummary
            - resourceSummary
            type: string
          type: array
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Get view
      tags:
      - Views
    patch:
      description: 'Edit an existing view.


        The request body must be a JSON object of the fields to update. The values you include replace the existing values for the fields.


        Here''s an example:

        ```

        {

        "description": "Example updated description",

        "tags": ["new-tag"]

        }

        ```'
      operationId: updateView
      parameters:
      - example: default
        explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - example: my-view
        explode: false
        in: path
        name: viewKey
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewPatch'
        description: A JSON representation of the view including only the fields to update.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Update view
      tags:
      - Views
  /api/v2/projects/{projectKey}/views/{viewKey}/link/{resourceType}:
    delete:
      description: 'Unlink one or multiple resources from a view:

        - Unlink flags using flag keys

        - Unlink segments using segment IDs

        - Unlink AI configs using config keys'
      operationId: unlinkResource
      parameters:
      - example: default
        explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - example: my-view
        explode: false
        in: path
        name: viewKey
        required: true
        schema:
          type: string
        style: simple
      - example: flags
        explode: false
        in: path
        name: resourceType
        required: true
        schema:
          enum:
          - flags
          - segments
          - aiConfigs
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewLinkRequest'
        description: The resource to link to the view. Flags are identified by key. Segments are identified by segment ID.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlinkResourceSuccessResponse'
          description: Successful response with unlink details
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Unlink resource
      tags:
      - Views
    post:
      description: 'Link one or multiple resources to a view by keys, filters, or both:

        - Link flags using flag keys or filters (maintainerId, maintainerTeamKey, tags, state, query)

        - Link segments using segment IDs or filters (tags, query, unbounded)

        - Link AI configs using config keys


        When both keys and filters are provided, resources matching either condition are linked (union).'
      operationId: linkResource
      parameters:
      - example: default
        explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - example: my-view
        explode: false
        in: path
        name: viewKey
        required: true
        schema:
          type: string
        style: simple
      - example: flags
        explode: false
        in: path
        name: resourceType
        required: true
        schema:
          enum:
          - flags
          - segments
          - aiConfigs
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewLinkRequest'
        description: 'Resources to link to the view. You can provide explicit keys/IDs, filters, or both.

          - Flags: identified by key or filtered by maintainerId, maintainerTeamKey, tags, state, query

          - Segments: identified by segment ID or filtered by tags, query, unbounded

          '
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResourceSuccessResponse'
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Link resource
      tags:
      - Views
  /api/v2/projects/{projectKey}/views/{viewKey}/linked/{resourceType}:
    get:
      description: Get a list of all linked resources for a given view.
      operationId: getLinkedResources
      parameters:
      - example: default
        explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - example: my-view
        explode: false
        in: path
        name: viewKey
        required: true
        schema:
          type: string
        style: simple
      - example: flags
        explode: false
        in: path
        name: resourceType
        required: true
        schema:
          enum:
          - flags
          - segments
          - aiConfigs
          type: string
        style: simple
      - description: The number of views to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      - description: Field to sort by. Default field is `linkedAt`, default order is ascending.
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: linkedAt
          enum:
          - linkedAt
          - name
          type: string
        style: form
      - description: Case-insensitive search query for linked resources. Matches resource key and, when expanded, resource name.
        explode: true
        in: query
        name: query
        required: false
        schema:
          type: string
        style: form
      - description: 'Optional resource filter expression for linked resources.

          - Supported for `flags` and `segments` resource types.

          - Uses the same syntax as link/unlink and list endpoints.

          - For `segments`, `environmentId` is required when `filter` is provided.

          '
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: A comma-separated list of fields to expand.
        explode: false
        in: query
        name: expand
        required: false
        schema:
          items:
            enum:
            - maintainer
            - resourceDetails
            type: string
          type: array
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewLinkedResources'
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Get linked resources
      tags:
      - Views
  /api/v2/projects/{projectKey}/view-associations/{resourceType}/{resourceKey}:
    get:
      description: Get a list of all linked views for a resource. Flags and AI configs are identified by key. Segments are identified by segment ID.
      operationId: getLinkedViews
      parameters:
      - example: default
        explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - example: flags
        explode: false
        in: path
        name: resourceType
        required: true
        schema:
          enum:
          - flags
          - segments
          - aiConfigs
          type: string
        style: simple
      - example: my-flag
        explode: false
        in: path
        name: resourceKey
        required: true
        schema:
          type: string
        style: simple
      - description: Environment ID. Required when resourceType is 'segments'
        example: 6890ff25c3e3830ba1a352e4
        explode: true
        in: query
        name: environmentId
        required: false
        schema:
          type: string
        style: form
      - description: The number of views to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Views'
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Get linked views for a given resource
      tags:
      - Views
components:
  schemas:
    ViewLinkRequestFilter:
      additionalProperties: false
      properties:
        filter:
          description: 'Filter string to match resources for linking. Uses the same syntax as list endpoints: flags use comma-separated field:value filters, segments use queryfilter syntax.


            Supported filters by resource type:

            - flags: query, tags, maintainerId, maintainerTeamKey, type, status, state, staleState, sdkAvailability, targeting, hasExperiment, hasDataExport, evaluated, creationDate, contextKindTargeted, contextKindsEvaluated, filterEnv, segmentTargeted, codeReferences.min, codeReferences.max, excludeSettings, releasePipeline, applicationEvaluated, purpose, guardedRollout, view, key, name, archived, followerId

            - segments (queryfilter): query, tags, keys, excludedKeys, unbounded, external, view, type

            Some filters are only available when the corresponding feature is enabled on your account.

            '
          example: maintainerId:507f1f77bcf86cd799439011,tags:backend+beta
          type: string
        environmentId:
          description: 'Required when using filter for segment resources. Specifies which environment to query for segments matching the filter.

            Ignored for flag resources (flags are global across environments).

            '
          type: string
        comment:
          default: ''
          description: Optional comment for the link/unlink operation
          type: string
      required:
      - filter
      title: ViewLinkRequestFilter
      type: object
    Maintainer:
      example:
        kind: kind
        maintainerMember:
          firstName: firstName
          lastName: lastName
          role: role
          id: id
          email: email
        id: id
        maintainerTeam:
          name: name
          id: id
          key: key
      properties:
        id:
          type: string
        kind:
          type: string
        maintainerMember:
          $ref: '#/components/schemas/ViewsMaintainerMember'
        maintainerTeam:
          $ref: '#/components/schemas/ViewsMaintainerTeam'
      required:
      - id
      - kind
      type: object
    ViewPost:
      example:
        maintainerId: maintainerId
        name: name
        maintainerTeamKey: maintainerTeamKey
        description: ''
        key: key
        tags:
        - tags
        - tags
      properties:
        key:
          description: Unique key for the view within the account/project. The key is converted to lowercase when the view is created, so use the lowercase form to reference the view afterward.
          type: string
        name:
          description: Human-readable name for the view
          type: string
        description:
          default: ''
          description: Optional detailed description of the view
          type: string
        maintainerId:
          description: Member ID of the maintainer for this view. Only one of `maintainerId` or `maintainerTeamKey` can be specified.
          type: string
        maintainerTeamKey:
          description: Key of the maintainer team for this view. Only one of `maintainerId` or `maintainerTeamKey` can be specified.
          type: string
        tags:
          description: Tags associated with this view
          items:
            type: string
          type: array
      required:
      - key
      - name
      type: object
    ViewLinkRequestSegmentIdentifiers:
      additionalProperties: false
      properties:
        segmentIdentifiers:
          description: Identifiers of the segments to link/unlink (environmentId and segmentKey)
          items:
            $ref: '#/components/schemas/ViewLinkRequestSegmentIdentifier'
          type: array
        filter:
          description: 'Optional filter string to determine which resources should be linked. Resources only need to match either the filter or explicitly-listed keys to be linked (union).

            Uses the same queryfilter syntax as the segments list endpoint.


            Supported filters for segments: query, tags, keys, excludedKeys, unbounded, external, view, type

            '
          example: tags anyOf ["backend"]
          type: string
        environmentId:
          description: 'Required when using filter for segment resources. Specifies which environment to query for segments matching the filter.

            Ignored when only using explicit segmentIdentifiers (since each identifier contains its own environmentId).

            '
          type: string
        comment:

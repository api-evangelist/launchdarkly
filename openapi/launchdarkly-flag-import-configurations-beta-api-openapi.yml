openapi: 3.2.0
info:
  title: LaunchDarkly REST Flag import configurations (beta) API
  description: 'This documentation describes LaunchDarkly''s REST API. To access the complete OpenAPI spec directly, use Get OpenAPI spec. To learn how to use LaunchDarkly using the user interface (UI) instead, read our product documentation. ## Authentication


    LaunchDarkly''s REST API uses the HTTPS protocol with a minimum TLS version of 1.2. All REST API resources are authenticated with either personal or service access tokens, or session cookies. Other authentication mechanisms are not supported. You can manage personal access tokens on your **Authorization** page in the LaunchDarkly UI. LaunchDarkly also has SDK keys, mobile keys, and client-side IDs that are used by our server-side SDKs, mobile SDKs, and JavaScript-based SDKs, respectively. **These keys cannot be used to access our REST API**. These keys are environment-specific, and can only perform read-only operations such as fetching feature flag settings. | Auth mechanism | Allowed resources | Use cases |

    | ----------------------------------------------------------------------------------------------- | ----------------------------------------------------------------------------------------------------- | -------------------------------------------------- |

    | Personal or service access tokens | Can be customized on a per-token basis | Building scripts, custom integrations, data export. |

    | SDK keys | Can only access read-only resources specific to server-side SDKs. Restricted to a single environment. | Server-side SDKs |

    | Mobile keys | Can only access read-only resources specific to mobile SDKs, and only for flags marked available to mobile keys. Restricted to a single environment. | Mobile SDKs |

    | Client-side ID | Can only access read-only resources specific to JavaScript-based client-side SDKs, and only for flags marked available to client-side. Restricted to a single environment. | Client-side JavaScript |


    > #### Keep your access tokens and SDK keys private

    >

    > Access tokens should _never_ be exposed in untrusted contexts. Never put an access token in client-side JavaScript, or embed it in a mobile application. LaunchDarkly has special mobile keys that you can embed in mobile apps. If you accidentally expose an access token or SDK key, you can reset it from your **Authorization** page. >

    > The client-side ID is safe to embed in untrusted contexts. It''s designed for use in client-side JavaScript. ### Authentication using request header


    The preferred way to authenticate with the API is by adding an `Authorization` header containing your access token to your requests. The value of the `Authorization` header must be your access token. Manage personal access tokens from the **Authorization** page. ### Authentication using session cookie


    For testing purposes, you can make API calls directly from your web browser. If you are logged in to the LaunchDarkly application, the API will use your existing session to authenticate calls. Depending on the permissions granted as part of your role, you may not have permission to perform some API calls. You will receive a `401` response code in that case. > ### Modifying the Origin header causes an error

    >

    > LaunchDarkly validates that the Origin header for any API request authenticated by a session cookie matches the expected Origin header. The expected Origin header is `https://app.launchdarkly.com`. >

    > If the Origin header does not match what''s expected, LaunchDarkly returns an error. This error can prevent the LaunchDarkly app from working correctly. >

    > Any browser extension that intentionally changes the Origin header can cause this problem. For example, Cross-Origin Resource Sharing (CORS) extensions used during development can modify the Origin header and cause the app to fail. >

    > To prevent this error, do not modify your Origin header. >

    > LaunchDarkly does not require origin matching when authenticating with an access token, so this issue does not affect normal API usage.'
  contact:
    name: LaunchDarkly Technical Support Team
    url: https://support.launchdarkly.com
    email: support@launchdarkly.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '2.0'
servers:
- url: https://app.launchdarkly.com
  description: ' Default'
- url: https://app.launchdarkly.us
  description: ' Federal'
security:
- ApiKey:
  - read
  - write
tags:
- name: Flag import configurations (beta)
  description: '> ### This feature is in beta

    >

    > To use this feature, pass in a header including the `LD-API-Version` key with value set to `beta`. Use this header with each call. To learn more, read Beta resources.

    >

    > Resources that are in beta are still undergoing testing and development. They may change without notice, including becoming backwards incompatible.


    Flag import configurations allow you to import feature flags from another feature management system.


    Use the flag import configuration endpoints to create, delete, and manage flag import configurations. You can import flags from other feature management tools into LaunchDarkly. For example, you can import flags from Split.io.


    Several of the endpoints in the flag import configuration API require an integration ID. The integration ID is returned as part of the Create a flag import configuration response, in the `_id` field. It is also returned as part of the List all flag import configurations response, in the `_id` field of each element in the `items` array.


    To learn more about flag import configurations, read Import flags.'
paths:
  /api/v2/integration-capabilities/flag-import:
    get:
      responses:
        '200':
          description: Flag Import Configuration response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagImportIntegrationCollection'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Flag import configurations (beta)
      summary: List all flag import configurations
      description: List all flag import configurations.
      operationId: getFlagImportConfigurations
  /api/v2/integration-capabilities/flag-import/{projectKey}/{integrationKey}:
    post:
      responses:
        '200':
          description: Flag Import Configuration response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagImportIntegration'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Flag import configurations (beta)
      summary: Create a flag import configuration
      description: Create a new flag import configuration. The `integrationKey` path parameter identifies the feature management system from which the import occurs, for example, `split`. The `config` object in the request body schema is described by the global integration settings, as specified by the formVariables in the manifest.json for this integration. It varies slightly based on the `integrationKey`.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: integrationKey
        in: path
        description: The integration key
        required: true
        schema:
          type: string
          format: string
          description: The integration key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagImportConfigurationPost'
            example:
              config:
                environmentId: The ID of the environment in the external system
                ldApiKey: An API key with create flag permissions in your LaunchDarkly account
                ldMaintainer: The ID of the member who will be the maintainer of the imported flags
                ldTag: A tag to apply to all flags imported to LaunchDarkly
                splitTag: If provided, imports only the flags from the external system with this tag. Leave blank to import all flags.
                workspaceApiKey: An API key with read permissions in the external feature management system
                workspaceId: The ID of the workspace in the external system
              name: Sample configuration
              tags:
              - example-tag
        required: true
      operationId: createFlagImportConfiguration
  /api/v2/integration-capabilities/flag-import/{projectKey}/{integrationKey}/{integrationId}:
    get:
      responses:
        '200':
          description: Flag import response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagImportIntegration'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Project or import configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Flag import configurations (beta)
      summary: Get a single flag import configuration
      description: Get a single flag import configuration by ID. The `integrationKey` path parameter identifies the feature management system from which the import occurs, for example, `split`.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: integrationKey
        in: path
        description: The integration key, for example, `split`
        required: true
        schema:
          type: string
          format: string
          description: The integration key, for example, `split`
      - name: integrationId
        in: path
        description: The integration ID
        required: true
        schema:
          type: string
          format: string
          description: The integration ID
      operationId: getFlagImportConfiguration
    patch:
      responses:
        '200':
          description: Flag import response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagImportIntegration'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Project or import configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Flag import configurations (beta)
      summary: Update a flag import configuration
      description: 'Updating a flag import configuration uses a JSON patch representation of the desired changes. To learn more, read Updates.


        To add an element to the import configuration fields that are arrays, set the `path` to the name of the field and then append `/`. Use `/0` to add to the beginning of the array. Use `/-` to add to the end of the array.


        You can update the `config`, `tags`, and `name` of the flag import configuration.'
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: integrationKey
        in: path
        description: The integration key
        required: true
        schema:
          type: string
          format: string
          description: The integration key
      - name: integrationId
        in: path
        description: The integration ID
        required: true
        schema:
          type: string
          format: string
          description: The integration ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
        required: true
      operationId: patchFlagImportConfiguration
    delete:
      responses:
        '204':
          description: Action completed successfully
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Project or import configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Flag import configurations (beta)
      summary: Delete a flag import configuration
      description: Delete a flag import configuration by ID. The `integrationKey` path parameter identifies the feature management system from which the import occurs, for example, `split`.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: integrationKey
        in: path
        description: The integration key
        required: true
        schema:
          type: string
          format: string
          description: The integration key
      - name: integrationId
        in: path
        description: The integration ID
        required: true
        schema:
          type: string
          format: string
          description: The integration ID
      operationId: deleteFlagImportConfiguration
  /api/v2/integration-capabilities/flag-import/{projectKey}/{integrationKey}/{integrationId}/trigger:
    post:
      responses:
        '201':
          description: Import job queued successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Project or import configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Flag import configurations (beta)
      summary: Trigger a single flag import run
      description: Trigger a single flag import run for an existing flag import configuration. The `integrationKey` path parameter identifies the feature management system from which the import occurs, for example, `split`.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: integrationKey
        in: path
        description: The integration key
        required: true
        schema:
          type: string
          format: string
          description: The integration key
      - name: integrationId
        in: path
        description: The integration ID
        required: true
        schema:
          type: string
          format: string
          description: The integration ID
      operationId: triggerFlagImportJob
components:
  schemas:
    StatusResponse:
      type: object
      properties:
        integrationId:
          type: string
        message:
          type: string
        statusCode:
          type: integer
        timestamp:
          $ref: '#/components/schemas/UnixMillis'
    FormVariableConfig:
      type: object
      additionalProperties: {}
    AccessDenied:
      type: object
      required:
      - action
      - reason
      properties:
        action:
          $ref: '#/components/schemas/ActionIdentifier'
        reason:
          $ref: '#/components/schemas/AccessDeniedReason'
    JSONPatch:
      type: array
      items:
        $ref: '#/components/schemas/PatchOperation'
    InvalidRequestErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: invalid_request
        message:
          type: string
          description: Description of the error
          example: Invalid request body
    AccessDeniedReason:
      type: object
      required:
      - effect
      properties:
        resources:
          type: array
          description: Resource specifier strings
          items:
            type: string
          example:
          - proj/*:env/*;qa_*:/flag/*
        notResources:
          type: array
          description: Targeted resources are the resources NOT in this list. The <code>resources</code> and <code>notActions</code> fields must be empty to use this field.
          items:
            type: string
        actions:
          type: array
          description: Actions to perform on a resource
          items:
            $ref: '#/components/schemas/ActionSpecifier'
          example:
          - '*'
        notActions:
          type: array
          description: Targeted actions are the actions NOT in this list. The <code>actions</code> and <code>notResources</code> fields must be empty to use this field.
          items:
            $ref: '#/components/schemas/ActionSpecifier'
        effect:
          type: string
          description: Whether this statement should allow or deny actions on the resources.
          example: allow
          enum:
          - allow
          - deny
        role_name:
          type: string
    RateLimitedErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: rate_limited
        message:
          type: string
          description: Description of the error
          example: You've exceeded the API rate limit. Try again later.
    UnauthorizedErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: unauthorized
        message:
          type: string
          description: Description of the error
          example: Invalid access token
    ForbiddenErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: forbidden
        message:
          type: string
          description: Description of the error
          example: Forbidden. Access to the requested resource was denied.
    ActionSpecifier:
      type: string
    Link:
      type: object
      properties:
        href:
          type: string
        type:
          type: string
    ActionIdentifier:
      type: string
    FlagImportConfigurationPost:
      type: object
      required:
      - config
      properties:
        config:
          description: The global configuration settings, as specified by the <code>formVariables</code> in the <code>manifest.json</code> for this configuration.
          example: '{"workspaceApiKey": "An API key with read permissions in the external feature management system", "workspaceId": "The ID of the workspace in the external system", "environmentId": "The ID of the environment in the external system", "splitTag": "If provided, imports only the flags from the external system with this tag. Leave blank to import all flags.", "ldApiKey": "An API key with create flag permissions in your LaunchDarkly account", "ldTag": "A tag to apply to all flags imported to LaunchDarkly", "ldMaintainer": "The ID of the member who will be the maintainer of the imported flags"}'
          $ref: '#/components/schemas/FormVariableConfig'
        tags:
          type: array
          description: Tags to associate with the configuration
          items:
            type: string
          example:
          - example-tag
        name:
          type: string
          description: Name to identify the configuration
          example: Sample configuration
    FlagImportIntegrationLinks:
      type: object
      required:
      - self
      - parent
      - project
      properties:
        self:
          $ref: '#/components/schemas/Link'
        parent:
          $ref: '#/components/schemas/Link'
        project:
          $ref: '#/components/schemas/Link'
    FlagImportIntegrationCollectionLinks:
      type: object
      required:
      - self
      properties:
        self:
          $ref: '#/components/schemas/Link'
        parent:
          $ref: '#/components/schemas/Link'
    UnixMillis:
      type: integer
      format: int64
    PatchOperation:
      type: object
      required:
      - op
      - path
      properties:
        op:
          type: string
          description: The type of operation to perform
          example: replace
        path:
          type: string
          description: A JSON Pointer string specifying the part of the document to operate on
          example: /exampleField
        value:
          description: A JSON value used in "add", "replace", and "test" operations
          example: new example value
    Access:
      type: object
      required:
      - denied
      - allowed
      properties:
        denied:
          type: array
          items:
            $ref: '#/components/schemas/AccessDenied'
        allowed:
          type: array
          items:
            $ref: '#/components/schemas/AccessAllowedRep'
    FlagImportIntegrationCollection:
      type: object
      required:
      - _links
      - items
      properties:
        _links:
          description: The location and content type of related resources
          $ref: '#/components/schemas/FlagImportIntegrationCollectionLinks'
        items:
          type: array
          description: An array of flag import configurations
          items:
            $ref: '#/components/schemas/FlagImportIntegration'
    StatusConflictErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: optimistic_locking_error
        message:
          type: string
          description: Description of the error
          example: Conflict. Optimistic lock error. Try again later.
    NotFoundErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: not_found
        message:
          type: string
          description: Description of the error
          example: Invalid resource identifier
    AccessAllowedReason:
      type: object
      required:
      - effect
      properties:
        resources:
          type: array
          description: Resource specifier strings
          items:
            type: string
          example:
          - proj/*:env/*;qa_*:/flag/*
        notResources:
          type: array
          description: Targeted resources are the resources NOT in this list. The <code>resources</code> and <code>notActions</code> fields must be empty to use this field.
          items:
            type: string
        actions:
          type: array
          description: Actions to perform on a resource
          items:
            $ref: '#/components/schemas/ActionSpecifier'
          example:
          - '*'
        notActions:
          type: array
          description: Targeted actions are the actions NOT in this list. The <code>actions</code> and <code>notResources</code> fields must be empty to use this field.
          items:
            $ref: '#/components/schemas/ActionSpecifier'
        effect:
          type: string
          description: Whether this statement should allow or deny actions on the resources.
          example: allow
          enum:
          - allow
          - deny
        role_name:
          type: string
    AccessAllowedRep:
      type: object
      required:
      - action
      - reason
      properties:
        action:
          $ref: '#/components/schemas/ActionIdentifier'
        reason:
          $ref: '#/components/schemas/AccessAllowedReason'
    FlagImportIntegration:
      type: object
      required:
      - _links
      - _id
      - integrationKey
      - projectKey
      - config
      - tags
      - name
      - version
      - _status
      properties:
        _links:
          description: The location and content type of related resources
          $ref: '#/components/schemas/FlagImportIntegrationLinks'
        _id:
          type: string
          description: The integration ID
          example: 12ab3c4d5ef1a2345bcde67f
        integrationKey:
          type: string
          description: The integration key
          example: split
          enum:
          - split
          - unleash
        projectKey:
          type: string
          description: The project key
          example: default
        config:
          description: The configuration for the given import integration. Only included when requesting a single integration by ID. Refer to the <code>formVariables</code> field in the corresponding <code>manifest.json</code> for a full list of fields for each integration.
          $ref: '#/components/schemas/FormVariableConfig'
        tags:
          type: array
          description: List of tags for this configuration
          items:
            type: string
          example: []
        name:
          type: string
          description: Name of the configuration
          example: Development environment configuration
        version:
          type: integer
          description: Version of the current configuration
          example: 1
        _access:
          description: Details on the allowed and denied actions for this configuration
          $ref: '#/components/schemas/Access'
        _status:
          description: Details on the status of the import job
          $ref: '#/components/schemas/FlagImportStatus'
    FlagImportStatus:
      type: object
      properties:
        status:
          type: string
          description: The current status of the import integrations related import job
          example: pending
          enum:
          - complete
          - importing
          - pending
          - failed
          - partial
        lastImport:
          description: Timestamp of when the most recent successful import occurred.
          example: '1717263000000'
          $ref: '#/components/schemas/UnixMillis'
        lastError:
          description: Timestamp of when the most recent import error occurred, if any
          example: '1714584600000'
          $ref: '#/components/schemas/UnixMillis'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/StatusResponse'
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: Authorization
x-provenance:
  method: harvested
  publisher: LaunchDarkly

  description: ' Federal'
security:
- ApiKey:
  - read
  - write
tags:
- name: Feature flags (beta)
  description: '> ### This feature is in beta

    >

    > To use this feature, pass in a header including the `LD-API-Version` key with value set to `beta`. Use this header with each call. To learn more, read Beta resources.

    >

    > Resources that are in beta are still undergoing testing and development. They may change without notice, including becoming backwards incompatible.'
paths:
  /api/v2/flags/{projectKey}/{environmentKey}/{featureFlagKey}/dependent-flags:
    get:
      responses:
        '200':
          description: Dependent flags collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependentFlagsByEnvironment'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Feature flags (beta)
      summary: List dependent feature flags by environment
      description: '> ### Flag prerequisites is an Enterprise feature

        >

        > Flag prerequisites is available to customers on an Enterprise plan. To learn more, read about our pricing. To upgrade your plan, contact Sales.


        List dependent flags across all environments for the flag specified in the path parameters. A dependent flag is a flag that uses another flag as a prerequisite. To learn more, read Flag prerequisites.'
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      - name: featureFlagKey
        in: path
        description: The feature flag key
        required: true
        schema:
          type: string
          format: string
          description: The feature flag key
      operationId: getDependentFlagsByEnv
  /api/v2/flags/{projectKey}/{featureFlagKey}/dependent-flags:
    get:
      responses:
        '200':
          description: Multi environment dependent flags collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiEnvironmentDependentFlags'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Feature flags (beta)
      summary: List dependent feature flags
      description: '> ### Flag prerequisites is an Enterprise feature

        >

        > Flag prerequisites is available to customers on an Enterprise plan. To learn more, read about our pricing. To upgrade your plan, contact Sales.


        List dependent flags across all environments for the flag specified in the path parameters. A dependent flag is a flag that uses another flag as a prerequisite. To learn more, read Flag prerequisites.'
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: featureFlagKey
        in: path
        description: The feature flag key
        required: true
        schema:
          type: string
          format: string
          description: The feature flag key
      operationId: getDependentFlags
components:
  schemas:
    DependentFlagEnvironment:
      type: object
      required:
      - key
      - _links
      - _site
      properties:
        name:
          type: string
          description: The environment name
          example: Example environment
        key:
          type: string
          description: The environment key
          example: environment-key-123abc
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
        _site:
          description: A link to access the dependent flag in this environment in the LaunchDarkly UI. The href is an opaque URL; do not parse or rely on its structure.
          example: '{ "href": "/example-project/example-environment/features/example-dependent-flag", "type": "text/html" }'
          $ref: '#/components/schemas/Link'
    Link:
      type: object
      properties:
        href:
          type: string
        type:
          type: string
    MultiEnvironmentDependentFlags:
      type: object
      required:
      - items
      - _links
      - _site
      properties:
        items:
          type: array
          description: An array of dependent flags with their environment information
          items:
            $ref: '#/components/schemas/MultiEnvironmentDependentFlag'
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
        _site:
          description: A link to access the prerequisite flag in the LaunchDarkly UI. The href is an opaque URL; do not parse or rely on its structure.
          example: '{ "href": "/example-project/~/features/example-prereq-flag", "type": "text/html" }'
          $ref: '#/components/schemas/Link'
    MultiEnvironmentDependentFlag:
      type: object
      required:
      - key
      - environments
      properties:
        name:
          type: string
          description: The flag name
          example: Example dependent flag
        key:
          type: string
          description: The flag key
          example: dependent-flag-key-123abc
        environments:
          type: array
          description: A list of environments in which the dependent flag appears
          items:
            $ref: '#/components/schemas/DependentFlagEnvironment'
    DependentFlag:
      type: object
      required:
      - key
      - _links
      - _site
      properties:
        name:
          type: string
          description: The flag name
          example: Example dependent flag
        key:
          type: string
          description: The flag key
          example: dependent-flag-key-123abc
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
        _site:
          description: A link to access the dependent flag in the LaunchDarkly UI. The href is an opaque URL; do not parse or rely on its structure.
          example: '{ "href": "/example-project/example-environment/features/example-dependent-flag", "type": "text/html" }'
          $ref: '#/components/schemas/Link'
    DependentFlagsByEnvironment:
      type: object
      required:
      - items
      - _links
      - _site
      properties:
        items:
          type: array
          description: A list of dependent flags, which are flags that use the requested flag as a prerequisite
          items:
            $ref: '#/components/schemas/DependentFlag'
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
        _site:
          description: A link to access the prerequisite flag in the LaunchDarkly UI. The href is an opaque URL; do not parse or rely on its structure.
          example: '{ "href": "/example-project/~/features/example-prereq-flag", "type": "text/html" }'
          $ref: '#/components/schemas/Link'
    NotFoundErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: not_found
        message:
          type: string
          description: Description of the error
          example: Invalid resource identifier
    RateLimitedErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: rate_limited
        message:
          type: string
          description: Description of the error
          example: You've exceeded the API rate limit. Try again later.
    UnauthorizedErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: unauthorized
        message:
          type: string
          description: Description of the error
          example: Invalid access token
    ForbiddenErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: forbidden
        message:
          type: string
          description: Description of the error
          example: Forbidden. Access to the requested resource was denied.
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: Authorization

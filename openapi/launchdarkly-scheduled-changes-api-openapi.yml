components:
  schemas:
    Instruction:
      type: object
      additionalProperties: {}
    MethodNotAllowedErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: method_not_allowed
        message:
          type: string
          description: Description of the error
          example: Method not allowed
    PostFlagScheduledChangesInput:
      type: object
      required:
      - executionDate
      - instructions
      properties:
        comment:
          type: string
          description: Optional comment describing the scheduled changes
          example: optional comment
        executionDate:
          description: When the scheduled changes should be executed
          example: '1636558831870'
          $ref: '#/components/schemas/UnixMillis'
        instructions:
          description: 'The actions to perform on the execution date for these scheduled changes. This should be an array with a single object that looks like <code>{"kind": "scheduled_action"}</code>. Supported scheduled actions include any semantic patch instructions available when updating a feature flag.'
          example: '[ { "kind": "turnFlagOn" }]'
          $ref: '#/components/schemas/Instructions'
    Link:
      type: object
      properties:
        href:
          type: string
        type:
          type: string
    FlagScheduledChangesInput:
      type: object
      required:
      - instructions
      properties:
        comment:
          type: string
          description: Optional comment describing the update to the scheduled changes
          example: optional comment
        instructions:
          description: 'The instructions to perform when updating. This should be an array with objects that look like <code>{"kind": "update_action"}</code>. Some instructions also require a <code>value</code> field in the array element.'
          example: '[ { "kind": "replaceScheduledChangesInstructions", "value": [ { "kind": "turnFlagOff" } ] } ]'
          $ref: '#/components/schemas/Instructions'
    FeatureWorkflowId:
      type: string
    Instructions:
      type: array
      items:
        $ref: '#/components/schemas/Instruction'
    InvalidRequestErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: invalid_request
        message:
          type: string
          description: Description of the error
          example: Invalid request body
    StatusConflictErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: optimistic_locking_error
        message:
          type: string
          description: Description of the error
          example: Conflict. Optimistic lock error. Try again later.
    NotFoundErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: not_found
        message:
          type: string
          description: Description of the error
          example: Invalid resource identifier
    FeatureFlagScheduledChange:
      type: object
      required:
      - _id
      - _creationDate
      - _maintainerId
      - _version
      - executionDate
      - instructions
      properties:
        _id:
          description: The ID of this scheduled change
          example: 12ab3c45de678910abc12345
          $ref: '#/components/schemas/FeatureWorkflowId'
        _creationDate:
          description: Timestamp of when the scheduled change was created
          example: '1654123897062'
          $ref: '#/components/schemas/UnixMillis'
        _maintainerId:
          type: string
          description: The ID of the scheduled change maintainer
          example: 12ab3c45de678910abc12345
        _maintainerServiceTokenId:
          type: string
          description: The ID of the service token that created or updated this scheduled change
        _version:
          type: integer
          description: Version of the scheduled change
          example: 1
        executionDate:
          description: When the scheduled changes should be executed
          example: '1636558831870'
          $ref: '#/components/schemas/UnixMillis'
        instructions:
          description: The actions to perform on the execution date for these scheduled changes
          example: '[ { "kind": "turnFlagOn" }]'
          $ref: '#/components/schemas/Instructions'
        conflicts:
          description: Details on any conflicting scheduled changes
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
    RateLimitedErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: rate_limited
        message:
          type: string
          description: Description of the error
          example: You've exceeded the API rate limit. Try again later.
    UnauthorizedErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: unauthorized
        message:
          type: string
          description: Description of the error
          example: Invalid access token
    UnixMillis:
      type: integer
      format: int64
    ForbiddenErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: forbidden
        message:
          type: string
          description: Description of the error
          example: Forbidden. Access to the requested resource was denied.
    FeatureFlagScheduledChanges:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: Array of scheduled changes
          items:
            $ref: '#/components/schemas/FeatureFlagScheduledChange'
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: Authorization

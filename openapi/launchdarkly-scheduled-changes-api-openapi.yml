                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Scheduled changes
      summary: Get a scheduled change
      description: Get a scheduled change that will be applied to the feature flag by ID.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: featureFlagKey
        in: path
        description: The feature flag key
        required: true
        schema:
          type: string
          format: string
          description: The feature flag key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      - name: id
        in: path
        description: The scheduled change id
        required: true
        schema:
          type: string
          format: string
          description: The scheduled change id
      operationId: getFeatureFlagScheduledChange
    patch:
      responses:
        '200':
          description: Scheduled changes response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagScheduledChange'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowedErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Scheduled changes
      summary: Update scheduled changes workflow
      description: 'Update a scheduled change, overriding existing instructions with the new ones. Updating a scheduled change uses the semantic patch format.


        To make a semantic patch request, you must append `domain-model=launchdarkly.semanticpatch` to your `Content-Type` header. To learn more, read Updates using semantic patch.


        ### Instructions


        Semantic patch requests support the following `kind` instructions for updating scheduled changes.


        Click to expand instructions for updating scheduled changes


        #### deleteScheduledChange


        Removes the scheduled change.


        Here''s an example:


        ```json

        {

        "instructions": [{ "kind": "deleteScheduledChange" }]

        }

        ```


        #### replaceScheduledChangesInstructions


        Removes the existing scheduled changes and replaces them with the new instructions.


        ##### Parameters


        - `value`: An array of the new actions to perform when the execution date for these scheduled changes arrives. Supported scheduled actions are `turnFlagOn` and `turnFlagOff`.


        Here''s an example that replaces the scheduled changes with new instructions to turn flag targeting off:


        ```json

        {

        "instructions": [

        {

        "kind": "replaceScheduledChangesInstructions",

        "value": [ {"kind": "turnFlagOff"} ]

        }

        ]

        }

        ```


        #### updateScheduledChangesExecutionDate


        Updates the execution date for the scheduled changes.


        ##### Parameters


        - `value`: the new execution date, in Unix milliseconds.


        Here''s an example:


        ```json

        {

        "instructions": [

        {

        "kind": "updateScheduledChangesExecutionDate",

        "value": 1754092860000

        }

        ]

        }

        ```'
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: featureFlagKey
        in: path
        description: The feature flag key
        required: true
        schema:
          type: string
          format: string
          description: The feature flag key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      - name: id
        in: path
        description: The scheduled change ID
        required: true
        schema:
          type: string
          format: string
          description: The scheduled change ID
      - name: ignoreConflicts
        in: query
        description: Whether to succeed (`true`) or fail (`false`) when these new instructions conflict with existing scheduled changes
        schema:
          type: boolean
          description: Whether to succeed (`true`) or fail (`false`) when these new instructions conflict with existing scheduled changes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagScheduledChangesInput'
            example:
              comment: Optional comment describing the update to the scheduled changes
              instructions:
              - kind: replaceScheduledChangesInstructions
                value:
                - kind: turnFlagOff
        required: true
      operationId: patchFlagConfigScheduledChange
    delete:
      responses:
        '204':
          description: Action succeeded
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowedErrorRep'
        '409':
          description: Status conflict
          content:

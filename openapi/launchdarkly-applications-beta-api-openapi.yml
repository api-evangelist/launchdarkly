tags:
- name: Applications (beta)
  description: '> ### This feature is in beta

    >

    > To use this feature, pass in a header including the `LD-API-Version` key with value set to `beta`. Use this header with each call. To learn more, read Beta resources.

    >

    > Resources that are in beta are still undergoing testing and development. They may change without notice, including becoming backwards incompatible.


    The applications API lets you create, update, delete, and search for applications and application versions.


    Each application includes information about the app you''re creating, and a set of versions of the app that you''ve released. You can use applications to target particular application versions in your feature flags more easily, and to handle unsupported application versions more gracefully.


    In addition to creating applications through the applications API, you can also create applications in the LaunchDarkly user interface. To learn more, read Applications and application versions. LaunchDarkly also creates applications and application versions automatically when a LaunchDarkly SDK evaluates a feature flag for a context that includes application information. To learn more, read Automatic environment attributes.


    You can use an application in any project in your LaunchDarkly account.


    ### Filtering applications and application versions


    The `filter` parameter supports the following operators: `equals`, `notEquals`, `anyOf`, `startsWith`.


    You can also combine filters in the following ways:


    - Use a comma (`,`) as an AND operator

    - Use a vertical bar (`|`) as an OR operator

    - Use parentheses (`()`) to group filters


    #### Supported fields and operators


    You can only filter certain fields in applications when using the `filter` parameter. Additionally, you can only filter some fields with certain operators.


    When you search for applications, the `filter` parameter supports the following fields and operators:


    |

    Field

    |Description |Supported operators |

    |---|---|---|

    |`key` | The application or application version key, a unique identifier |`equals`, `notEquals`, `anyOf` |

    |`name` | The application name or application version name |`equals`, `notEquals`, `anyOf`, `startsWith` |

    |`autoAdded` | Whether the application or application version was automatically created because it was included in a context when a LaunchDarkly SDK evaluated a feature flag, or was created through the LaunchDarkly UI or REST API |`equals`, `notEquals` |

    |`kind` | The application kind, one of `mobile`, `server`, `browser`. Only available for Get applications. |`equals`, `notEquals`, `anyOf` |

    |`supported` | Whether a mobile application version is supported or unsupported. Only available for Get application versions by application key.|`equals`, `notEquals` |


    For example, the filter `?filter=kind anyOf ["mobile", "server"]` matches applications whose `kind` is either `mobile` or `server`. The filter is not case-sensitive.


    The documented values for `filter` query parameters are prior to URL encoding. For example, the `[` in `?filter=kind anyOf ["mobile", "server"]` must be encoded to `%5B`.


    ### Sorting applications and application versions


    LaunchDarkly supports the following fields for sorting:

    - `name` sorts by application name.

    - `creationDate` sorts by the creation date of the application.


    By default, the sort is in ascending order. Use `-` to sort in descending order. For example, `?sort=name` sorts the response by application name in ascending order, and `?sort=-name` sorts in descending order.'
paths:
  /api/v2/applications:
    get:
      responses:
        '200':
          description: Applications response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCollectionRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Applications (beta)
      summary: Get applications
      description: 'Get a list of applications.


        ### Expanding the applications response


        LaunchDarkly supports expanding the "Get applications" response to include additional fields.


        To expand the response, append the `expand` query parameter and include the following:


        * `flags` includes details on the flags that have been evaluated by the application


        For example, use `?expand=flags` to include the `flags` field in the response. By default, this field is **not** included in the response.'
      parameters:
      - name: filter
        in: query
        description: Accepts filter by `key`, `name`, `kind`, and `autoAdded`. To learn more about the filter syntax, read [Filtering applications and application versions](https://launchdarkly.com/docs/api/applications-beta#filtering-applications-and-application-versions).
        schema:
          type: string
          format: string
          description: Accepts filter by `key`, `name`, `kind`, and `autoAdded`. To learn more about the filter syntax, read [Filtering applications and application versions](https://launchdarkly.com/docs/api/applications-beta#filtering-applications-and-application-versions).
      - name: limit
        in: query
        description: The number of applications to return. Defaults to 10.
        schema:
          type: integer
          format: int64
          description: The number of applications to return. Defaults to 10.
      - name: offset
        in: query
        description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
        schema:
          type: integer
          format: int64
          description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
      - name: sort
        in: query
        description: 'Accepts sorting order and fields. Fields can be comma separated. Possible fields are `creationDate`, `name`. Examples: `sort=name` sort by names ascending, `sort=-name,creationDate` sort by names descending and creationDate ascending.'
        schema:
          type: string
          format: string
          description: 'Accepts sorting order and fields. Fields can be comma separated. Possible fields are `creationDate`, `name`. Examples: `sort=name` sort by names ascending, `sort=-name,creationDate` sort by names descending and creationDate ascending.'
      - name: expand
        in: query
        description: 'A comma-separated list of properties that can reveal additional information in the response. Options: `flags`.'
        schema:
          type: string
          format: string
          description: 'A comma-separated list of properties that can reveal additional information in the response. Options: `flags`.'
      operationId: getApplications
  /api/v2/applications/{applicationKey}:
    get:
      responses:
        '200':
          description: Application response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Applications (beta)
      summary: Get application by key
      description: 'Retrieve an application by the application key.


        ### Expanding the application response


        LaunchDarkly supports expanding the "Get application" response to include additional fields.


        To expand the response, append the `expand` query parameter and include the following:


        * `flags` includes details on the flags that have been evaluated by the application


        For example, use `?expand=flags` to include the `flags` field in the response. By default, this field is **not** included in the response.'
      parameters:
      - name: applicationKey
        in: path
        description: The application key
        required: true
        schema:
          type: string
          format: string
          description: The application key
      - name: expand
        in: query
        description: 'A comma-separated list of properties that can reveal additional information in the response. Options: `flags`.'
        schema:
          type: string
          format: string
          description: 'A comma-separated list of properties that can reveal additional information in the response. Options: `flags`.'
      operationId: getApplication
    patch:
      responses:
        '200':
          description: Application response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Applications (beta)
      summary: Update application
      description: Update an application. You can update the `description` and `kind` fields. Requires a JSON patch representation of the desired changes to the application. To learn more, read Updates.
      parameters:
      - name: applicationKey
        in: path
        description: The application key
        required: true
        schema:
          type: string
          format: string
          description: The application key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
            example:
            - op: replace
              path: /description
              value: Updated description
        required: true
      operationId: patchApplication
    delete:
      responses:
        '204':
          description: Action succeeded
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Applications (beta)
      summary: Delete application
      description: Delete an application.
      parameters:
      - name: applicationKey
        in: path
        description: The application key
        required: true
        schema:
          type: string
          format: string
          description: The application key
      operationId: deleteApplication
  /api/v2/applications/{applicationKey}/versions:
    get:
      responses:
        '200':
          description: Application versions response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVersionsCollectionRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Applications (beta)
      summary: Get application versions by application key
      description: Get a list of versions for a specific application in an account.
      parameters:
      - name: filter
        in: query
        description: Accepts filter by `key`, `name`, `supported`, and `autoAdded`. To learn more about the filter syntax, read [Filtering applications and application versions](https://launchdarkly.com/docs/api/applications-beta#filtering-applications-and-application-versions).
        schema:
          type: string
          format: string
          description: Accepts filter by `key`, `name`, `supported`, and `autoAdded`. To learn more about the filter syntax, read [Filtering applications and application versions](https://launchdarkly.com/docs/api/applications-beta#filtering-applications-and-application-versions).
      - name: applicationKey
        in: path
        description: The application key
        required: true
        schema:
          type: string
          format: string
          description: The application key
      - name: limit
        in: query
        description: The number of versions to return. Defaults to 50.
        schema:
          type: integer
          format: int64
          description: The number of versions to return. Defaults to 50.
      - name: offset
        in: query
        description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
        schema:
          type: integer
          format: int64
          description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
      - name: sort
        in: query
        description: 'Accepts sorting order and fields. Fields can be comma separated. Possible fields are `creationDate`, `name`. Examples: `sort=name` sort by names ascending, `sort=-name,creationDate` sort by names descending and creationDate ascending.'
        schema:
          type: string
          format: string
          description: 'Accepts sorting order and fields. Fields can be comma separated. Possible fields are `creationDate`, `name`. Examples: `sort=name` sort by names ascending, `sort=-name,creationDate` sort by names descending and creationDate ascending.'
      operationId: getApplicationVersions
  /api/v2/applications/{applicationKey}/versions/{versionKey}:
    patch:
      responses:
        '200':
          description: Application version response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVersionRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:

              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Applications (beta)
      summary: Update application version
      description: Update an application version. You can update the `supported` field. Requires a JSON patch representation of the desired changes to the application version. To learn more, read Updates.
      parameters:
      - name: applicationKey
        in: path
        description: The application key
        required: true

openapi: 3.2.0
info:
  title: Launchdarkly Workflows API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
  description: 'Operations tagged Workflows across 2 of this provider''s published API definitions: launchdarkly-openapi.json, launchdarkly-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.launchdarkly.com
  description: ' Default'
- url: https://app.launchdarkly.us
  description: ' Federal'
- url: https://app.launchdarkly.com/api/v2
  description: LaunchDarkly Production API
tags:
- name: Workflows
  description: '> ### Workflows are in maintenance mode

    >

    > The workflows feature is in maintenance mode, and is planned for future deprecation at a date not yet specified. We will work with existing customers using workflows to migrate to a replacement solution when deprecation occurs.


    A workflow is a set of actions that you can schedule in advance to make changes to a feature flag at a future date and time. You can also include approval requests at different stages of a workflow. To learn more, read Workflows.


    The actions supported are as follows:


    - Turning targeting `ON` or `OFF`

    - Setting the default variation

    - Adding targets to a given variation

    - Creating a rule to target by segment

    - Modifying the rollout percentage for rules


    You can create multiple stages of a flag release workflow. Unique stages are defined by their conditions: either approvals and/or scheduled changes.


    Several of the endpoints in the workflows API require a workflow ID or one or more member IDs. The workflow ID is returned as part of the Create workflow and Get workflows responses. It is the `_id` field, or the `_id` field of each element in the `items` array. The member ID is returned as part of the List account members response. It is the `_id` field of each element in the `items` array.'
paths:
  /api/v2/projects/{projectKey}/flags/{featureFlagKey}/environments/{environmentKey}/workflows:
    get:
      responses:
        '200':
          description: Workflows collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomWorkflowsListingOutput'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Workflows
      summary: Get workflows
      description: Display workflows associated with a feature flag.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: featureFlagKey
        in: path
        description: The feature flag key
        required: true
        schema:
          type: string
          format: string
          description: The feature flag key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      - name: status
        in: query
        description: Filter results by workflow status. Valid status filters are `active`, `completed`, and `failed`.
        schema:
          type: string
          format: string
          description: Filter results by workflow status. Valid status filters are `active`, `completed`, and `failed`.
      - name: sort
        in: query
        description: A field to sort the items by. Prefix field by a dash ( - ) to sort in descending order. This endpoint supports sorting by `creationDate` or `stopDate`.
        schema:
          type: string
          format: string
          description: A field to sort the items by. Prefix field by a dash ( - ) to sort in descending order. This endpoint supports sorting by `creationDate` or `stopDate`.
      - name: limit
        in: query
        description: The maximum number of workflows to return. Defaults to 20.
        schema:
          type: integer
          format: int64
          description: The maximum number of workflows to return. Defaults to 20.
      - name: offset
        in: query
        description: Where to start in the list. Defaults to 0. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
        schema:
          type: integer
          format: int64
          description: Where to start in the list. Defaults to 0. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
      operationId: getWorkflows
      security:
      - ApiKey:
        - read
        - write
    post:
      responses:
        '201':
          description: Workflow response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomWorkflowOutput'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Workflows
      summary: Create workflow
      description: '> ### Workflows are in maintenance mode

        >

        > The workflows feature is in maintenance mode, and is planned for future deprecation at a date not yet specified. We will work with existing customers using workflows to migrate to a replacement solution when deprecation occurs.


        Create a workflow for a feature flag. You can create a workflow directly, or you can apply a template to create a new workflow.


        ### Creating a workflow


        You can use the create workflow endpoint to create a workflow directly by adding a `stages` array to the request body.


        For each stage, define the `name`, `conditions` when the stage should be executed, and `action` that describes the stage. For approval stages, only standard LaunchDarkly approvals are permitted. Workflows of `kind` `integration-approval` cannot be used for custom workflows.


        Click to expand example


        _Example request body_

        ```json

        {

        "name": "Progressive rollout starting in two days",

        "description": "Turn flag targeting on and increase feature rollout in 10% increments each day",

        "stages": [

        {

        "name": "10% rollout on day 1",

        "conditions": [

        {

        "kind": "schedule",

        "scheduleKind": "relative", // or "absolute"

        // If "scheduleKind" is "absolute", set "executionDate";

        // "waitDuration" and "waitDurationUnit" will be ignored

        "waitDuration": 2,

        "waitDurationUnit": "calendarDay"

        },

        {

        "kind": "ld-approval",

        "notifyMemberIds": [ "507f1f77bcf86cd799439011" ],

        "notifyTeamKeys": [ "team-key-123abc" ]

        }

        ],

        "action": {

        "instructions": [

        {

        "kind": "turnFlagOn"

        },

        {

        "kind": "updateFallthroughVariationOrRollout",

        "rolloutWeights": {

        "452f5fb5-7320-4ba3-81a1-8f4324f79d49": 90000,

        "fc15f6a4-05d3-4aa4-a997-446be461345d": 10000

        }

        }

        ]

        }

        }

        ]

        }

        ```


        ### Creating a workflow by applying a workflow template


        You can also create a workflow by applying a workflow template. If you pass a valid workflow template key as the `templateKey` query parameter with the request, the API will attempt to create a new workflow with the stages defined in the workflow template with the corresponding key.


        #### Applicability of stages

        Templates are created in the context of a particular flag in a particular environment in a particular project. However, because workflows created from a template can be applied to any project, environment, and flag, some steps of the workflow may need to be updated in order to be applicable for the target resource.


        You can pass a `dryRun` query parameter to tell the API to return a report of which steps of the workflow template are applicable in the target project/environment/flag, and which will need to be updated. When the `dryRun` query parameter is present the response body includes a `meta` property that holds a list of parameters that could potentially be inapplicable for the target resource. Each of these parameters will include a `valid` field. You will need to update any invalid parameters in order to create the new workflow. You can do this using the `parameters` property, which overrides the workflow template parameters.


        #### Overriding template parameters

        You can use the `parameters` property in the request body to tell the API to override the specified workflow template parameters with new values that are specific to your target project/environment/flag.


        Click to expand example


        _Example request body_

        ```json

        {

        "name": "workflow created from my-template",

        "description": "description of my workflow",

        "parameters": [

        {

        "_id": "62cf2bc4cadbeb7697943f3b",

        "path": "/clauses/0/values",

        "default": {

        "value": ["updated-segment"]

        }

        },

        {

        "_id": "62cf2bc4cadbeb7697943f3d",

        "path": "/variationId",

        "default": {

        "value": "abcd1234-abcd-1234-abcd-1234abcd12"

        }

        }

        ]

        }

        ```


        If there are any steps in the template that are not applicable to the target resource, the workflow will not be created, and the `meta` property will be included in the response body detailing which parameters need to be updated.'
      parameters:
      - name: templateKey
        in: query
        description: The template key to apply as a starting point for the new workflow
        schema:
          type: string
          format: string
          description: The template key to apply as a starting point for the new workflow
      - name: dryRun
        in: query
        description: Whether to call the endpoint in dry-run mode
        schema:
          type: boolean
          description: Whether to call the endpoint in dry-run mode
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: featureFlagKey
        in: path
        description: The feature flag key
        required: true
        schema:
          type: string
          format: string
          description: The feature flag key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomWorkflowInput'
            example:
              description: Turn flag on for 10% of customers each day
              name: Progressive rollout starting in two days
              stages:
              - action:
                  instructions:
                  - kind: turnFlagOn
                  - kind: updateFallthroughVariationOrRollout
                    rolloutWeights:
                      452f5fb5-7320-4ba3-81a1-8f4324f79d49: 90000
                      fc15f6a4-05d3-4aa4-a997-446be461345d: 10000
                conditions:
                - kind: schedule
                  scheduleKind: relative
                  waitDuration: 2
                  waitDurationUnit: calendarDay
                name: 10% rollout on day 1
        required: true
      operationId: postWorkflow
      security:
      - ApiKey:
        - read
        - write
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'
  /api/v2/projects/{projectKey}/flags/{featureFlagKey}/environments/{environmentKey}/workflows/{workflowId}:
    get:
      responses:
        '200':
          description: Workflow response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomWorkflowOutput'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Workflows
      summary: Get custom workflow
      description: Get a specific workflow by ID.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: featureFlagKey
        in: path
        description: The feature flag key
        required: true
        schema:
          type: string
          format: string
          description: The feature flag key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      - name: workflowId
        in: path
        description: The workflow ID
        required: true
        schema:
          type: string
          format: string
          description: The workflow ID
      operationId: getCustomWorkflow
      security:
      - ApiKey:
        - read
        - write
    delete:
      responses:
        '204':
          description: Action completed successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Workflows
      summary: Delete workflow
      description: Delete a workflow from a feature flag.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: featureFlagKey
        in: path
        description: The feature flag key
        required: true
        schema:
          type: string
          format: string

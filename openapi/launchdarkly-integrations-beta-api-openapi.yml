openapi: 3.2.0
info:
  title: LaunchDarkly REST Integrations (beta) API
  description: 'This documentation describes LaunchDarkly''s REST API. To access the complete OpenAPI spec directly, use Get OpenAPI spec. To learn how to use LaunchDarkly using the user interface (UI) instead, read our product documentation. ## Authentication


    LaunchDarkly''s REST API uses the HTTPS protocol with a minimum TLS version of 1.2. All REST API resources are authenticated with either personal or service access tokens, or session cookies. Other authentication mechanisms are not supported. You can manage personal access tokens on your **Authorization** page in the LaunchDarkly UI. LaunchDarkly also has SDK keys, mobile keys, and client-side IDs that are used by our server-side SDKs, mobile SDKs, and JavaScript-based SDKs, respectively. **These keys cannot be used to access our REST API**. These keys are environment-specific, and can only perform read-only operations such as fetching feature flag settings. | Auth mechanism | Allowed resources | Use cases |

    | ----------------------------------------------------------------------------------------------- | ----------------------------------------------------------------------------------------------------- | -------------------------------------------------- |

    | Personal or service access tokens | Can be customized on a per-token basis | Building scripts, custom integrations, data export. |

    | SDK keys | Can only access read-only resources specific to server-side SDKs. Restricted to a single environment. | Server-side SDKs |

    | Mobile keys | Can only access read-only resources specific to mobile SDKs, and only for flags marked available to mobile keys. Restricted to a single environment. | Mobile SDKs |

    | Client-side ID | Can only access read-only resources specific to JavaScript-based client-side SDKs, and only for flags marked available to client-side. Restricted to a single environment. | Client-side JavaScript |


    > #### Keep your access tokens and SDK keys private

    >

    > Access tokens should _never_ be exposed in untrusted contexts. Never put an access token in client-side JavaScript, or embed it in a mobile application. LaunchDarkly has special mobile keys that you can embed in mobile apps. If you accidentally expose an access token or SDK key, you can reset it from your **Authorization** page. >

    > The client-side ID is safe to embed in untrusted contexts. It''s designed for use in client-side JavaScript. ### Authentication using request header


    The preferred way to authenticate with the API is by adding an `Authorization` header containing your access token to your requests. The value of the `Authorization` header must be your access token. Manage personal access tokens from the **Authorization** page. ### Authentication using session cookie


    For testing purposes, you can make API calls directly from your web browser. If you are logged in to the LaunchDarkly application, the API will use your existing session to authenticate calls. Depending on the permissions granted as part of your role, you may not have permission to perform some API calls. You will receive a `401` response code in that case. > ### Modifying the Origin header causes an error

    >

    > LaunchDarkly validates that the Origin header for any API request authenticated by a session cookie matches the expected Origin header. The expected Origin header is `https://app.launchdarkly.com`. >

    > If the Origin header does not match what''s expected, LaunchDarkly returns an error. This error can prevent the LaunchDarkly app from working correctly. >

    > Any browser extension that intentionally changes the Origin header can cause this problem. For example, Cross-Origin Resource Sharing (CORS) extensions used during development can modify the Origin header and cause the app to fail. >

    > To prevent this error, do not modify your Origin header. >

    > LaunchDarkly does not require origin matching when authenticating with an access token, so this issue does not affect normal API usage.'
  contact:
    name: LaunchDarkly Technical Support Team
    url: https://support.launchdarkly.com
    email: support@launchdarkly.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '2.0'
servers:
- url: https://app.launchdarkly.com
  description: ' Default'
- url: https://app.launchdarkly.us
  description: ' Federal'
security:
- ApiKey:
  - read
  - write
tags:
- name: Integrations (beta)
  description: '> ### This feature is in beta

    >

    > To use this feature, pass in a header including the `LD-API-Version` key with value set to `beta`. Use this header with each call. To learn more, read Beta resources.

    >

    > Resources that are in beta are still undergoing testing and development. They may change without notice, including becoming backwards incompatible.


    > ### Integration configuration is an Enterprise feature

    >

    > Integration configuration is available to customers on an Enterprise plan. To learn more, read about our pricing. To upgrade your plan, contact Sales.


    You can use the integrations API to create, delete, and manage integration configurations.


    An integration configuration stores and manages configuration details for an integration between LaunchDarkly and a third-party application. To learn more about building an integration, read Using the LaunchDarkly integration framework and Building partner integrations.'
paths:
  /api/v2/integration-configurations/keys/{integrationKey}:
    get:
      responses:
        '200':
          description: List of Integration Configurations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConfigurationCollectionRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Integration key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Integrations (beta)
      summary: Get all configurations for the integration
      description: Get all integration configurations with the specified integration key. (Excludes persistent store and flag import configurations.).
      parameters:
      - name: integrationKey
        in: path
        description: A key that corresponds to the third-party integration you are configuring. For example, `mezmo`.
        required: true
        schema:
          type: string
          format: string
          description: A key that corresponds to the third-party integration you are configuring. For example, `mezmo`.
      - name: includePending
        in: query
        description: When `true`, includes pending two-step setup drafts that were created using `/setup` but are not yet finalized. Defaults to `false`, which returns only active configurations.
        schema:
          type: boolean
          description: When `true`, includes pending two-step setup drafts that were created using `/setup` but are not yet finalized. Defaults to `false`, which returns only active configurations.
      operationId: getAllIntegrationConfigurations
    post:
      responses:
        '201':
          description: Integration Configuration response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConfigurationsRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Integration key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Integrations (beta)
      summary: Create integration configuration
      description: Create a new integration configuration. (Excludes persistent store and flag import configurations.)
      parameters:
      - name: integrationKey
        in: path
        description: The integration key
        required: true
        schema:
          type: string
          format: string
          description: The integration key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationConfigurationPost'
        required: true
      operationId: createIntegrationConfiguration
  /api/v2/integration-configurations/{integrationConfigurationId}:
    get:
      responses:
        '200':
          description: Integration Configuration response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConfigurationsRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Integration ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Integrations (beta)
      summary: Get an integration configuration
      description: Get integration configuration with the specified ID. (Excludes persistent store and flag import configurations.)
      parameters:
      - name: integrationConfigurationId
        in: path
        description: Integration configuration ID
        required: true
        schema:
          type: string
          format: string
          description: Integration configuration ID
      operationId: getIntegrationConfiguration
    patch:
      responses:
        '200':
          description: Integration configuration response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConfigurationsRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Integrations (beta)
      summary: Update integration configuration
      description: Update an integration configuration. Updating an integration configuration uses a JSON patch representation of the desired changes. To learn more, read Updates.
      parameters:
      - name: integrationConfigurationId
        in: path
        description: The ID of the integration configuration
        required: true
        schema:
          type: string
          format: string
          description: The ID of the integration configuration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
            example:
            - op: replace
              path: /on
              value: false
        required: true
      operationId: updateIntegrationConfiguration
    delete:
      responses:
        '204':
          description: Action succeeded
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Integrations (beta)
      summary: Delete integration configuration
      description: Delete an integration configuration by ID. (Excludes persistent store and flag import configurations.)
      parameters:
      - name: integrationConfigurationId
        in: path
        description: The ID of the integration configuration to be deleted
        required: true
        schema:
          type: string
          format: string
          description: The ID of the integration configuration to be deleted
      operationId: deleteIntegrationConfiguration
components:
  schemas:
    CapabilityConfigPost:
      type: object
      properties:
        approvals:
          description: The approvals capability configuration for this integration
          example: '{"additionalFormVariables": "[]"}'
          $ref: '#/components/schemas/ApprovalsCapabilityConfig'
        auditLogEventsHook:
          description: The audit log events hook capability configuration for the integration
          example: '{"key": "value"}'
          $ref: '#/components/schemas/AuditLogEventsHookCapabilityConfigPost'
    DynamicOptions:
      type: object
      properties:
        allowUnknownValue:
          type: boolean
        endpoint:
          $ref: '#/components/schemas/Endpoint'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/DynamicOptionFiltersItems'
        parser:
          $ref: '#/components/schemas/DynamicOptionsParser'
        source:
          $ref: '#/components/schemas/DynamicOptionsSource'
    CapabilityConfigRep:
      type: object
      properties:
        approvals:
          description: The approvals capability configuration for this integration
          $ref: '#/components/schemas/ApprovalsCapabilityConfig'
        auditLogEventsHook:
          description: The audit log events hook capability configuration for the integration
          example: '{"policy": "value"}'
          $ref: '#/components/schemas/AuditLogEventsHookCapabilityConfigRep'
    JSONPatch:
      type: array
      items:
        $ref: '#/components/schemas/PatchOperation'
    AccessDenied:
      type: object
      required:
      - action
      - reason
      properties:
        action:
          $ref: '#/components/schemas/ActionIdentifier'
        reason:
          $ref: '#/components/schemas/AccessDeniedReason'
    StatementPost:
      type: object
      required:
      - effect
      properties:
        resources:
          type: array
          description: Resource specifier strings
          items:
            type: string
          example:
          - proj/*:env/*:flag/*;testing-tag
        notResources:
          type: array
          description: Targeted resources are the resources NOT in this list. The <code>resources</code> field must be empty to use this field.
          items:
            type: string
        actions:
          type: array
          description: Actions to perform on a resource
          items:
            $ref: '#/components/schemas/ActionSpecifier'
          example:
          - '*'
        notActions:
          type: array
          description: Targeted actions are the actions NOT in this list. The <code>actions</code> field must be empty to use this field.
          items:
            $ref: '#/components/schemas/ActionSpecifier'
        effect:
          type: string
          description: Whether this statement should allow or deny actions on the resources.
          example: allow
          enum:
          - allow
          - deny
    IntegrationConfigurationsRep:
      type: object
      required:
      - _links
      - _id
      - name
      properties:
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
        _id:
          type: string
          description: The unique identifier for this integration configuration
        name:
          type: string
          description: A human-friendly name for the integration
          example: Example Datadog integration
        _createdAt:
          description: The time the integration configuration was created
          $ref: '#/components/schemas/UnixMillis'
        _integrationKey:
          type: string
          description: The type of integration
          example: datadog
        tags:
          type: array
          description: An array of tags for this integration
          items:
            type: string
          example:
          - testing
        enabled:
          type: boolean
          description: Whether the integration is currently active
        _access:
          description: Details on the allowed and denied actions for this integration configuration
          $ref: '#/components/schemas/Access'
        configValues:
          type: object
          additionalProperties: {}
          description: Details on configuration for an integration of this type. Refer to the <code>formVariables</code> field in the corresponding <code>manifest.json</code> for a full list of fields for each integration.
        capabilityConfig:
          description: The capability configuration for the integration
          example: '{"auditLogEventsHook": "statements": []"}'
          $ref: '#/components/schemas/CapabilityConfigRep'
        snowflakeSetupScript:
          type: string
          description: Consolidated SQL script for Snowflake Warehouse Native Experimentation setup. Present only for setup endpoint responses.
        redshiftSetupScripts:
          type: array
          description: SQL setup scripts (4 parts) for Redshift native Experimentation setup. Present on setup endpoint responses and, rehydrated from the persisted config, on active (finalized) Redshift native Experimentation configurations.
          items:
            type: string
        redshiftIAMPermissionsPolicy:
          type: string
          description: IAM permissions policy JSON for the customer's Redshift IAM role. Present only for setup endpoint responses.
        redshiftIAMTrustPolicy:
          type: string
          description: IAM trust policy JSON for the customer's Redshift IAM role. Present only for setup endpoint responses.
        clickHouseSetupScript:
          type: string
          description: SQL setup script for ClickHouse native Experimentation. On setup endpoint responses it also creates the experimentation user with the submitted password. When the two-step setup flow is enabled, it is rehydrated from the persisted config on other responses with only the grants, never the password.
        _maintainerId:
          type: string
          description: The ID of the member who maintains this integration configuration. Defaults to the member who created it.
    OptionsArray:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
    InvalidRequestErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: invalid_request
        message:
          type: string
          description: Description of the error
          example: Invalid request body
    DynamicOptionsParser:
      type: object
      properties:
        optionsItems:
          $ref: '#/components/schemas/OptionsArray'
        optionsPath:
          type: string
    RateLimitedErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: rate_limited
        message:
          type: string
          description: Description of the error
          example: You've exceeded the API rate limit. Try again later.
    AccessDeniedReason:
      type: object
      required:
      - effect
      properties:
        resources:
          type: array
          description: Resource specifier strings
          items:
            type: string
          example:
          - proj/*:env/*;qa_*:/flag/*
        notResources:
          type: array
          description: Targeted resources are the resources NOT in this list. The <code>resources</code> and <code>notActions</code> fields must be empty to use this field.
          items:
            type: string
        actions:
          type: array
          description: Actions to perform on a resource
          items:
            $ref: '#/components/schemas/ActionSpecifier'
          example:
          - '*'
        notActions:
          type: array
          description: Targeted actions are the actions NOT in this list. The <code>actions</code> and <code>notResources</code> fields must be empty to use this field.
          items:
            $ref: '#/components/schemas/ActionSpecifier'
        effect:
          type: string
          description: Whether this statement should allow or deny actions on the resources.
          example: allow
          enum:
          - allow
          - deny
        role_name:
          type: string
    UnauthorizedErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: unauthorized
        message:
          type: string
          description: Description of the error
          example: Invalid access token
    ForbiddenErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: forbidden
        message:
          type: string
          description: Description of the error
          example: Forbidden. Access to the requested resource was denied.
    ActionSpecifier:
      type: string
    IntegrationConfigurationCollectionRep:
      type: object
      required:
      - items
      - _links
      properties:
        items:
          type: array
          description: An array of integration configurations
          items:
            $ref: '#/components/schemas/IntegrationConfigurationsRep'
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
    Link:
      type: object
      properties:
        href:
          type: string
        type:
          type: string
    ActionIdentifier:
      type: string
    AuditLogEventsHookCapabilityConfigRep:
      type: object
      properties:
        statements:
          type: array
          description: The set of resources you wish to subscribe to audit log notifications for.
          items:
            $ref: '#/components/schemas/Statement'
    DynamicOptionsSource:
      type: object
      properties:
        key:
          type: string
        type:
          type: string
    UnixMillis:
      type: integer
      format: int64
    FormVariable:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
        placeholder:
          type: string
        isOptional:
          type: boolean
        defaultValue: {}
        allowedValues:
          type: array
          items:
            type: string
        dynamicOptions:
          $ref: '#/components/schemas/DynamicOptions'
    Statement:
      type: object
      required:
      - effect
      properties:
        resources:
          type: array
          description: Resource specifier strings
          items:
            type: string
          example:
          - proj/*:env/*;qa_*:/flag/*
        notResources:
          type: array
          description: Targeted resources are the resources NOT in this list. The <code>resources</code> and <code>notActions</code> fields must be empty to use this field.
          items:
            type: string
        actions:
          type: array
          description: Actions to perform on a resource
          items:
            $ref: '#/components/schemas/ActionSpecifier'
          example:
          - '*'
        notActions:
          type: array
          description: Targeted actions are the actions NOT in this list. The <code>actions</code> and <code>notResources</code> fields must be empty to use this field.
          items:
            $ref: '#/components/schemas/ActionSpecifier'
        effect:
          type: string
          description: Whether this statement should allow or deny actions on the resources.
          example: allow
          enum:
          - allow
          - deny
    PatchOperation:
      type: object
      required:
      - op
      - path
      properties:
        op:
          type: string
          description: The type of operation to perform
          example: replace
        path:
          type: string
          description: A JSON Pointer string specifying the part of the document to operate on
          example: /exampleField
        value:
          description: A JSON value used in "add", "replace", and "test" operations
          example: new example value
    ApprovalsCapabilityConfig:
      type: object
      properties:
        additionalFormVariables:
          type: array
          description: The additional form variables for the approvals capability
          items:
            $ref: '#/components/schemas/FormVariable'
          example: invalid example
    StatementPostList:
      type: array
      items:
        $ref: '#/components/schemas/StatementPost'
    Access:
      type: object
      required:
      - denied
      - allowed
      properties:
        denied:
          type: array
          items:
            $ref: '#/components/schemas/AccessDenied'
        allowed:
          type: array
          items:
            $ref: '#/components/schemas/AccessAllowedRep'
    StatusConflictErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: optimistic_locking_error
        message:
          type: string
          description: Description of the error
          example: Conflict. Optimistic lock error. Try again later.
    NotFoundErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: not_found
        message:
          type: string
          description: Description of the error
          example: Invalid resource identifier
    AccessAllowedReason:
      type: object
      required:
      - effect
      properties:
        resources:
          type: array
          description: Resource specifier strings
          items:
            type: string
          example:
          - proj/*:env/*;qa_*:/flag/*
        notResources:
          type: array
          description: Targeted resources are the resources NOT in this list. The <code>resources</code> and <code>notActions</code> fields must be empty to use this field.
          items:
            type: string
        actions:
          type: array
          description: Actions to perform on a resource
          items:
            $ref: '#/components/schemas/ActionSpecifier'
          example:
          - '*'
        notActions:
          type: array
          description: Targeted actions are the actions NOT in this list. The <code>actions</code> and <code>notResources</code> fields must be empty to use this field.
          items:
            $ref: '#/components/schemas/ActionSpecifier'
        effect:
          type: string
          description: Whether this statement should allow or deny actions on the resources.
          example: allow
          enum:
          - allow
          - deny
        role_name:
          type: string
    IntegrationConfigurationPost:
      type: object
      required:
      - name
      - configValues
      properties:
        name:
          type: string
          description: The name of the integration configuration
          example: Example integration configuration
        enabled:
          type: boolean
          description: Whether the integration configuration is enabled. If omitted, defaults to true
          example: true
        tags:
          type: array
          description: Tags for the integration
          items:
            type: string
          example:
          - ops
        configValues:
          type: object
          additionalProperties: {}
          description: The unique set of fields required to configure the integration. Refer to the <code>formVariables</code> field in the corresponding <code>manifest.json</code> at https://github.com/launchdarkly/integration-framework/tree/main/integrations for a full list of fields for the integration you wish to configure.
          example:
            optional: an optional property
            required: the required property
            url: https://example.com
        capabilityConfig:
          description: The capability configuration for the integration
          example: '{"auditLogEventsHook": "policy": []"}'
          $ref: '#/components/schemas/CapabilityConfigPost'
    DynamicOptionFiltersItems:
      type: object
      properties:
        attribute:
          type: string
        variableKey:
          type: string
    Endpoint:
      type: object
      properties:
        headers:
          type: array
          items:
            $ref: '#/components/schemas/HeaderItems'
        hmacSignature:
          $ref: '#/components/schemas/HMACSignature'
        method:
          type: string
        url:
          type: string
    AccessAllowedRep:
      type: object
      required:
      - action
      - reason
      properties:
        action:

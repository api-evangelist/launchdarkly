        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
      tags:
      - Follow flags
      summary: Remove a member as a follower of a flag in a project and environment
      description: Remove a member as a follower to a flag in a project and environment
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: featureFlagKey
        in: path
        description: The feature flag key
        required: true
        schema:
          type: string
          format: string
          description: The feature flag key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      - name: memberId
        in: path
        description: The memberId of the member to remove as a follower of the flag. Reader roles can only remove themselves.
        required: true
        schema:
          type: string
          format: string
          description: The memberId of the member to remove as a follower of the flag. Reader roles can only remove themselves.
      operationId: deleteFlagFollower
components:
  schemas:
    followersPerFlag:
      type: object
      properties:
        flagKey:
          type: string
          description: The flag key
          example: example-flag-key
        followers:
          type: array
          description: A list of members who are following this flag
          items:
            $ref: '#/components/schemas/FollowFlagMember'
    Link:
      type: object
      properties:
        href:
          type: string
        type:
          type: string
    FlagFollowersGetRep:
      type: object
      required:
      - _links
      - items
      properties:
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
          example:
            self:
              href: /api/v2/projects/my-project/flags/my-flay/environments/my-environment/followers
              type: application/json
        items:
          type: array
          description: An array of members who are following this flag
          items:
            $ref: '#/components/schemas/FollowFlagMember'
    InvalidRequestErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: invalid_request
        message:
          type: string
          description: Description of the error
          example: Invalid request body
    FollowFlagMember:
      type: object
      required:
      - _links
      - _id
      - role
      - email
      properties:
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
          example:
            self:
              href: /api/v2/members/569f183514f4432160000007
              type: application/json
        _id:
          type: string
          description: The member's ID
          example: 569f183514f4432160000007
        firstName:
          type: string
          description: The member's first name
          example: Ariel
        lastName:
          type: string
          description: The member's last name
          example: Flores
        role:
          type: string
          description: The member's base role. If the member has no additional roles, this role will be in effect.
          example: admin
        email:
          type: string
          description: The member's email address
          example: ariel@acme.com
    NotFoundErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: not_found
        message:
          type: string
          description: Description of the error
          example: Invalid resource identifier
    FlagFollowersByProjEnvGetRep:
      type: object
      required:
      - _links
      properties:
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
          example:
            self:
              href: /api/v2/projects/my-project/flags/my-flay/environments/my-environment/followers
              type: application/json
        items:
          type: array
          description: An array of flags and their followers
          items:
            $ref: '#/components/schemas/followersPerFlag'
    UnauthorizedErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: unauthorized
        message:
          type: string
          description: Description of the error
          example: Invalid access token
    ForbiddenErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: forbidden
        message:
          type: string
          description: Description of the error
          example: Forbidden. Access to the requested resource was denied.
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: Authorization

tags:
- name: Follow flags
  description: 'Follow flags to receive email updates about targeting changes to a flag in a project and environment.


    Several of the endpoints in the follow flags API require a member ID. The member ID is returned as part of the Invite new members and List account members responses. It is the `_id` field of each element in the `items` array.'
paths:
  /api/v2/projects/{projectKey}/environments/{environmentKey}/followers:
    get:
      responses:
        '200':
          description: Flags and flag followers response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagFollowersByProjEnvGetRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
      tags:
      - Follow flags
      summary: Get followers of all flags in a given project and environment
      description: Get followers of all flags in a given environment and project
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      operationId: getFollowersByProjEnv
  /api/v2/projects/{projectKey}/flags/{featureFlagKey}/environments/{environmentKey}/followers:
    get:
      responses:
        '200':
          description: Flag followers response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagFollowersGetRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
      tags:
      - Follow flags
      summary: Get followers of a flag in a project and environment
      description: Get a list of members following a flag in a project and environment
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: featureFlagKey
        in: path
        description: The feature flag key
        required: true
        schema:
          type: string
          format: string
          description: The feature flag key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      operationId: getFlagFollowers
  /api/v2/projects/{projectKey}/flags/{featureFlagKey}/environments/{environmentKey}/followers/{memberId}:
    put:
      responses:
        '204':
          description: Action succeeded
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
      tags:
      - Follow flags
      summary: Add a member as a follower of a flag in a project and environment
      description: Add a member as a follower to a flag in a project and environment
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: featureFlagKey
        in: path
        description: The feature flag key
        required: true
        schema:
          type: string
          format: string
          description: The feature flag key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      - name: memberId
        in: path
        description: The memberId of the member to add as a follower of the flag. Reader roles can only add themselves.
        required: true
        schema:
          type: string
          format: string
          description: The memberId of the member to add as a follower of the flag. Reader roles can only add themselves.
      operationId: putFlagFollower
    delete:
      responses:
        '204':
          description: Action succeeded
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:

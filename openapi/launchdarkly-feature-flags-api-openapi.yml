  /flags/{projectKey}/{flagKey}:
    get:
      operationId: getFlagsByProjectKeyByFlagKey
      summary: Get a feature flag
      description: Returns a single feature flag by its key, including all environment-specific configurations and targeting rules.
      tags:
      - Feature Flags
      parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/FlagKey'
      - name: env
        in: query
        description: Filter configurations by environment key.
        schema:
          type: string
      responses:
        '200':
          description: Successful response containing the feature flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag_2'
        '401':
          description: Unauthorized. Invalid or missing access token.
        '404':
          description: Flag or project not found.
      security:
      - bearerAuth: []
      x-operation-id-source: normalized
      x-operation-id-original: getFeatureFlag
    patch:
      operationId: patchFlagsByProjectKeyByFlagKey
      summary: Update a feature flag
      description: Updates a feature flag using a JSON Patch or semantic patch representation. Supports modifying targeting rules, variations, prerequisites, and other flag settings.
      tags:
      - Feature Flags
      parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/FlagKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchOperation_2'
      responses:
        '200':
          description: Feature flag updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag_2'
        '400':
          description: Invalid patch request.
        '401':
          description: Unauthorized. Invalid or missing access token.
        '404':
          description: Flag or project not found.
        '409':
          description: Conflict due to concurrent modification.
      security:
      - bearerAuth: []
      x-operation-id-source: normalized
      x-operation-id-original: patchFeatureFlag
    delete:
      operationId: deleteFlagsByProjectKeyByFlagKey
      summary: Delete a feature flag
      description: Permanently deletes a feature flag and all of its associated targeting rules and environment configurations.
      tags:
      - Feature Flags
      parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/FlagKey'
      responses:
        '204':
          description: Feature flag deleted successfully.
        '401':
          description: Unauthorized. Invalid or missing access token.
        '404':
          description: Flag or project not found.
      security:
      - bearerAuth: []
      x-operation-id-source: normalized
      x-operation-id-original: deleteFeatureFlag
    servers:
    - url: https://app.launchdarkly.com/api/v2
      description: LaunchDarkly Production API
components:
  schemas:
    FeatureFlag:
      type: object
      required:
      - name
      - kind
      - key
      - _version
      - creationDate
      - variations
      - temporary
      - tags
      - _links
      - experiments
      - customProperties
      - archived
      properties:
        name:
          type: string
          description: A human-friendly name for the feature flag
          example: My Flag
        kind:
          type: string
          description: Kind of feature flag
          example: boolean
          enum:
          - boolean
          - multivariate
        description:
          type: string
          description: Description of the feature flag
          example: This flag controls the example widgets
        key:
          type: string
          description: A unique key used to reference the flag in your code
          example: flag-key-123abc
        _version:
          type: integer
          description: Version of the feature flag
          example: 1
        creationDate:
          description: Timestamp of flag creation date
          example: '1494437420312'
          $ref: '#/components/schemas/UnixMillis'
        includeInSnippet:
          type: boolean
          description: Deprecated, use <code>clientSideAvailability</code>. Whether this flag should be made available to the client-side JavaScript SDK
          example: true
          deprecated: true
        clientSideAvailability:
          description: Which type of client-side SDKs the feature flag is available to
          example: '{"usingMobileKey":true,"usingEnvironmentId":false}'
          $ref: '#/components/schemas/ClientSideAvailability'
        variations:
          type: array
          description: An array of possible variations for the flag
          items:
            $ref: '#/components/schemas/Variation'
          example:
          - _id: e432f62b-55f6-49dd-a02f-eb24acf39d05
            value: true
          - _id: a00bf58d-d252-476c-b915-15a74becacb4
            value: false
        temporary:
          type: boolean
          description: Whether the flag is a temporary flag
          example: true
        tags:
          type: array
          description: Tags for the feature flag
          items:
            type: string
          example:
          - example-tag
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
          example:
            parent:
              href: /api/v2/flags/my-project
              type: application/json
            self:
              href: /api/v2/flags/my-project/my-flag
              type: application/json
        maintainerId:
          type: string
          description: Associated maintainerId for the feature flag
          example: 569f183514f4432160000007
        _maintainer:
          description: Associated maintainer member info for the feature flag
          $ref: '#/components/schemas/MemberSummary'
        maintainerTeamKey:
          type: string
          description: The key of the associated team that maintains this feature flag
          example: team-1
        _maintainerTeam:
          description: Associated maintainer team info for the feature flag
          $ref: '#/components/schemas/MaintainerTeam'
        goalIds:
          type: array
          description: Deprecated, use <code>experiments</code> instead
          items:
            type: string
          example: []
          deprecated: true
        experiments:
          description: Experimentation data for the feature flag
          example: '{"baselineIdx": 0,"items": []}'
          $ref: '#/components/schemas/ExperimentInfoRep'
        customProperties:
          description: Metadata attached to the feature flag, in the form of the property key associated with a name and array of values for the metadata to associate with this flag. Typically used to store data related to an integration.
          example: '{"jira.issues":{"name":"Jira issues","value":["is-123","is-456"]}}'
          $ref: '#/components/schemas/CustomProperties'
        archived:
          type: boolean
          description: Boolean indicating if the feature flag is archived
          example: false
        archivedDate:
          description: If archived is true, date of archive
          example: '1494437420312'
          $ref: '#/components/schemas/UnixMillis'
        deprecated:
          type: boolean
          description: Boolean indicating if the feature flag is deprecated
          example: false
        deprecatedDate:
          description: If deprecated is true, date of deprecation
          example: '1494437420312'
          $ref: '#/components/schemas/UnixMillis'
        defaults:
          description: The indices, from the array of variations, for the variations to serve by default when targeting is on and when targeting is off. These variations will be used for this flag in new environments. If omitted, the first and last variation will be used.
          example: '{"onVariation":0,"offVariation":1}'
          $ref: '#/components/schemas/Defaults'
        _purpose:
          type: string
        migrationSettings:
          description: Migration-related settings for the flag
          $ref: '#/components/schemas/FlagMigrationSettingsRep'
        stale:
          description: Information about a flag's stale states
          $ref: '#/components/schemas/StaleFlagData'
        environments:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FeatureFlagConfig'
          description: Details on the environments for this flag. Only returned if the request is filtered by environment, using the <code>filterEnv</code> query parameter.
          example:
            my-environment:
              _environmentName: My Environment
              _site:
                href: /default/my-environment/features/client-side-flag
                type: text/html
              _summary:
                prerequisites: 0
                variations:
                  '0':
                    contextTargets: 1
                    isFallthrough: true
                    nullRules: 0
                    rules: 0
                    targets: 1
                  '1':
                    isOff: true
                    nullRules: 0
                    rules: 0
                    targets: 0
              archived: false
              contextTargets:
              - contextKind: device
                values:
                - device-key-123abc
                variation: 0
              fallthrough:
                variation: 0
              lastModified: 1627071171347
              offVariation: 1
              'on': false
              prerequisites: []
              rules: []
              salt: 61eddeadbeef4da1facecafe3a60a397
              sel: 810edeadbeef4844facecafe438f2999492
              targets:
              - contextKind: user
                values:
                - user-key-123abc
                variation: 0
              trackEvents: false
              trackEventsFallthrough: false
              version: 1
    Variation:
      type: object
      required:
      - value
      properties:
        _id:
          type: string
          description: The ID of the variation. Leave empty when you are creating a flag.
        value:
          description: The value of the variation. For boolean flags, this must be <code>true</code> or <code>false</code>. For multivariate flags, this may be a string, number, or JSON object.
        valueHash:
          type: string
          description: A deterministic hash of the canonicalized variation <code>value</code>. Computed server-side; ignored if supplied in request bodies.
        description:
          type: string
          description: Description of the variation. Defaults to an empty string, but is omitted from the response if not set.
        name:
          type: string
          description: A human-friendly name for the variation. Defaults to an empty string, but is omitted from the response if not set.
    MemberSummary:
      type: object
      required:
      - _links
      - _id
      - role
      - email
      properties:
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
          example:
            self:
              href: /api/v2/members/569f183514f4432160000007
              type: application/json
        _id:
          type: string
          description: The member's ID
          example: 569f183514f4432160000007
        firstName:
          type: string
          description: The member's first name
          example: Ariel
        lastName:
          type: string
          description: The member's last name
          example: Flores
        role:
          type: string
          description: The member's base role. If the member has no additional roles, this role will be in effect.
          example: admin
        email:
          type: string
          description: The member's email address
          example: ariel@acme.com
    Operator:
      type: string
    ForbiddenErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: forbidden
        message:
          type: string
          description: Description of the error
          example: Forbidden. Access to the requested resource was denied.
    Clause:
      type: object
      required:
      - attribute
      - op
      - values
      - negate
      properties:
        _id:
          type: string
        attribute:
          type: string
        op:
          $ref: '#/components/schemas/Operator'
        values:
          type: array
          items: {}
        contextKind:
          type: string
        negate:
          type: boolean
    LegacyExperimentRep:
      type: object
      properties:
        metricKey:
          type: string
          example: my-metric
        _metric:
          $ref: '#/components/schemas/MetricListingRep'
        environments:
          type: array
          items:
            type: string
          example:
          - production
          - test
          - my-environment
        _environmentSettings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExperimentEnvironmentSettingRep'
    ResourceKind:
      type: string
    ActionIdentifier:
      type: string
    FeatureFlagStatusAcrossEnvironments:
      type: object
      required:
      - environments
      - key
      - _links
      properties:
        environments:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FeatureFlagStatus'
          description: Flag status for environment.
          example:
            production:
              lastRequested: '2020-02-05T18:17:01.514Z'
              name: inactive
        key:
          type: string
          description: feature flag key
          example: flag-key-123abc
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          example:
            parent:
              href: /api/v2/flag-status
              type: application/json
            self:
              href: /api/v2/flag-status/my-project/my-flag
              type: application/json
    WeightedVariation:
      type: object
      required:
      - variation
      - weight
      properties:
        variation:
          type: integer
        weight:
          type: integer
        _untracked:
          type: boolean
    FlagCopyConfigEnvironment:
      type: object
      required:
      - key
      properties:
        key:
          type: string
          description: The environment key
        currentVersion:
          type: integer
          description: Optional flag version. If you include this, the operation only succeeds if the current flag version in the environment matches this version.
    ClientSideAvailabilityPost:
      type: object
      required:
      - usingEnvironmentId
      - usingMobileKey
      properties:
        usingEnvironmentId:
          type: boolean
          description: Whether to enable availability for client-side SDKs. Defaults to <code>false</code>.
          example: true
        usingMobileKey:
          type: boolean
          description: Whether to enable availability for mobile SDKs. Defaults to <code>true</code>.
          example: true
    FeatureFlagBody:
      type: object
      required:
      - name
      - key
      properties:
        name:
          type: string
          description: A human-friendly name for the feature flag
          example: My flag
        key:
          type: string
          description: A unique key used to reference the flag in your code
          example: flag-key-123abc
        description:
          type: string
          description: Description of the feature flag. Defaults to an empty string.
          example: This flag controls the example widgets
        includeInSnippet:
          type: boolean
          description: Deprecated, use <code>clientSideAvailability</code>. Whether this flag should be made available to the client-side JavaScript SDK. Defaults to <code>false</code>.
          deprecated: true
        clientSideAvailability:
          description: Which type of client-side SDKs the feature flag is available to
          example: '{"usingMobileKey":true,"usingEnvironmentId":false}'
          $ref: '#/components/schemas/ClientSideAvailabilityPost'
        variations:
          type: array
          description: An array of possible variations for the flag. The variation values must be unique. If omitted, two boolean variations of <code>true</code> and <code>false</code> will be used.
          items:
            $ref: '#/components/schemas/Variation'
          example:
          - value: true
          - value: false
        temporary:
          type: boolean
          description: Whether the flag is a temporary flag. Defaults to <code>true</code>.
          example: false
        tags:
          type: array
          description: Tags for the feature flag. Defaults to an empty array.
          items:
            type: string
          example:
          - example-tag
        customProperties:
          description: Metadata attached to the feature flag, in the form of the property key associated with a name and array of values for the metadata to associate with this flag. Typically used to store data related to an integration.
          example: '{ "jira.issues": {"name": "Jira issues", "value": ["is-123", "is-456"]} }'
          $ref: '#/components/schemas/CustomProperties'
        defaults:
          description: The indices, from the array of variations, for the variations to serve by default when targeting is on and when targeting is off. These variations will be used for this flag in new environments. If omitted, the first and last variation will be used.
          example: '{"onVariation":0, "offVariation":1}'
          $ref: '#/components/schemas/Defaults'
        purpose:
          type: string
          description: Purpose of the flag
          example: migration
          enum:

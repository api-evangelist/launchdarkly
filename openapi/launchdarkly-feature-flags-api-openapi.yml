      - key
      - name
      - kind
      - _links
      - tags
      - _creationDate
      - dataSource
      properties:
        experimentCount:
          type: integer
          description: The number of experiments using this metric
          example: 0
        metricGroupCount:
          type: integer
          description: The number of metric groups using this metric
          example: 0
        activeExperimentCount:
          type: integer
          description: The number of active experiments using this metric
          example: 2
        activeGuardedRolloutCount:
          type: integer
          description: The number of active guarded rollouts using this metric
          example: 1
        _id:
          type: string
          description: The ID of this metric
          example: 5902deadbeef667524a01290
        _versionId:
          type: string
          description: The version ID of the metric
          example: version-id-123abc
        _version:
          type: integer
          description: Version of the metric
          example: 1
        key:
          type: string
          description: A unique key to reference the metric
          example: metric-key-123abc
        name:
          type: string
          description: A human-friendly name for the metric
          example: My metric
        kind:
          type: string
          description: The kind of event the metric tracks
          example: custom
          enum:
          - pageview
          - click
          - custom
          - trace
        _attachedFlagCount:
          type: integer
          description: The number of feature flags currently attached to this metric
          example: 0
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
          example:
            parent:
              href: /api/v2/metrics/my-project
              type: application/json
            self:
              href: /api/v2/metrics/my-project/my-metric
              type: application/json
        _site:
          description: Details on how to access the metric in the LaunchDarkly UI
          example: '{"href":"/my-project/metrics/my-metric/details","type":"text/html"}'
          $ref: '#/components/schemas/Link'
        _access:
          description: Details on the allowed and denied actions for this metric
          $ref: '#/components/schemas/Access'
        tags:
          type: array
          description: Tags for the metric
          items:
            type: string
          example: []
        _creationDate:
          description: Timestamp of when the metric was created
          example: '1628192791148'
          $ref: '#/components/schemas/UnixMillis'
        lastModified:
          $ref: '#/components/schemas/Modification'
        maintainerId:
          type: string
          description: The ID of the member who maintains this metric
          example: 569fdeadbeef1644facecafe
        _maintainer:
          description: Details on the member who maintains this metric
          example: '{"_links":{"self":{"href":"/api/v2/members/569fdeadbeef1644facecafe","type":"application/json"}},"_id":"569fdeadbeef1644facecafe","firstName":"Ariel","lastName":"Flores","role":"owner","email":"ariel@acme.com"}'
          $ref: '#/components/schemas/MemberSummary'
        description:
          type: string
          description: Description of the metric
        category:
          type: string
          description: The category of the metric
          example: Error monitoring
        isNumeric:
          type: boolean
          description: For custom and trace metrics, whether to track numeric changes in value against a baseline (<code>true</code>) or to track a conversion when an end user takes an action (<code>false</code>).
          example: true
        successCriteria:
          type: string
          description: For custom and trace metrics, the success criteria
          enum:
          - HigherThanBaseline
          - LowerThanBaseline
        unit:
          type: string
          description: For numeric custom and trace metrics, the unit of measure
        eventKey:
          type: string
          description: For custom metrics, the event key to use in your code
          example: Order placed
        randomizationUnits:
          type: array
          description: Deprecated, use <code>analysisUnits</code> instead.
          items:
            type: string
          example:
          - user
          deprecated: true
        analysisUnits:
          type: array
          description: An array of analysis units allowed for this metric.
          items:
            type: string
          example:
          - user
        filters:
          description: The filters narrowing down the audience based on context attributes or event properties.
          example: '{"type":"group","op":"and","values":[{"type":"contextAttribute","op":"in","contextKind":"user","attribute":"country","values":["JP"],"negate":false},{"type":"eventProperty","op":"in","attribute":"category","values":["magic-wands"],"negate":false}]}'
          $ref: '#/components/schemas/Filter'
        unitAggregationType:
          type: string
          description: The method by which multiple unit event values are aggregated
          example: average
          enum:
          - average
          - sum
          - count_distinct
        analysisType:
          type: string
          description: The method for analyzing metric events
          example: mean
          enum:
          - mean
          - percentile
        percentileValue:
          type: integer
          description: The percentile for the analysis method. An integer denoting the target percentile between 0 and 100. Required when <code>analysisType</code> is <code>percentile</code>.
          example: 95
        eventDefault:
          $ref: '#/components/schemas/MetricEventDefaultRep'
        dataSource:
          $ref: '#/components/schemas/MetricDataSourceRefRep'
        lastSeen:
          description: Timestamp of most recent data for this metric, at one-hour fidelity
          $ref: '#/components/schemas/UnixMillis'
        archived:
          type: boolean
          description: Whether the metric version is archived
        archivedAt:
          description: Timestamp when the metric version was archived
          example: '1609459200000'
          $ref: '#/components/schemas/UnixMillis'
        selector:
          type: string
          description: For click metrics, the CSS selectors
        urls:
          description: For click and pageview metrics, the target URLs
          example: '[{"kind":"exact","url":"https://www.example.com/page1"}]'
          $ref: '#/components/schemas/UrlMatchers'
        windowStartOffset:
          type: integer
          format: int64
          description: Not yet implemented - The start of the measurement window, in milliseconds relative to the unit's first exposure to a flag variation
        windowEndOffset:
          type: integer
          format: int64
          description: Not yet implemented - The end of the measurement window, in milliseconds relative to the unit's first exposure to a flag variation
        winsorLowerPercentile:
          type: number
          description: Lower winsorization percentile, expressed as a percent in the open interval (0, 100). When both bounds are set, defines a two-sided clamp range. Otherwise lower-only winsorization.
          example: 1
        winsorUpperPercentile:
          type: number
          description: Upper winsorization percentile, expressed as a percent in the open interval (0, 100). When both bounds are set, must be greater than winsorLowerPercentile.
          example: 99.5
        winsorIncludeImputed:
          type: boolean
          description: When true, the percentile bound calculation includes imputed zeros. Only meaningful when at least one bound is set and the metric includes units that didn't send events.
          example: false
        traceQuery:
          type: string
          description: For trace metrics, the trace query to use for the metric.
          example: service.name = "checkout"
        traceValueLocation:
          type: string
          description: For trace metrics, the location in the trace to use for numeric values.
          example: duration
        unitAggregationField:
          type: string
          description: For count_distinct metrics, the column to count distinct values of
        denominator:
          description: For ratio metrics, the denominator event configuration
          $ref: '#/components/schemas/MetricDenominatorRep'

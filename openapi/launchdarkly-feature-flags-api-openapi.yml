        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '405':
          description: Approval is required to make this request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowedErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Feature Flags
      summary: Update feature flag
      description: 'Perform a partial update to a feature flag. The request body must be a valid semantic patch, JSON patch, or JSON merge patch. To learn more the different formats, read Updates. ### Using semantic patches on a feature flag


        To make a semantic patch request, you must append `domain-model=launchdarkly.semanticpatch` to your `Content-Type` header. To learn more, read Updates using semantic patch. The body of a semantic patch request for updating feature flags takes the following properties:


        * `comment` (string): (Optional) A description of the update. * `environmentKey` (string): (Required for some instructions only) The key of the LaunchDarkly environment. * `instructions` (array): (Required) A list of actions the update should perform. Each action in the list must be an object with a `kind` property that indicates the instruction. If the action requires parameters, you must include those parameters as additional fields in the object. The body of a single semantic patch can contain many different instructions. ### Instructions


        Semantic patch requests support the following `kind` instructions for updating feature flags. Click to expand instructions for turning flags on and off


        These instructions require the `environmentKey` parameter. #### turnFlagOff


        Sets the flag''s targeting state to **Off**. Here''s an example:


        ```json

        {

        "environmentKey": "environment-key-123abc",

        "instructions": [ { "kind": "turnFlagOff" } ]

        }

        ```


        #### turnFlagOn


        Sets the flag''s targeting state to **On**. Here''s an example:


        ```json

        {

        "environmentKey": "environment-key-123abc",

        "instructions": [ { "kind": "turnFlagOn" } ]

        }

        ```


        Click to expand instructions for working with targeting and variations


        These instructions require the `environmentKey` parameter. Several of the instructions for working with targeting and variations require flag rule IDs, variation IDs, or clause IDs as parameters. Each of these are returned as part of the Get feature flag response. The flag rule ID is the `_id` field of each element in the `rules` array within each environment listed in the `environments` object. The variation ID is the `_id` field in each element of the `variations` array. The clause ID is the `_id` field of each element of the `clauses` array within the `rules` array within each environment listed in the `environments` object. #### addClauses


        Adds the given clauses to the rule indicated by `ruleId`. ##### Parameters


        - `ruleId`: ID of a rule in the flag. - `clauses`: Array of clause objects, with `contextKind` (string), `attribute` (string), `op` (string), `negate` (boolean), and `values` (array of strings, numbers, or dates) properties. The `contextKind`, `attribute`, and `values` are case sensitive. The `op` must be lower-case. Here''s an example:


        ```json

        {

        "environmentKey": "environment-key-123abc",

        "instructions": [{

        "kind": "addClauses",

        "ruleId": "a902ef4a-2faf-4eaf-88e1-ecc356708a29",

        "clauses": [{

        "contextKind": "user",

        "attribute": "country",

        "op": "in",

        "negate": false,

        "values": ["USA", "Canada"]

        }]

        }]

        }

        ```


        #### addPrerequisite


        Adds the flag indicated by `key` with variation `variationId` as a prerequisite to the flag in the path parameter. ##### Parameters


        - `key`: Flag key of the prerequisite flag. - `variationId`: ID of a variation of the prerequisite flag. Here''s an example:


        ```json

        {

        "environmentKey": "environment-key-123abc",

        "instructions": [{

        "kind": "addPrerequisite",

        "key": "example-prereq-flag-key",

        "variationId": "2f43f67c-3e4e-4945-a18a-26559378ca00"

        }]

        }

        ```


        #### addRule


        Adds a new targeting rule to the flag. The rule may contain `clauses` and serve the variation that `variationId` indicates, or serve a percentage rollout that `rolloutWeights`, `rolloutBucketBy`, and `rolloutContextKind` indicate. If you set `beforeRuleId`, this adds the new rule before the indicated rule. Otherwise, adds the new rule to the end of the list.'
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: featureFlagKey
        in: path
        description: The feature flag key. The key identifies the flag in your code.
        required: true
        schema:
          type: string
          format: string
          description: The feature flag key. The key identifies the flag in your code.
      - name: ignoreConflicts
        in: query
        description: If true, the patch will be applied even if it causes a pending scheduled change or approval request to fail.
        schema:
          type: boolean
          description: If true, the patch will be applied even if it causes a pending scheduled change or approval request to fail.
      - name: dryRun
        in: query
        description: If true, the patch will be validated but not persisted. Returns a preview of the flag after the patch is applied.
        schema:
          type: boolean
          description: If true, the patch will be validated but not persisted. Returns a preview of the flag after the patch is applied.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWithComment'
            example:
              patch:
              - op: replace
                path: /description
                value: New description for this flag
        required: true
      operationId: patchFeatureFlag
      security:
      - ApiKey:
        - read
        - write

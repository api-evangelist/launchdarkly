tags:
- name: Feature Flags
  description: 'The feature flags API allows you to list, create, and modify feature flags and their targeting. For example, you can control percentage rollouts, target specific contexts, or even toggle off a feature flag programmatically. ## Sample feature flag representation


    Every feature flag has a set of top-level attributes, as well as an `environments` map containing the flag rollout and targeting rules specific to each environment. To learn more, read Using feature flags. Click to expand an example of a complete feature flag representation


    ```json

    {

    "name": "Alternate product page",

    "kind": "boolean",

    "description": "This is a description",

    "key": "alternate.page",

    "_version": 2,

    "creationDate": 1418684722483,

    "includeInSnippet": true,

    "clientSideAvailability" {

    "usingMobileKey": false,

    "usingEnvironmentId": true,

    },

    "variations": [

    {

    "value": true,

    "name": "true",

    "_id": "86208e6e-468f-4425-b334-7f318397f95c"

    },

    {

    "value": false,

    "name": "false",

    "_id": "7b32de80-f346-4276-bb77-28dfa7ddc2d8"

    }

    ],

    "variationJsonSchema": null,

    "defaults": {

    "onVariation": 0,

    "offVariation": 1

    },

    "temporary": false,

    "tags": ["ops", "experiments"],

    "_links": {

    "parent": {

    "href": "/api/v2/flags/default",

    "type": "application/json"

    },

    "self": {

    "href": "/api/v2/flags/default/alternate.page",

    "type": "application/json"

    }

    },

    "maintainerId": "548f6741c1efad40031b18ae",

    "_maintainer": {

    "_links": {

    "self": {

    "href": "/api/v2/members/548f6741c1efad40031b18ae",

    "type": "application/json"

    }

    },

    "_id": "548f6741c1efad40031b18ae",

    "firstName": "Ariel",

    "lastName": "Flores",

    "role": "reader",

    "email": "ariel@acme.com"

    },

    "goalIds": [],

    "experiments": {

    "baselineIdx": 0,

    "items": []

    },

    "environments": {

    "production": {

    "on": true,

    "archived": false,

    "salt": "YWx0ZXJuYXRlLnBhZ2U=",

    "sel": "45501b9314dc4641841af774cb038b96",

    "lastModified": 1469326565348,

    "version": 61,

    "targets": [{

    "values": ["user-key-123abc"],

    "variation": 0,

    "contextKind": "user"

    }],

    "contextTargets": [{

    "values": [],

    "variation": 0,

    "contextKind": "user"

    }, {

    "values": ["org-key-123abc"],

    "variation": 0,

    "contextKind": "organization"

    }],

    "rules": [

    {

    "_id": "f3ea72d0-e473-4e8b-b942-565b790ffe18",

    "variation": 0,

    "clauses": [

    {

    "_id": "6b81968e-3744-4416-9d64-74547eb0a7d1",

    "attribute": "groups",

    "op": "in",

    "values": ["Top Customers"],

    "contextKind": "user",

    "negate": false

    },

    {

    "_id": "9d60165d-82b8-4b9a-9136-f23407ba1718",

    "attribute": "email",

    "op": "endsWith",

    "values": ["gmail.com"],

    "contextKind": "user",

    "negate": false

    }

    ],

    "trackEvents": false,

    "ref": "73257308-472b-4d9c-a556-10aa7adbf857"

    }

    ],

    "fallthrough": {

    "rollout": {

    "variations": [

    {

    "variation": 0,

    "weight": 60000

    },

    {

    "variation": 1,

    "weight": 40000

    }

    ],

    "contextKind": "user"

    }

    },

    "offVariation": 1,

    "prerequisites": [],

    "_site": {

    "href": "/default/production/features/alternate.page",

    "type": "text/html"

    },

    "_environmentName": "Production",

    "trackEvents": false,

    "trackEventsFallthrough": false,

    "_summary": {

    "variations": {

    "0": {

    "rules": 1,

    "nullRules": 0,

    "targets": 2,

    "rollout": 60000

    },

    "1": {

    "rules": 0,

    "nullRules": 0,

    "targets": 0,

    "isOff": true,

    "rollout": 40000

    }

    },

    "prerequisites": 0

    }

    }

    }

    ```


    ## Anatomy of a feature flag


    This section describes the sample feature flag representation in more detail. ### Top-level attributes


    Most of the top-level attributes have a straightforward interpretation, for example `name` and `description`. The `variations` array represents the different variation values that a feature flag has. For a boolean flag, there are two variations: `true` and `false`. Multivariate flags have more variation values, and those values could be any JSON type: numbers, strings, objects, or arrays. In targeting rules, the variations are referred to by their index into this array. To update these attributes, read Update feature flag, especially the instructions for **updating flag settings**.'

              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Feature Flags
      summary: Create a feature flag
      description: 'Create a feature flag with the given name, key, and variations.


        Click to expand instructions for creating a migration flag


        ### Creating a migration flag


        When you create a migration flag, the variations are pre-determined based on the number of stages in the migration.


        To create a migration flag, omit the `variations` and `defaults` information. Instead, provide a `purpose` of `migration`, and `migrationSettings`. If you create a migration flag with six stages, `contextKind` is required. Otherwise, it should be omitted.


        Here''s an example:


        ```json

        {

        "key": "flag-key-123",

        "purpose": "migration",

        "migrationSettings": {

        "stageCount": 6,

        "contextKind": "account"

        }

        }

        ```


        To learn more, read Migration Flags.'
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: clone
        in: query
        description: The key of the feature flag to be cloned. The key identifies the flag in your code. For example, setting `clone=flagKey` copies the full targeting configuration for all environments, including `on/off` state, from the original flag to the new flag.
        schema:
          type: string
          format: string
          description: The key of the feature flag to be cloned. The key identifies the flag in your code. For example, setting `clone=flagKey` copies the full targeting configuration for all environments, including `on/off` state, from the original flag to the new flag.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagBody'
            example:
              clientSideAvailability:
                usingEnvironmentId: true
                usingMobileKey: true
              key: flag-key-123abc
              name: My Flag
        required: true
      operationId: postFeatureFlag
      security:
      - ApiKey:
        - read
        - write
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'

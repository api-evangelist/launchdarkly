  /api/v2/flags/{projectKey}:
    get:
      responses:
        '200':
          description: Global flags collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlags'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Feature Flags
      summary: List feature flags
      description: 'Get a list of all feature flags in the given project. You can include information specific to different environments by adding `env` query parameter. For example, setting `env=production` adds configuration details about your production environment to the response. You can also filter feature flags by tag with the `tag` query parameter. > #### Recommended use

        >

        > This endpoint can return a large amount of information. We recommend using some or all of these query parameters to decrease response time and overall payload size: `limit`, `env`, `query`, and `filter=creationDate`. ### Filtering flags


        You can filter on certain fields using the `filter` query parameter. For example, setting `filter=query:dark-mode,tags:beta+test` matches flags with the string `dark-mode` in their key or name, ignoring case, which also have the tags `beta` and `test`. The `filter` query parameter supports the following arguments:


        | Filter argument | Description | Example |

        |-----------------------|-------------|----------------------|

        | `applicationEvaluated` | A string. It filters the list to flags that are evaluated in the application with the given key. | `filter=applicationEvaluated:com.launchdarkly.cafe` |

        | `archived` | (deprecated) A boolean value. It filters the list to archived flags. | Use `filter=state:archived` instead |

        | `contextKindsEvaluated` | A `+`-separated list of context kind keys. It filters the list to flags which have been evaluated in the past 30 days for all of the context kinds in the list. | `filter=contextKindsEvaluated:user+application` |

        | `codeReferences.max` | An integer value. Use `0` to return flags that do not have code references. | `filter=codeReferences.max:0` |

        | `codeReferences.min` | An integer value. Use `1` to return flags that do have code references. | `filter=codeReferences.min:1` |

        | `creationDate` | An object with an optional `before` field whose value is Unix time in milliseconds. It filters the list to flags created before the date. | `filter=creationDate:{"before":1690527600000}` |

        | `evaluated` | An object that contains a key of `after` and a value in Unix time in milliseconds. It filters the list to all flags that have been evaluated since the time you specify, in the environment provided. This filter requires the `filterEnv` filter. | `filter=evaluated:{"after":1690527600000},filterEnv:production` |

        | `filterEnv` | A valid environment key. You must use this field for filters that are environment-specific. If there are multiple environment-specific filters, you only need to include this field once. | `filter=evaluated:{"after": 1590768455282},filterEnv:production` |

        | `guardedRollout` | A string, one of `any`, `monitoring`, `regressed`, `rolledBack`, `completed`, `archived`. It filters the list to flags that are part of guarded rollouts. | `filter=guardedRollout:monitoring` |

        | `hasExperiment` | A boolean value. It filters the list to flags that are used in an experiment. | `filter=hasExperiment:true` |

        | `maintainerId` | A valid member ID. It filters the list to flags that are maintained by this member. | `filter=maintainerId:12ab3c45de678910abc12345` |

        | `maintainerTeamKey` | A string. It filters the list to flags that are maintained by the team with this key. | `filter=maintainerTeamKey:example-team-key` |

        | `query` | A string. It filters the list to flags that include the specified string in their key or name. It is not case sensitive. | `filter=query:example` |

        | `releasePipeline` | A release pipeline key. It filters the list to flags that are either currently active in the release pipeline or have completed the release pipeline. | `filter=releasePipeline:default-release-pipeline` |

        | `state` | A string, either `live`, `deprecated`, or `archived`. It filters the list to flags in this state. | `filter=state:archived` |

        | `sdkAvailability` | A string, one of `client`, `mobile`, `anyClient`, `server`.'
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: env
        in: query
        description: Filter configurations by environment
        schema:
          type: string
          format: string
          description: Filter configurations by environment
      - name: tag
        in: query
        description: Filter feature flags by tag
        schema:
          type: string
          format: string
          description: Filter feature flags by tag
      - name: limit
        in: query
        description: The number of feature flags to return. Defaults to 20.
        schema:
          type: integer
          format: int64
          description: The number of feature flags to return. Defaults to 20.
      - name: offset
        in: query
        description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
        schema:
          type: integer
          format: int64
          description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
      - name: archived
        in: query
        description: Deprecated, use `filter=archived:true` instead. A boolean to filter the list to archived flags. When this is absent, only unarchived flags will be returned
        deprecated: true
        schema:
          type: boolean
          description: Deprecated, use `filter=archived:true` instead. A boolean to filter the list to archived flags. When this is absent, only unarchived flags will be returned
      - name: summary
        in: query
        description: By default, flags do _not_ include their lists of prerequisites, targets, or rules for each environment. Set `summary=0` and include the `env` query parameter to include these fields for each flag returned.
        schema:
          type: boolean
          description: By default, flags do _not_ include their lists of prerequisites, targets, or rules for each environment. Set `summary=0` and include the `env` query parameter to include these fields for each flag returned.
      - name: filter
        in: query
        description: A comma-separated list of filters. Each filter is of the form field:value. Read the endpoint description for a full list of available filter fields.
        schema:
          type: string
          format: string
          description: A comma-separated list of filters. Each filter is of the form field:value. Read the endpoint description for a full list of available filter fields.
      - name: sort
        in: query
        description: A comma-separated list of fields to sort by. Fields prefixed by a dash ( - ) sort in descending order. Read the endpoint description for a full list of available sort fields.
        schema:
          type: string
          format: string
          description: A comma-separated list of fields to sort by. Fields prefixed by a dash ( - ) sort in descending order. Read the endpoint description for a full list of available sort fields.
      - name: compare
        in: query
        description: Deprecated, unavailable in API version `20240415`. A boolean to filter results by only flags that have differences between environments.
        deprecated: true
        schema:
          type: boolean
          description: Deprecated, unavailable in API version `20240415`. A boolean to filter results by only flags that have differences between environments.
      - name: expand
        in: query
        description: A comma-separated list of fields to expand in the response. Supported fields are explained above.
        schema:
          type: string
          format: string
          description: A comma-separated list of fields to expand in the response. Supported fields are explained above.
      operationId: getFeatureFlags
      security:
      - ApiKey:
        - read
        - write
    post:
      responses:
        '201':
          description: Global flag response
          content:

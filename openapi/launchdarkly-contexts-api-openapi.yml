      tags:
      - Contexts
      summary: Search for contexts
      description: 'Search for contexts.


        You can use either the query parameters or the request body parameters. If both are provided, there is an error.


        Results are sorted by context kind and key. Each context appears once, with its most recently reported attributes. Results include contexts that LaunchDarkly has received within the last 30 days.


        To learn more about the filter syntax, read Filtering contexts. To learn more about contexts, read Contexts.'
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      - name: limit
        in: query
        description: 'Specifies the maximum number of items in the collection to return (max: 50, default: 20)'
        schema:
          type: integer
          format: int64
          description: 'Specifies the maximum number of items in the collection to return (max: 50, default: 20)'
      - name: continuationToken
        in: query
        description: An opaque cursor that identifies the next page of results. You can use this for pagination, however, we recommend using the `next` link we provide instead.
        schema:
          type: string
          format: string
          description: An opaque cursor that identifies the next page of results. You can use this for pagination, however, we recommend using the `next` link we provide instead.
      - name: sort
        in: query
        description: Deprecated. This endpoint does not support sorting. Requests that include this parameter are rejected with a `400` response, so omit it. Results are always sorted by context kind and key.
        deprecated: true
        schema:
          type: string
          format: string
          description: Deprecated. This endpoint does not support sorting. Requests that include this parameter are rejected with a `400` response, so omit it. Results are always sorted by context kind and key.
      - name: filter
        in: query
        description: A comma-separated list of context filters. To learn more about the filter syntax, read [Filtering contexts](https://launchdarkly.com/docs/ld-docs/api/contexts#filtering-contexts).
        schema:
          type: string
          format: string
          description: A comma-separated list of context filters. To learn more about the filter syntax, read [Filtering contexts](https://launchdarkly.com/docs/ld-docs/api/contexts#filtering-contexts).
      - name: includeTotalCount
        in: query
        description: Specifies whether to include or omit the total count of matching contexts. Defaults to true. The total count is approximate and may be omitted if it is unavailable.
        schema:
          type: boolean
          description: Specifies whether to include or omit the total count of matching contexts. Defaults to true. The total count is approximate and may be omitted if it is unavailable.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextSearch'
        required: true
      operationId: searchContexts

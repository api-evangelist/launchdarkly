        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Contexts
      summary: Evaluate flags for context instance
      description: 'Evaluate flags for a context instance, for example, to determine the expected flag variation. **Do not use this API instead of an SDK.** The LaunchDarkly SDKs are specialized for the tasks of evaluating feature flags in your application at scale and generating analytics events based on those evaluations. This API is not designed for that use case. Any evaluations you perform with this API will not be reflected in features such as flag statuses and flag insights. Context instances evaluated by this API will not appear in the Contexts list. To learn more, read Comparing LaunchDarkly''s SDKs and REST API.


        ### Filtering


        LaunchDarkly supports the `filter` query param for filtering, with the following fields:


        - `query` filters for a string that matches against the flags'' keys and names. It is not case sensitive. For example: `filter=query equals dark-mode`.

        - `tags` filters the list to flags that have all of the tags in the list. For example: `filter=tags contains ["beta","q1"]`.


        You can also apply multiple filters at once. For example, setting `filter=query equals dark-mode, tags contains ["beta","q1"]` matches flags which match the key or name `dark-mode` and are tagged `beta` and `q1`.'
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      - name: environmentKey
        in: path
        description: The environment key
        required: true
        schema:
          type: string
          format: string
          description: The environment key
      - name: limit
        in: query
        description: The number of feature flags to return. Defaults to -1, which returns all flags
        schema:
          type: integer
          format: int64
          description: The number of feature flags to return. Defaults to -1, which returns all flags
      - name: offset
        in: query
        description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
        schema:
          type: integer
          format: int64
          description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and then returns the next items in the list, up to the query `limit`.
      - name: sort
        in: query
        description: A comma-separated list of fields to sort by. Fields prefixed by a dash ( - ) sort in descending order
        schema:
          type: string
          format: string
          description: A comma-separated list of fields to sort by. Fields prefixed by a dash ( - ) sort in descending order
      - name: filter
        in: query
        description: A comma-separated list of filters. Each filter is of the form `field operator value`. Supported fields are explained above.
        schema:
          type: string
          format: string
          description: A comma-separated list of filters. Each filter is of the form `field operator value`. Supported fields are explained above.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextInstance'
            example:
              key: user-key-123abc
              kind: user
              otherAttribute: other attribute value
        required: true
      operationId: evaluateContextInstance
components:
  schemas:
    ContextKindsCollectionRep:
      type: object
      required:
      - items
      - _links
      properties:
        items:
          type: array
          description: An array of context kinds
          items:
            $ref: '#/components/schemas/ContextKindRep'
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: The location and content type of related resources
    AccessDenied:
      type: object
      required:
      - action
      - reason
      properties:
        action:
          $ref: '#/components/schemas/ActionIdentifier'
        reason:
          $ref: '#/components/schemas/AccessDeniedReason'
    InvalidRequestErrorRep:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Specific error code encountered
          example: invalid_request
        message:
          type: string
          description: Description of the error
          example: Invalid request body
    RateLimitedErrorRep:
      type: object
      required:
      - code

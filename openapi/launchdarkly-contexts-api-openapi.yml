tags:
- name: Contexts
  description: 'Contexts are people, services, machines, or other resources that encounter feature flags in your product. Contexts are identified by their `kind`, which describes the type of resources encountering flags, and by their `key`. Each unique combination of one or more contexts that have encountered a feature flag in your product is called a context instance. When you use the LaunchDarkly SDK to evaluate a flag, you provide a context to that call. LaunchDarkly records the key and attributes of each context. You can view these in the LaunchDarkly user interface from the **Contexts** list, or use the Context APIs. To learn more, read Contexts. LaunchDarkly provides APIs for you to:


    * retrieve contexts and context attribute names and values

    * search for contexts

    * fetch context kinds

    * create and update context kinds


    To learn more about context kinds, read Context kinds. Contexts are always scoped within a project and an environment. Each environment has its own set of context records. Context records reflect the contexts that LaunchDarkly has received within the last 30 days. Some of the endpoints in the contexts API accept an application ID. The application ID is returned as the `applicationId` field of each element in the `items` array of the Get contexts response. By default, the application ID is set to the SDK you are using. In the LaunchDarkly UI, the application ID and application version appear on the context details page in the "From source" field. You can change the application ID as part of your SDK configuration. To learn more, read Application metadata configuration. ### Filtering contexts


    When you search for contexts, you can filter the results using fields and operators with the `filter` parameter. Specify `filter` either as a query parameter or as a request body parameter. The `filter` parameter supports the following operators: `after`, `anyOf`, `before`, `contains`, `equals`, `exists`, `notEquals`, `startsWith`. Expand for details on operators and syntax


    #### after


    Returns contexts if the field''s date value occurs after the specified time. Provide an RFC 3339 timestamp or Unix epoch milliseconds. For example:


    * `myField after "2022-09-21T19:03:15+00:00"`


    #### anyOf


    Returns contexts if the field value matches any of the provided values. The `anyOf` operator is supported for the `applicationId`, `key`, `kind`, `kindKey`, `kindKeys`, and `kinds` fields only. To match an attribute against multiple values, use `equals` with an array value instead. For example:


    * `kind anyOf ["user","device"]`

    * `key anyOf ["user-key-123abc","user-key-456def"]`


    #### before


    Returns contexts if the field''s date value occurs before the provided time. Provide an RFC 3339 timestamp or Unix epoch milliseconds. For example:


    * `myField before "2022-09-21T19:03:15+00:00"`


    #### contains


    Returns contexts whose kind or kind and key match the provided value. The `contains` operator is supported for the `kinds` and `kindKeys` fields only, and accepts exactly one value. For example:


    * `kinds contains ["user"]`

    * `kindKeys contains ["user:user-key-123abc"]`


    #### equals


    Returns contexts only if the field value exactly matches the provided value. If you provide an array, the filter matches if the field value equals any element of the array. For example:


    * `myField equals 44`

    * `myField equals "device"`

    * `myField equals true`

    * `myField equals [1,2,3,4]`

    * `myField equals ["hello","goodbye"]`


    #### exists


    Returns contexts based on whether the specified field exists. The `exists` operator is supported for the `name` field and attribute fields only. For example:


    * `myField exists true`

    * `myField exists false`

    * `*.name exists true`


    #### notEquals


    Returns contexts if the field value does not exactly match the provided value. If you provide an array, the filter matches if the field value does not equal any element of the array.'

        description: 'A comma-separated list of properties that can reveal additional information in the response. Options: `environmentObservations`.'
        schema:
          type: string
          format: string
          description: 'A comma-separated list of properties that can reveal additional information in the response. Options: `environmentObservations`.'
      operationId: getContextKindsByProjectKey

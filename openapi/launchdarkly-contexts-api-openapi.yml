  /api/v2/projects/{projectKey}/environments/{environmentKey}/flags/evaluate:
    post:
      responses:
        '200':
          description: Flag evaluation collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextInstanceEvaluations'
        '400':
          description: Invalid request

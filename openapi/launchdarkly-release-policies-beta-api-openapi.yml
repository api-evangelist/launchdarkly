      type: object
    GuardedReleaseConfig:
      description: Configuration for guarded releases
      example:
        metricKeys:
        - http-errors
        - latency
        rolloutContextKindKey: user
        metricGroupKeys:
        - frontend-metrics
        - backend-metrics
        minSampleSize: 100
        stages:
        - allocation: 25000
          durationMillis: 60000
        - allocation: 50000
          durationMillis: 60000
        rollbackOnRegression: true
      properties:
        rolloutContextKindKey:
          description: Context kind key to use as the randomization unit for the rollout
          example: user
          type: string
        minSampleSize:
          description: The minimum number of samples required to make a decision
          example: 100
          type: integer
        rollbackOnRegression:
          description: Whether to roll back on regression
          example: true
          type: boolean
        metricKeys:
          description: List of metric keys
          example:
          - http-errors
          - latency
          items:
            type: string
          type: array
        metricGroupKeys:
          description: List of metric group keys
          example:
          - frontend-metrics
          - backend-metrics
          items:
            type: string
          type: array
        stages:
          description: List of stages. At most 10 stages by default; the server enforces the per-account limit, which is never more than 20.
          example:
          - allocation: 25000
            durationMillis: 60000
          - allocation: 50000
            durationMillis: 60000
          items:

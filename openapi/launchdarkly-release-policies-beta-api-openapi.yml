          type: string
        style: simple
      - description: The project key
        example: default
        explode: false
        in: path
        name: projectKey
        required: true
        schema:
          type: string
        style: simple
      - description: The release policy key
        example: production-release
        explode: false
        in: path
        name: policyKey
        required: true
        schema:
          type: string
        style: simple
      responses:

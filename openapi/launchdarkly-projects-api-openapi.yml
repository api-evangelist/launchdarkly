openapi: 3.2.0
info:
  title: Launchdarkly Projects API
  version: '1.0'
  description: 'Operations tagged Projects across 3 of this provider''s published API definitions: launchdarkly-dev-server-openapi.yml, launchdarkly-openapi.json, launchdarkly-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:8765/dev
- url: https://app.launchdarkly.com
  description: ' Default'
- url: https://app.launchdarkly.us
  description: ' Federal'
- url: https://app.launchdarkly.com/api/v2
  description: LaunchDarkly Production API
tags:
- name: Projects
paths:
  /projects:
    get:
      summary: lists all projects that have been configured for the dev server
      operationId: getProjects
      responses:
        200:
          description: OK. List of projects
          content:
            application/json:
              schema:
                description: list of project keys.
                type: array
                items:
                  type: string
                uniqueItems: true
      tags:
      - Projects
    post:
      operationId: createProject
      summary: Create a project
      description: Creates a new project with the specified key, name, and default environments.
      tags:
      - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectBody'
      responses:
        '201':
          description: Project created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project_3'
        '400':
          description: Invalid request body.
        '401':
          description: Unauthorized. Invalid or missing access token.
        '409':
          description: A project with the given key already exists.
    servers:
    - url: http://localhost:8765/dev
  /projects/{projectKey}:
    get:
      summary: get the specified project and its configuration for syncing from the…
      operationId: getProject
      parameters:
      - $ref: '#/components/parameters/projectKey'
      - $ref: '#/components/parameters/projectExpand'
      responses:
        200:
          $ref: '#/components/responses/Project'
        404:
          description: No project found
      tags:
      - Projects
    patch:
      summary: updates the project context or sourceEnvironmentKey then syncs.
      operationId: patchProject
      parameters:
      - $ref: '#/components/parameters/projectKey'
      - $ref: '#/components/parameters/projectExpand'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceEnvironmentKey:
                  type: string
                  description: environment to copy flag values from
                context:
                  $ref: '#/components/schemas/Context'
      responses:
        200:
          $ref: '#/components/responses/Project'
        404:
          description: No project found
      tags:
      - Projects
    delete:
      summary: remove the specified project from the dev server
      operationId: deleteProject
      parameters:
      - $ref: '#/components/parameters/projectKey'
      responses:
        204:
          description: OK. Project & overrides were removed
        404:
          $ref: '#/components/responses/ErrorResponse'
      tags:
      - Projects
    post:
      summary: Add the project to the dev server
      operationId: postAddProject
      parameters:
      - $ref: '#/components/parameters/projectKey'
      - $ref: '#/components/parameters/projectExpand'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - sourceEnvironmentKey
              properties:
                sourceEnvironmentKey:
                  type: string
                  description: environment to copy flag values from
                context:
                  $ref: '#/components/schemas/Context'
      responses:
        201:
          $ref: '#/components/responses/Project'
        400:
          $ref: '#/components/responses/ErrorResponse'
        409:
          $ref: '#/components/responses/ErrorResponse'
      tags:
      - Projects
    servers:
    - url: http://localhost:8765/dev
  /projects/{projectKey}/import:
    post:
      summary: Import a project from exported JSON data
      description: 'Import a project using the JSON format from get-project with expand options.

        Accepts the same format that is exported by the get-project endpoint.'
      operationId: postImportProject
      parameters:
      - $ref: '#/components/parameters/projectKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        201:
          $ref: '#/components/responses/Project'
        400:
          $ref: '#/components/responses/ErrorResponse'
        409:
          $ref: '#/components/responses/ErrorResponse'
      tags:
      - Projects
    servers:
    - url: http://localhost:8765/dev
  /projects/{projectKey}/overrides:
    delete:
      summary: remove all overrides for the given project
      operationId: deleteOverrides
      parameters:
      - $ref: '#/components/parameters/projectKey'
      responses:
        204:
          description: OK. All overrides were removed
        404:
          $ref: '#/components/responses/ErrorResponse'
      tags:
      - Projects
    servers:
    - url: http://localhost:8765/dev
  /projects/{projectKey}/overrides/{flagKey}:
    put:
      summary: override flag value with value provided in the body
      operationId: putOverrideFlag
      parameters:
      - $ref: '#/components/parameters/projectKey'
      - $ref: '#/components/parameters/flagKey'
      requestBody:
        required: true
        description: flag value to override flag with. The json representation of the variation value.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagValue'
      responses:
        200:
          $ref: '#/components/responses/FlagOverride'
        400:
          $ref: '#/components/responses/ErrorResponse'
      tags:
      - Projects
    delete:
      summary: remove override for flag
      operationId: deleteFlagOverride
      parameters:
      - $ref: '#/components/parameters/projectKey'
      - $ref: '#/components/parameters/flagKey'
      responses:
        204:
          description: OK. override removed
        404:
          description: no matching override found
      tags:
      - Projects
    servers:
    - url: http://localhost:8765/dev
  /projects/{projectKey}/environments:
    get:
      operationId: getEnvironments
      summary: list all environments for the given project
      parameters:
      - $ref: '#/components/parameters/projectKey'
      - name: name
        in: query
        description: filter by environment name
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: limit the number of environments returned
        required: false
        schema:
          type: integer
      responses:
        200:
          description: OK. List of environments
          content:
            application/json:
              schema:
                description: list of environments
                type: array
                items:
                  $ref: '#/components/schemas/Environment'
                uniqueItems: true
        404:
          $ref: '#/components/responses/ErrorResponse'
        400:
          $ref: '#/components/responses/ErrorResponse'
      tags:
      - Projects
    servers:
    - url: http://localhost:8765/dev
  /api/v2/projects:
    get:
      responses:
        '200':
          description: Project collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projects'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Projects
      summary: List projects
      description: 'Return a list of projects.


        By default, this returns the first 20 projects. Page through this list with the `limit` parameter and by following the `first`, `prev`, `next`, and `last` links in the `_links` field that returns. If those links do not appear, the pages they refer to don''t exist. For example, the `first` and `prev` links will be missing from the response on the first page, because there is no previous page and you cannot return to the first page when you are already on the first page.


        ### Filtering projects


        LaunchDarkly supports three fields for filters:

        - `query` is a string that matches against the projects'' names and keys. It is not case sensitive.

        - `tags` is a `+`-separated list of project tags. It filters the list of projects that have all of the tags in the list.

        - `keys` is a `|` separated list of project keys. It filters the list to projects that have any of the keys in the list.


        For example, the filter `filter=query:abc,tags:tag-1+tag-2` matches projects with the string `abc` in their name or key and also are tagged with `tag-1` and `tag-2`. The filter is not case-sensitive.


        The documented values for `filter` query parameters are prior to URL encoding. For example, the `+` in `filter=tags:tag-1+tag-2` must be encoded to `%2B`.


        ### Sorting projects


        LaunchDarkly supports two fields for sorting:

        - `name` sorts by project name.

        - `createdOn` sorts by the creation date of the project.


        For example, `sort=name` sorts the response by project name in ascending order.


        ### Expanding the projects response


        LaunchDarkly supports one field for expanding the "List projects" response. By default, these fields are **not** included in the response.


        To expand the response, append the `expand` query parameter and add a comma-separated list with the `environments` field.


        * `environments` includes a paginated list of the project environments.


        For example, `expand=environments` includes the `environments` field for each project in the response.'
      parameters:
      - name: limit
        in: query
        description: The number of projects to return in the response. Defaults to 20.
        schema:
          type: integer
          format: int64
          description: The number of projects to return in the response. Defaults to 20.
      - name: offset
        in: query
        description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and returns the next `limit` items.
        schema:
          type: integer
          format: int64
          description: Where to start in the list. Use this with pagination. For example, an offset of 10 skips the first ten items and returns the next `limit` items.
      - name: filter
        in: query
        description: A comma-separated list of filters. Each filter is constructed as `field:value`.
        schema:
          type: string
          format: string
          description: A comma-separated list of filters. Each filter is constructed as `field:value`.
      - name: sort
        in: query
        description: A comma-separated list of fields to sort by. Fields prefixed by a dash ( - ) sort in descending order.
        schema:
          type: string
          format: string
          description: A comma-separated list of fields to sort by. Fields prefixed by a dash ( - ) sort in descending order.
      - name: expand
        in: query
        description: A comma-separated list of properties that can reveal additional information in the response.
        schema:
          type: string
          format: string
          description: A comma-separated list of properties that can reveal additional information in the response.
      operationId: getApiV2Projects
      security:
      - ApiKey:
        - read
        - write
      x-operation-id-source: normalized
      x-operation-id-original: getProjects
    post:
      responses:
        '201':
          description: Project response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Projects
      summary: Create project
      description: Create a new project with the given key and name. Project keys must be unique within an account.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPost'
            example:
              key: project-key-123abc
              name: My Project
        required: true
      operationId: postProject
      security:
      - ApiKey:
        - read
        - write
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'
  /api/v2/projects/{projectKey}:
    get:
      responses:
        '200':
          description: Project response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project_2'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Projects
      summary: Get project
      description: 'Get a single project by key.


        ### Expanding the project response


        LaunchDarkly supports one field for expanding the "Get project" response. By default, these fields are **not** included in the response.


        To expand the response, append the `expand` query parameter and add a comma-separated list with any of the following fields:

        * `environments` includes a paginated list of the project environments.


        For example, `expand=environments` includes the `environments` field for the project in the response.'
      parameters:
      - name: projectKey
        in: path
        description: The project key.
        required: true
        schema:
          type: string
          format: string
          description: The project key.
      - name: expand
        in: query
        description: A comma-separated list of properties that can reveal additional information in the response.
        schema:
          type: string
          format: string
          description: A comma-separated list of properties that can reveal additional information in the response.
      operationId: getApiV2ProjectsByProjectKey
      security:
      - ApiKey:
        - read
        - write
      x-operation-id-source: normalized
      x-operation-id-original: getProject
    patch:
      responses:
        '200':
          description: Project response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Projects
      summary: Update project
      description: 'Update a project. Updating a project uses a JSON patch representation of the desired changes. To learn more, read Updates.


        To add an element to the project fields that are arrays, set the `path` to the name of the field and then append `/`. Use `/0` to add to the beginning of the array. Use `/-` to add to the end of the array. For example, `"path": "/tags/0"` adds a tag.


        Note that `tags` are always deduplicated and returned in alphabetical order, regardless of the array index used in the patch path.'
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
            example:
            - op: add
              path: /tags/0
              value: another-tag
        required: true
      operationId: patchApiV2ProjectsByProjectKey
      security:
      - ApiKey:
        - read
        - write
      x-operation-id-source: normalized
      x-operation-id-original: patchProject
    delete:
      responses:
        '204':
          description: Action succeeded
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Projects
      summary: Delete project
      description: Delete a project by key. Use this endpoint with caution. Deleting a project will delete all associated environments and feature flags. You cannot delete the last project in an account.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      operationId: deleteApiV2ProjectsByProjectKey
      security:
      - ApiKey:
        - read
        - write
      x-operation-id-source: normalized
      x-operation-id-original: deleteProject
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'
  /api/v2/projects/{projectKey}/flag-defaults:
    get:
      responses:
        '200':
          description: Flag defaults response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flagDefaultsRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
      tags:
      - Projects
      summary: Get flag defaults for project
      description: Get the flag defaults for a specific project.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      operationId: getFlagDefaultsByProject
      security:
      - ApiKey:
        - read
        - write
    patch:
      responses:
        '200':
          description: Flag default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upsertPayloadRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Projects
      summary: Update flag default for project
      description: Update a flag default. Updating a flag default uses a JSON patch or JSON merge patch representation of the desired changes. To learn more, read Updates.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
        required: true
      operationId: patchFlagDefaultsByProject
      security:
      - ApiKey:
        - read
        - write
    put:
      responses:
        '200':
          description: Flag default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upsertPayloadRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '409':
          description: Status conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Projects
      summary: Create or update flag defaults for project
      description: Create or update flag defaults for a project.
      parameters:
      - name: projectKey
        in: path
        description: The project key
        required: true
        schema:
          type: string
          format: string
          description: The project key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertFlagDefaultsPayload'
        required: true
      operationId: putFlagDefaultsByProject
      security:
      - ApiKey:
        - read
        - write
    servers:
    - url: https://app.launchdarkly.com
      description: ' Default'
    - url: https://app.launchdarkly.us
      description: ' Federal'
components:
  schemas:
    Context:
      type: object
      description: context object to use when evaluating flags in source environment
      x-go-type: ldcontext.Context
      x-go-type-import:
        path: github.com/launchdarkly/go-sdk-common/v3/ldcontext
      default:
        key: dev-environment
        kind: user
    Project:
      description: Project
      type: object
      required:
      - sourceEnvironmentKey
      - context
      - _lastSyncedFromSource
      properties:
        context:
          $ref: '#/components/schemas/Context'
        sourceEnvironmentKey:
          type: string
          description: environment to copy flag values from
        flagsState:
          type: object
          description: flags and their values and version for a given project in the source environment
          x-go-type: model.FlagsState
          x-go-type-import:
            path: github.com/launchdarkly/ldcli/internal/dev_server/model
        overrides:
          type: object
          description: overridden flags for the project
          x-go-type: model.FlagsState
          x-go-type-import:
            path: github.com/launchdarkly/ldcli/internal/dev_server/model
        availableVariations:
          type: object
          description: variations
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Variation'
        _lastSyncedFromSource:
          type: integer
          x-go-type: int64
          description: unix timestamp for the lat time the flag values were synced from the source environment
    FlagValue:
      description: value of a feature flag variation
      oneOf:
      - type: string
      - type: boolean
      - type: number
      - type: object
      x-go-type: ldvalue.Value
      x-go-type-import:
        path: github.com/launchdarkly/go-sdk-common/v3/ldvalue
    Environment:
      description: Environment
      type: object
      required:
      - key
      - name
      properties:
        key:
          type: string
        name:
          type: string
    Variation:
      description: variation of a flag
      required:
      - _id
      - value
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        value:
          $ref: '#/components/schemas/FlagValue'
    ProjectPost:
      type: object
      required:
      - name
      - key
      properties:
        name:
          type: string
          description: A human-friendly name for the project.
          example: My Project
        key:
          type: string
          description: A unique key used to reference the project in your code.
          example: project-key-123abc
        includeInSnippetByDefault:
          type: boolean
          description: Whether or not flags created in this project are made available to the client-side JavaScript SDK by default.
          example: true
        defaultClientSideAvailability:
          description: Controls which client-side SDKs can use new flags by default.
          $ref: '#/components/schemas/DefaultClientSideAvailabilityPost'
        tags:
          type: array

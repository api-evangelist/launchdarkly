openapi: 3.2.0
info:
  title: Launchdarkly Integration audit log subscriptions API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
  description: 'Operations tagged Integration audit log subscriptions across 2 of this provider''s published API definitions: launchdarkly-openapi.json, launchdarkly-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.launchdarkly.com
  description: ' Default'
- url: https://app.launchdarkly.us
  description: ' Federal'
- url: https://app.launchdarkly.com/api/v2
  description: LaunchDarkly Production API
tags:
- name: Integration audit log subscriptions
  description: 'Audit log integration subscriptions allow you to send audit log events hooks to one of dozens of external tools. For example, you can send flag change event webhooks to external third party software. To learn more, read Using the LaunchDarkly integration framework. You can use the integration subscriptions API to create, delete, and manage your integration audit log subscriptions. Each of these operations requires an `integrationKey` that refers to the type of integration. The required `config` fields to create a subscription vary depending on the `integrationKey`. You can find a full list of the fields for each integration below. Several of these operations require a subscription ID. The subscription ID is returned as part of the Create audit log subscription and Get audit log subscriptions by integration responses. It is the `_id` field, or the `_id` field of each element in the `items` array. ### Configuration bodies by integrationKey


    #### datadog


    `apiKey` is a sensitive value. `hostURL` must evaluate to either `"https://api.datadoghq.com"` or `"https://api.datadoghq.eu"` and will default to the former if not explicitly defined. ```

    "config": {

    "apiKey": , # sensitive value

    "hostURL":

    }

    ```


    #### dynatrace


    `apiToken` is a sensitive value. `entity` must evaluate to one of the following fields and will default to `"APPLICATION"` if not explicitly defined:



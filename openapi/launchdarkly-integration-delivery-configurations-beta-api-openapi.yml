tags:
- name: Integration delivery configurations (beta)
  description: '> ### This feature is in beta

    >

    > To use this feature, pass in a header including the `LD-API-Version` key with value set to `beta`. Use this header with each call. To learn more, read Beta resources.

    >

    > Resources that are in beta are still undergoing testing and development. They may change without notice, including becoming backwards incompatible.


    The integration delivery configurations API allow you to create, modify, validate, and delete delivery configurations.


    Several of the endpoints require a delivery configuration ID. The delivery configuration ID is returned as part of the Create delivery configuration and List all delivery configurations responses. It is the `_id` field, or the `_id` field of each element in the `items` array.'
paths:
  /api/v2/integration-capabilities/featureStore:
    get:
      responses:
        '200':
          description: Integration delivery configuration collection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationDeliveryConfigurationCollection'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '404':
          description: Invalid resource identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
      tags:
      - Integration delivery configurations (beta)
      summary: List all delivery configurations
      description: List all delivery configurations.
      operationId: getIntegrationDeliveryConfigurations
  /api/v2/integration-capabilities/featureStore/{projectKey}/{environmentKey}:
    get:
      responses:
        '200':
          description: Integration delivery configuration collection response
          content:

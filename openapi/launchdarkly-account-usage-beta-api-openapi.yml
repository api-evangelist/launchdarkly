        name: from
        required: true
        schema:
          format: int64
          type: integer
        style: form
      - description: Exclusive UTC range end in Unix milliseconds.
        explode: true
        in: query
        name: to
        required: true
        schema:
          format: int64
          type: integer
        style: form
      - description: The source scope. Only `streaming` is supported.
        explode: true
        in: query
        name: source
        required: false
        schema:
          default: streaming
          type: string
        style: form
      - description: The ranking dimension. Only `project` is supported.
        explode: true
        in: query
        name: dimension
        required: false
        schema:
          default: project
          type: string
        style: form
      - description: A canonical project key to include. Can be specified multiple times, with at most 100 unique explicit selections; duplicates do not consume the limit. When omitted, all account projects with usage in the requested range are ranked.
        explode: true
        in: query
        name: projectKey
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: A case-insensitive substring matched against canonical project keys before querying usage. Project names are not searched.
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: An opaque cursor returned by a previous response. Cursors are bound to the account and ranking inputs.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: The maximum number of ranked projects to return. This bounds response rows and look-ahead, not the account-wide candidate universe.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 5
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportProjectRankingRep'
          description: Bounded project ranking
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

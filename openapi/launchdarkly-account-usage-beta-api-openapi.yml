      - name: anonymous
        in: query
        description: 'An anonymous value to filter results by. Can be specified multiple times, one query parameter per anonymous value.<br/>Valid values: `true`, `false`.'
        schema:
          type: string
          format: string
          description: 'An anonymous value to filter results by. Can be specified multiple times, one query parameter per anonymous value.<br/>Valid values: `true`, `false`.'
      - name: groupBy

tags:
- name: Account usage (beta)
  description: '> ### This feature is in beta

    >

    > To use this feature, pass in a header including the `LD-API-Version` key with value set to `beta`. Use this header with each call. To learn more, read Beta resources.

    >

    > Resources that are in beta are still undergoing testing and development. They may change without notice, including becoming backwards incompatible.


    The account usage API lets you query for metrics about how your account is using LaunchDarkly. To learn more, read Account usage metrics.


    Each endpoint returns time-series data in the form of an array of data points with timestamps. Each one contains data for that time from one or more series. It also includes a metadata array describing what each of the series is.'
paths:
  /api/v2/usage/ai-runs:
    get:
      responses:
        '200':
          description: Usage response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesListRep'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorRep'
        '401':
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorRep'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorRep'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorRep'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusServiceUnavailable'
      tags:
      - Account usage (beta)
      summary: Get AI runs usage
      description: Get a time series array showing the number of AI runs recorded for your account. The supported granularity varies by aggregation type. The maximum time range is 365 days.
      parameters:
      - name: from
        in: query
        description: The series of data returned starts from this timestamp (Unix milliseconds). Defaults to the beginning of the current month.
        schema:
          type: string
          format: string
          description: The series of data returned starts from this timestamp (Unix milliseconds). Defaults to the beginning of the current month.
      - name: to
        in: query
        description: The series of data returned ends at this timestamp (Unix milliseconds). Defaults to the current time.
        schema:
          type: string
          format: string
          description: The series of data returned ends at this timestamp (Unix milliseconds). Defaults to the current time.
      - name: projectKey
        in: query
        description: A project key to filter results by. Can be specified multiple times, one query parameter per project key.
        schema:
          type: string
          format: string
          description: A project key to filter results by. Can be specified multiple times, one query parameter per project key.
      - name: environmentKey
        in: query
        description: An environment key to filter results by. If specified, exactly one `projectKey` must be provided. Can be specified multiple times, one query parameter per environment key.
        schema:
          type: string
          format: string
          description: An environment key to filter results by. If specified, exactly one `projectKey` must be provided. Can be specified multiple times, one query parameter per environment key.
      - name: sdkName
        in: query
        description: An SDK name to filter results by. Can be specified multiple times, one query parameter per SDK name.
        schema:
          type: string
          format: string
          description: An SDK name to filter results by. Can be specified multiple times, one query parameter per SDK name.
      - name: sdkVersion
        in: query
        description: An SDK version to filter results by. Can be specified multiple times, one query parameter per SDK version.
        schema:
          type: string
          format: string
          description: An SDK version to filter results by. Can be specified multiple times, one query parameter per SDK version.
      - name: sdkType
        in: query
        description: An SDK type to filter results by. Can be specified multiple times, one query parameter per SDK type.
        schema:
          type: string
          format: string
          description: An SDK type to filter results by. Can be specified multiple times, one query parameter per SDK type.
      - name: groupBy
        in: query
        description: 'If specified, returns data for each distinct value of the given field. Can be specified multiple times to group data by multiple dimensions, one query parameter per dimension.<br/>Valid values: `projectId`, `environmentId`, `sdkName`, `sdkVersion`, `sdkType`.'
        schema:
          type: string
          format: string
          description: 'If specified, returns data for each distinct value of the given field. Can be specified multiple times to group data by multiple dimensions, one query parameter per dimension.<br/>Valid values: `projectId`, `environmentId`, `sdkName`, `sdkVersion`, `sdkType`.'
      - name: aggregationType
        in: query
        description: 'Specifies the aggregation method. Defaults to `month_to_date`.<br/>Valid values: `month_to_date`, `incremental`.'
        schema:
          type: string
          format: string
          description: 'Specifies the aggregation method. Defaults to `month_to_date`.<br/>Valid values: `month_to_date`, `incremental`.'
      - name: granularity
        in: query
        description: 'Specifies the data granularity. Defaults to `daily`. `monthly` granularity is only supported with the **month_to_date** aggregation type.<br/>Valid values: `daily`, `hourly`, `monthly`.'
        schema:
          type: string
          format: string
          description: 'Specifies the data granularity. Defaults to `daily`. `monthly` granularity is only supported with the **month_to_date** aggregation type.<br/>Valid values: `daily`, `hourly`, `monthly`.'
      operationId: getAIRunsUsage

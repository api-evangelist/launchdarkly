            application/json:
              schema:
                $ref: '#/components/schemas/DataExportProjectIdentityIncompleteError'
          description: Current account metadata cannot attribute every successful usage row in the requested range to a project
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limited
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Rank Streaming usage by project
      tags:
      - Account usage (beta)
components:

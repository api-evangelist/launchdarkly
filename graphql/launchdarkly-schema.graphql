"""
LaunchDarkly Conceptual GraphQL Schema
Derived from the LaunchDarkly REST API (v20240415) data model.
LaunchDarkly does not publish a native GraphQL API; this schema is a
faithful representation of the resource types and relationships found
in https://apidocs.launchdarkly.com/
"""

# ─── Scalars ──────────────────────────────────────────────────────────────────

scalar DateTime
scalar JSON

# ─── Enums ────────────────────────────────────────────────────────────────────

enum FlagKind {
  BOOLEAN
  MULTIVARIATE
}

enum VariationType {
  BOOLEAN
  STRING
  NUMBER
  JSON
}

enum RolloutKind {
  ROLLOUT
  EXPERIMENT
}

enum ClauseOp {
  IN
  END_WITH
  START_WITH
  MATCHES
  CONTAINS
  LESS_THAN
  LESS_THAN_OR_EQUAL
  GREATER_THAN
  GREATER_THAN_OR_EQUAL
  BEFORE
  AFTER
  SEGMENT_MATCH
  SEMANTIC_VERSION_EQUAL
  SEMANTIC_VERSION_LESS_THAN
  SEMANTIC_VERSION_GREATER_THAN
}

enum MetricKind {
  PAGE_VIEW
  CLICK
  CUSTOM
}

enum ExperimentStatus {
  CREATED
  RUNNING
  STOPPED
  ARCHIVED
}

enum ApprovalStatus {
  PENDING
  APPROVED
  DECLINED
  APPLIED
  FAILED
}

enum ApprovalReviewKind {
  APPROVE
  DECLINE
  COMMENT
}

enum WorkflowKind {
  CUSTOM
  RELEASE
}

enum TokenType {
  PERSONAL
  SERVICE
}

enum RelayProxyMode {
  RELAY
  OFFLINE
}

enum MigrationStage {
  OFF
  DUALWRITE
  SHADOW
  LIVE
  RAMPDOWN
  COMPLETE
}

# ─── Project & Environment ────────────────────────────────────────────────────

type Project {
  key: String!

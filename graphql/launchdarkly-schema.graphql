# ─── Queries ──────────────────────────────────────────────────────────────────

type Query {
  # Projects
  projects: [Project!]!
  project(projectKey: String!): Project

  # Environments
  environments(projectKey: String!): [Environment!]!
  environment(projectKey: String!, environmentKey: String!): Environment

  # Feature Flags
  featureFlags(projectKey: String!, environmentKey: String, tags: [String!], summary: Boolean): [FeatureFlag!]!
  featureFlag(projectKey: String!, featureFlagKey: String!, environmentKey: String): FeatureFlag

  # Segments
  segments(projectKey: String!, environmentKey: String!): [Segment!]!
  segment(projectKey: String!, environmentKey: String!, segmentKey: String!): Segment

  # Metrics
  metrics(projectKey: String!): [Metric!]!
  metric(projectKey: String!, metricKey: String!): Metric

  # Experiments
  experiments(projectKey: String!, environmentKey: String!): [Experiment!]!
  experiment(projectKey: String!, environmentKey: String!, experimentKey: String!): Experiment

  # Approvals
  approvalRequests(projectKey: String!, flagKey: String, environmentKey: String): [ApprovalRequest!]!
  approvalRequest(id: ID!): ApprovalRequest

  # Audit Log
  auditLog(before: DateTime, after: DateTime, q: String, limit: Int): [AuditLogEntry!]!

  # Webhooks
  webhooks: [Webhook!]!
  webhook(webhookId: ID!): Webhook

  # Integrations
  integrationSubscriptions(integrationKey: String!): [IntegrationSubscription!]!
  integrationSubscription(integrationKey: String!, integrationId: ID!): IntegrationSubscription

  # Access Tokens
  accessTokens: [AccessToken!]!
  accessToken(tokenId: ID!): AccessToken

  # Teams
  teams(projectKey: String): [Team!]!
  team(teamKey: String!): Team

  # Members
  members: [Member!]!
  member(memberId: ID!): Member

  # Custom Roles
  customRoles: [CustomRole!]!
  customRole(customRoleKey: String!): CustomRole

  # Relay Proxy
  relayProxyConfigs: [RelayProxyConfig!]!
  relayProxyConfig(id: ID!): RelayProxyConfig

  # Release Pipelines
  releasePipelines(projectKey: String!): [ReleasePipeline!]!
  releasePipeline(projectKey: String!, pipelineKey: String!): ReleasePipeline

  # Workflows
  workflows(projectKey: String!, featureFlagKey: String!, environmentKey: String!): [Workflow!]!

  # Flag Triggers
  flagTriggers(projectKey: String!, environmentKey: String!, featureFlagKey: String!): [FlagTrigger!]!

  # Code References
  codeReferenceRepositories: [CodeReferenceRepository!]!

  # Tags
  tags(projectKey: String): TagCollection
}

# ─── Mutations ────────────────────────────────────────────────────────────────

type Mutation {
  # Feature Flags
  createFeatureFlag(projectKey: String!, name: String!, key: String!, kind: FlagKind!, variations: [JSON!], tags: [String!], description: String): FeatureFlag!
  updateFeatureFlag(projectKey: String!, featureFlagKey: String!, patch: [JSON!]!): FeatureFlag!
  deleteFeatureFlag(projectKey: String!, featureFlagKey: String!): Boolean!
  toggleFeatureFlag(projectKey: String!, featureFlagKey: String!, environmentKey: String!, on: Boolean!): FlagConfig!

  # Projects
  createProject(name: String!, key: String!, tags: [String!]): Project!
  updateProject(projectKey: String!, patch: [JSON!]!): Project!
  deleteProject(projectKey: String!): Boolean!

  # Environments
  createEnvironment(projectKey: String!, name: String!, key: String!, color: String!, tags: [String!]): Environment!
  updateEnvironment(projectKey: String!, environmentKey: String!, patch: [JSON!]!): Environment!
  deleteEnvironment(projectKey: String!, environmentKey: String!): Boolean!

  # Segments
  createSegment(projectKey: String!, environmentKey: String!, name: String!, key: String!, tags: [String!]): Segment!
  updateSegment(projectKey: String!, environmentKey: String!, segmentKey: String!, patch: [JSON!]!): Segment!
  deleteSegment(projectKey: String!, environmentKey: String!, segmentKey: String!): Boolean!

  # Metrics
  createMetric(projectKey: String!, key: String!, name: String!, kind: MetricKind!): Metric!
  updateMetric(projectKey: String!, metricKey: String!, patch: [JSON!]!): Metric!
  deleteMetric(projectKey: String!, metricKey: String!): Boolean!

  # Experiments
  createExperiment(projectKey: String!, environmentKey: String!, name: String!, key: String!, hypothesis: String!): Experiment!
  updateExperiment(projectKey: String!, environmentKey: String!, experimentKey: String!, patch: [JSON!]!): Experiment!

  # Approvals
  createApprovalRequest(projectKey: String!, featureFlagKey: String!, environmentKey: String!, description: String!, instructions: JSON!, notifyMemberIds: [String!]): ApprovalRequest!
  reviewApprovalRequest(id: ID!, kind: ApprovalReviewKind!, comment: String): ApprovalRequest!
  applyApprovalRequest(id: ID!, comment: String): ApprovalRequest!
  deleteApprovalRequest(id: ID!): Boolean!

  # Webhooks
  createWebhook(url: String!, name: String, sign: Boolean, on: Boolean, tags: [String!], statements: [JSON!]): Webhook!
  updateWebhook(webhookId: ID!, patch: [JSON!]!): Webhook!
  deleteWebhook(webhookId: ID!): Boolean!

  # Access Tokens
  createAccessToken(name: String!, role: String, customRoleIds: [String!], inlineRole: [JSON!], serviceToken: Boolean, defaultApiVersion: Int): AccessToken!
  resetAccessToken(tokenId: ID!, expiry: DateTime): AccessToken!
  deleteAccessToken(tokenId: ID!): Boolean!

  # Teams
  createTeam(key: String!, name: String!, description: String, memberIDs: [String!], customRoleKeys: [String!]): Team!
  updateTeam(teamKey: String!, patch: [JSON!]!): Team!
  deleteTeam(teamKey: String!): Boolean!

  # Members
  inviteMembers(invitations: [JSON!]!): [Member!]!
  updateMember(memberId: ID!, patch: [JSON!]!): Member!
  deleteMember(memberId: ID!): Boolean!

  # Custom Roles
  createCustomRole(name: String!, key: String!, policy: [JSON!]!, description: String): CustomRole!
  updateCustomRole(customRoleKey: String!, patch: [JSON!]!): CustomRole!
  deleteCustomRole(customRoleKey: String!): Boolean!

  # Relay Proxy
  createRelayProxyConfig(name: String!, policy: [JSON!]!): RelayProxyConfig!
  updateRelayProxyConfig(id: ID!, patch: [JSON!]!): RelayProxyConfig!
  deleteRelayProxyConfig(id: ID!): Boolean!
  resetRelayProxyConfig(id: ID!, expiry: DateTime): RelayProxyConfig!

  # Workflows
  createWorkflow(projectKey: String!, featureFlagKey: String!, environmentKey: String!, name: String!, stages: [JSON!]!): Workflow!
  deleteWorkflow(projectKey: String!, featureFlagKey: String!, environmentKey: String!, workflowId: ID!): Boolean!

  # Flag Triggers
  createFlagTrigger(projectKey: String!, environmentKey: String!, featureFlagKey: String!, integrationKey: String!, instructions: JSON!): FlagTrigger!
  updateFlagTrigger(projectKey: String!, environmentKey: String!, featureFlagKey: String!, id: ID!, patch: [JSON!]!): FlagTrigger!
  deleteFlagTrigger(projectKey: String!, environmentKey: String!, featureFlagKey: String!, id: ID!): Boolean!
}

      CodeControl loop, with the semantic-patch Content-Type, the no-Bearer-prefix
      authorization rule and the 30-day reversal window all stated inline.
    operations: [getProjects, getProject, getEnvironment, postFeatureFlag, getFeatureFlag, patchFeatureFlag, getFeatureFlagStatus]
    risk: write
  - name: launchdarkly-governed-flag-change
    file: launchdarkly-governed-flag-change.md
    description: >-
      Propose a change through an approval request or a scheduled change instead of
      applying it directly. The safe write path for an agent in production, and the only
      one with a clean withdrawal step.
    operations: [postApprovalRequest, getApprovalRequests, getApprovalRequest, postApprovalRequestApply, deleteApprovalRequest, postFlagConfigScheduledChanges, getFlagConfigScheduledChanges, deleteFlagConfigScheduledChanges, getAuditLogEntries]

    file: launchdarkly-audit-and-clean-up-flags.md
    description: >-
      Find stale flags, check evaluation status in every environment and check dependent
      flags before retiring anything, then deprecate or archive rather than delete.
    operations: [getFeatureFlags, getFeatureFlag, getFeatureFlagStatuses, getFeatureFlagStatus, getDependentFlags, patchFeatureFlag, deleteFeatureFlag, getAuditLogEntries]

note: >-
  LaunchDarkly publishes no AGENTS.md or first-party skill pack of its own. It does
  publish a 125-tool hosted MCP server, which is the provider's own answer to this
  problem — see mcp/launchdarkly-mcp.yml. These skills cover the REST path, which is what
  an agent uses when it is not going through MCP, when it needs an operation the MCP
  server does not expose (348 of 401 operations have no tool), or when it is running on
  the federal or EU instance where the hosted MCP server is unavailable.
skills:
  - name: launchdarkly-ship-a-feature-flag

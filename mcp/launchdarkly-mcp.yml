  - tool: update-segment-targets
    category: feature-management
    summary: 'Add or remove individual context keys from a segment''s included or excluded lists. Included
      targets always match the segment. Excluded targets never match, even if rules would include them.
      Supported kinds: addIncludedTargets, removeIncludedTargets, addExcludedTargets, removeExcludedTargets.
      Each instruction requires contextKind and values. If the environment requires approval, the response
      includes requiresApproval: true and the attempted instructions; call `create-approval-request` with
      the returned instructions to submit it for review.'
    annotations:
    - Destructive
    required_inputs: []
  - tool: update-segment-rules
    category: feature-management
    summary: 'Add, remove, or modify attribute-based targeting rules on a segment. Rules evaluate context
      attributes to determine segment membership. Clauses within a rule are ANDed; multiple rules use
      OR logic. Supported kinds: addRule, removeRule, addClauses, removeClauses, updateClause, addValuesToClause,
      removeValuesFromClause, reorderRules, updateRuleDescription, updateRuleRolloutAndContextKind. If
      the environment requires approval, the response includes requiresApproval: true and the attempted
      instructions; call `create-approval-request` with the returned instructions to submit it for review.'
    annotations:
    - Destructive
    required_inputs: []
  - tool: get-segment
    category: feature-management
    summary: Get detailed configuration for a single segment in an environment. Returns rules, included
      targets, excluded targets, tags, and creation date. Use to verify segment state after creation or
      updates.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: create-segment
    category: feature-management
    summary: 'Create a new segment in a project environment. The segment is empty after creation — use
      update-segment-rules to add targeting rules or update-segment-targets to add individual context
      keys. Segment keys are immutable after creation: choose carefully. Pass viewKeys to link the new
      segment to one or more views at creation time (Views are an Enterprise feature).'
    annotations: []
    required_inputs: []
  - tool: list-segments
    category: feature-management
    summary: List segments in a project environment. Returns a paginated list with rule counts and target
      counts. Use query to search by name or key, tags to filter by tag, or view to only include segments
      linked to a view (Views are an Enterprise feature). Always list first to avoid creating duplicates.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []

    required_inputs:
    - direction
    - endDate
    - limit
    - projectKey
    - query
    - sessionSecureId
    - startDate
  - tool: query-timeline-events
    category: observability
    summary: Query timeline indicator events for a session.
    annotations:
    - Read-only
    - Idempotent
    required_inputs:
    - sessionSecureId
  - tool: query-sessions
    category: observability
    summary: Query project sessions.
    annotations:
    - Read-only
    - Idempotent
    required_inputs:
    - count
    - endDate
    - page
    - projectKey
    - query
    - sortDesc
    - sortField
    - startDate
  - tool: query-error-groups
    category: observability
    summary: Query project error groups.
    annotations:
    - Read-only
    - Idempotent
    required_inputs:
    - count
    - endDate
    - page
    - projectKey
    - query
    - startDate
  - tool: query-aggregations
    category: observability
    summary: Retrieve bucketed, aggregated values over time for a product type.
    annotations:
    - Read-only
    - Idempotent
    required_inputs:
    - Count
    - CountDistinct
    - aggregator
    - column
    - endDate
    - expressions
    - groupBy
    - productType
    - projectKey
    - query
    - startDate
  - tool: query-traces
    category: observability
    summary: Query project traces.
    annotations:
    - Read-only
    - Idempotent
    required_inputs:
    - direction
    - endDate
    - limit
    - projectKey
    - query
    - sortColumn
    - sortDirection
    - startDate
  - tool: query-logs
    category: observability
    summary: Query project logs.
    annotations:
    - Read-only
    - Idempotent
    required_inputs:
    - direction
    - endDate
    - limit
    - projectKey
    - query
    - startDate
  - tool: get-sdk-active
    category: account
    summary: Check whether any SDKs have been active in a given environment. Returns true if any SDK has
      initialized or sent events in the environment. Use this to verify that an environment is actually
      in use before cleanup. Optionally filter by sdkName or sdkWrapperName to check a specific SDK.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: get-environment
    category: account
    summary: 'Get a LaunchDarkly environment and its SDK keys: server-side SDK key, client-side ID, and
      mobile key. Use this to retrieve the client-side ID needed to initialize a browser or mobile SDK.'
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: get-project
    category: account
    summary: Get a LaunchDarkly project with its environments and SDK keys. Use to retrieve SDK keys for
      an existing project or verify a project exists.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: create-project
    category: account
    summary: Create a new LaunchDarkly project. Returns the project with its environments and SDK keys.
      Project keys must be lowercase with hyphens, starting with a letter. Production and Test environments
      are created by default.
    annotations: []
    required_inputs: []
  - tool: list-release-policies
    category: feature-management
    summary: List release policies for a project. Each policy defines preferred release methods and the
      metrics or metric groups that automatically attach to guarded rollouts when the policy's conditions
      match (e.g. specific environments or flag tags).
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: list-metric-events
    category: experimentation
    summary: List recent event keys received by a LaunchDarkly project — used to check which events are
      actively flowing before creating a metric. Returns up to 50 event keys with last-seen timestamps.
      If the event key you need isn't here, it may not be instrumented yet.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: create-metric
    category: experimentation
    summary: Create a new metric in a LaunchDarkly project.
    annotations: []
    required_inputs: []
  - tool: get-metric
    category: experimentation
    summary: 'Get full details for a single LaunchDarkly metric: measureType, eventKey, successCriteria,
      unit, description, tags, creation date, and attached flag count. Use after create-metric to verify
      the result, or to inspect an existing metric before modifying it.'
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: list-metrics
    category: experimentation
    summary: List metrics in a LaunchDarkly project. Returns key, name, measureType (count/occurrence/value),
      eventKey, successCriteria, tags, and how many flags each metric is attached to.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: delete-agent-graph
    category: agentcontrol
    summary: Permanently delete an agent graph and all of its edges. THIS IS IRREVERSIBLE. Requires confirm=true
      to execute.
    annotations:
    - Destructive
    required_inputs: []
  - tool: update-agent-graph
    category: agentcontrol
    summary: Update an agent graph's metadata or structure. All fields are optional. If rootConfigKey
      or edges are provided, both must be present and will fully replace the existing graph structure.
      Pass name or description to update metadata only.
    annotations:
    - Destructive
    required_inputs: []
  - tool: create-agent-graph
    category: agentcontrol
    summary: Create a new agent graph in a project. An agent graph defines a directed graph of AgentControl
      Configs for multi-agent workflows. Provide a rootConfigKey and edges to define the graph structure,
      or create the graph with just metadata and add edges later via update-agent-graph. If rootConfigKey
      or edges are provided, both must be present.
    annotations: []
    required_inputs: []
  - tool: get-agent-graph
    category: agentcontrol
    summary: Get a specific agent graph by key, including its full edge structure. Each edge connects
      a source AgentControl Config to a target AgentControl Config with optional handoff data.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: list-agent-graphs
    category: agentcontrol
    summary: List all agent graphs in a project. Returns metadata for each graph including key, name,
      description, and root config key. Does not include edge data — use get-agent-graph to retrieve full
      graph structure.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: invite-members
    category: account
    summary: Invite one or more people to the LaunchDarkly account by email. Each invitee receives an
      email invitation to join. Optionally assign a role (reader, writer, admin) — defaults to reader
      if not specified.
    annotations:
    - Open-world
    required_inputs: []
  - tool: find-members
    category: account
    summary: 'Search for LaunchDarkly account members and return their IDs. Supports flexible matching:'
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: get-member-self
    category: account
    summary: Return the member ID, profile, and team memberships for the currently authenticated user.
      Use this whenever the user refers to themselves ('my metrics', 'created by me', 'assigned to me')
      to resolve their member ID before calling tools that require a maintainerId or similar identifier,
      or to resolve one of their team keys before calling tools that require a maintainerTeamKey. If the
      member belongs to more than one team, ask which one to use rather than guessing. If the server returns
      `token_expired`, re-authenticate the Launchdarkly MCP server connection in your MCP client and retry.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: create-ai-tool
    category: agentcontrol
    summary: 'Create a new AI tool definition in a project. The schema should be a raw JSON Schema object
      with type, properties, and required fields (e.g. {"type": "object", "properties": {...}}). Do NOT
      use the OpenAI function calling wrapper format. After creation, attach the tool to a variation using
      update-agentcontrol-config-variation.'
    annotations: []
    required_inputs: []
  - tool: get-ai-tool
    category: agentcontrol
    summary: Get a single AI tool definition including its full schema. Use to inspect a tool's parameters
      before attaching it to an AgentControl Config variation.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: list-ai-tools
    category: agentcontrol
    summary: List AI tool definitions in a project. Returns each tool's key, description, and schema.
      Tools are attached to AgentControl Config variations to give models function-calling capabilities.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: update-agentcontrol-config-rollout
    category: agentcontrol
    summary: 'Update the default (fallthrough) rule for an AgentControl Config in an environment. Set
      a percentage rollout across variations, or serve a single variation to all unmatched contexts. Weights
      must sum to 100. Use human-friendly percentages (e.g., 80 for 80%). Accepts a variation key (from
      get-agentcontrol-config) or variation name (from get-agentcontrol-config-targeting); the tool resolves
      either to the internal variation _id (UUID) before patching. If the environment requires approval,
      the response includes requiresApproval: true and the attempted instructions; call `create-agentcontrol-config-approval`
      with the returned instructions to submit it for review.'
    annotations:
    - Idempotent
    required_inputs: []
  - tool: get-agentcontrol-config-targeting
    category: agentcontrol
    summary: Read the targeting configuration for an AgentControl Config in a specific environment. Returns
      variations (with their _id UUIDs and names), individual targets, custom rules, fallthrough (default
      rule), and off variation. The variation name returned here can be passed as 'variationKey' to update-agentcontrol-config-targeting,
      update-agentcontrol-config-rollout, and update-agentcontrol-config-targets. Alternatively, use get-agentcontrol-config
      to obtain the variation's slug key.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: clone-agentcontrol-config-variation
    category: agentcontrol
    summary: 'Clone an existing AgentControl Config variation with selective overrides. Reads the source
      variation, applies any provided overrides (model, instructions, messages, parameters, tools), and
      creates a new variation. Returns both the source and created variation so you can compare the diff.
      Use this for A/B experimentation: change one thing at a time while keeping everything else constant.'
    annotations: []
    required_inputs: []
  - tool: delete-agentcontrol-config-variation
    category: agentcontrol
    summary: Permanently delete an AgentControl Config variation. THIS IS IRREVERSIBLE. Requires confirm=true
      to execute.
    annotations:
    - Destructive
    required_inputs: []
  - tool: update-agentcontrol-config-variation
    category: agentcontrol
    summary: 'Update an AgentControl Config variation''s name, description, model, instructions/messages,
      parameters, attached tools, or judge configuration. All fields are optional: only provided fields
      are updated. Pass ''name'' to rename the variation in place without recreating it (avoids changing
      the variation _id). To attach tools, pass the ''tools'' array with {key, version} entries (create
      tools first with create-ai-tool). Pass an empty tools array to detach all tools. To attach judges,
      pass judgeConfiguration with a judges array of {judgeConfigKey, samplingRate} entries. Pass an empty
      judges array to detach all judges.'
    annotations:
    - Destructive
    required_inputs: []
  - tool: create-agentcontrol-config-variation
    category: agentcontrol
    summary: Create a variation for an AgentControl Config. A variation defines the model, prompts, parameters,
      and tools. modelConfigKey must be in Provider.model-id format (e.g. OpenAI.gpt-4o, Anthropic.claude-sonnet-4-5)
      for models to display correctly in the UI. Agent-mode configs use 'instructions' (a string); completion-mode
      configs use 'messages' (an array of {role, content} objects). To attach AI tools, pass the 'tools'
      array with {key, version} entries (create tools first with create-ai-tool). To attach judges, pass
      judgeConfiguration with a judges array of {judgeConfigKey, samplingRate} entries.
    annotations: []
    required_inputs: []
  - tool: get-agentcontrol-config-health
    category: agentcontrol
    summary: 'Health check for an AgentControl Config. Detects common issues: missing models (NO MODEL
      in UI), missing prompts, orphaned tool references, and empty configs with no variations. Returns
      a health verdict (healthy, warning, unhealthy) with specific issues and per-variation summaries.
      Run before updating or experimenting with a config.'
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: setup-agentcontrol-config
    category: agentcontrol
    summary: 'Create an AgentControl Config with its first variation in one step. This is the recommended
      way to set up a new AgentControl Config: it creates the config, adds a variation with model and
      prompts, and verifies everything is configured correctly. Returns the full config detail with variation.
      To attach AI tools, pass the ''tools'' array with {key, version} entries. IMPORTANT: evaluationMetricKey
      (format: $ld:ai:judge:<suffix>) is REQUIRED when mode is ''judge''. Pass viewKeys to link the new
      config to one or more views at creation time (Views are an Enterprise feature). Use create-agentcontrol-config
      + create-agentcontrol-config-variation separately only when you need more control.'
    annotations: []
    required_inputs: []
  - tool: delete-agentcontrol-config
    category: agentcontrol
    summary: 'Permanently delete an AgentControl Config. THIS IS IRREVERSIBLE. Requires confirm=true to
      execute. Prefer archiving (update-agentcontrol-config with archived: true) when possible.'
    annotations:
    - Destructive
    required_inputs: []
  - tool: update-agentcontrol-config
    category: agentcontrol
    summary: 'Update an AgentControl Config''s metadata: name, description, tags, or archive status. Does
      NOT modify variations: use update-agentcontrol-config-variation for model, prompt, or parameter
      changes. Set archived: true to archive (reversible).'
    annotations:
    - Idempotent
    required_inputs: []
  - tool: create-agentcontrol-config
    category: agentcontrol
    summary: 'Create a new AgentControl Config in a project. This creates the config shell: use create-agentcontrol-config-variation
      next to add a model, prompts, and parameters. Mode determines whether variations use ''instructions''
      (agent), ''messages'' (completion), or ''messages'' (judge). Judge-mode configs evaluate other AgentControl
      Config outputs. IMPORTANT: evaluationMetricKey (format: $ld:ai:judge:<suffix>) is REQUIRED when
      mode is ''judge''; omitting it will cause a 400 error. For agent and completion mode it is not accepted.
      Pass viewKeys to link the new config to one or more views at creation time (Views are an Enterprise
      feature).'
    annotations: []
    required_inputs: []
  - tool: get-agentcontrol-config
    category: agentcontrol
    summary: Get detailed configuration for a single AgentControl Config including all its variations.
      Each variation includes its model, instructions or messages, parameters, attached tools, and judgeConfiguration
      (attached judges with judgeConfigKey and samplingRate). For judge-mode configs the response also
      includes evaluationMetricKey.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: list-agentcontrol-configs
    category: agentcontrol
    summary: Search and browse AgentControl Configs in a project. Returns a paginated list with key, name,
      mode (agent, completion, or judge), tags, variation count, and a `usedInGraphs` array listing the
      agent graph keys that reference each config (as the graph root or as an edge source/target). An
      empty `usedInGraphs` means the config is not referenced by any graph (orphaned). If graph usage
      cannot be loaded, `usedInGraphs` is omitted entirely (rather than empty) so an absent field is never
      mistaken for orphaned. Use query to search by name or key, tags to filter by tag, or view to only
      include configs linked to a view (Views are an Enterprise feature).
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: apply-approval-request
    category: feature-management
    summary: 'Apply an already-approved flag approval request. This executes the changes that were approved
      by reviewers. Only works on requests with reviewStatus ''approved''. Does NOT approve requests:
      that must be done by a human reviewer. Use list-approval-requests to get the request id.'
    annotations:
    - Destructive
    required_inputs: []
  - tool: list-approval-requests
    category: feature-management
    summary: List pending approval requests for a flag in an environment. Shows status, review state,
      and who requested the change. Use to check on approval progress after creating a request.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: create-approval-request
    category: feature-management
    summary: 'Create an approval request for a flag change in an environment that requires approvals.
      Requires at least one reviewer: notifyMemberIds and/or notifyTeamKeys. If the user named a person,
      resolve them with find-members and pass the returned id. If they did not name anyone, ask who should
      review before calling this tool. Provide the same semantic patch instructions you would use for
      a direct change. The request will be reviewed by approvers before taking effect. Does NOT approve
      the request: that must be done by a human reviewer.'
    annotations: []
    required_inputs: []
  - tool: check-removal-readiness
    category: other
    summary: 'Detailed safety check before removing a feature flag. Checks dependencies, code references,
      active targeting, expiring targets, and cross-environment status. Returns a readiness verdict: ''safe''
      (proceed), ''caution'' (review warnings), or ''blocked'' (must resolve blockers first). Always run
      this before archive-flag or delete-flag.'
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: manage-expiring-targets
    category: feature-management
    summary: List, add, update, or remove expiring targets on a flag. Expiring targets are automatically
      removed from targeting after a specified date. Dates are shown as ISO strings with days-until-expiry
      computed. Variation IDs are resolved to human-readable names.
    annotations:
    - Destructive
    required_inputs: []
  - tool: delete-flag
    category: feature-management
    summary: Permanently delete a feature flag. THIS IS IRREVERSIBLE. Requires confirm=true to execute.
      Always call check-removal-readiness first and only delete if it returns 'safe'. Prefer archive-flag
      (reversible) when possible.
    annotations:
    - Destructive
    required_inputs: []
  - tool: archive-flag
    category: feature-management
    summary: Archive a feature flag (reversible). This is a soft-delete that can be undone. Recommended
      as the first step before permanent deletion. Always run check-removal-readiness before archiving.
    annotations:
    - Destructive
    - Idempotent
    required_inputs: []
  - tool: copy-flag-config
    category: feature-management
    summary: 'Copy a flag''s targeting configuration from one environment to another. Common use: promote
      from staging to production. Optionally select which aspects to copy: targeting, rules, offVariation,
      prerequisites, on state. If the target environment requires approval, the response includes requiresApproval:
      true and an approvalUrl; follow the approvalUrl to submit the copy request for review.'
    annotations:
    - Destructive
    - Idempotent
    required_inputs: []
  - tool: update-prerequisites
    category: feature-management
    summary: 'Add or remove prerequisites for a flag in a specific environment. Prerequisites are other
      flags that must evaluate to specific variations before this flag is evaluated. Use addPrerequisite
      to migrate prerequisites onto a new flag, or removePrerequisite + addPrerequisite to update dependent
      flags to point to a new key. If the environment requires approval, the response includes requiresApproval:
      true and the attempted instructions; call `create-approval-request` with the returned instructions
      to submit it for review.'
    annotations:
    - Destructive
    required_inputs: []
  - tool: update-individual-targets
    category: other
    summary: 'Add or remove specific users or contexts from individual flag targeting. Individual targets
      are the highest priority: they override all rules. Supported instruction kinds: addTargets, removeTargets,
      replaceTargets. To target non-user context kinds (e.g. organization), include contextKind on the
      instruction (e.g. { kind: ''addTargets'', contextKind: ''organization'', values: [''org-123''],
      variationId: ''<id>'' }). Note: addContextTargets and removeContextTargets are NOT supported by
      the LD API; use addTargets/removeTargets with contextKind instead. Responses truncate long lists.
      If the environment requires approval, the response includes requiresApproval: true and the attempted
      instructions; call `create-approval-request` with the returned instructions to submit it for review.'
    annotations:
    - Destructive
    required_inputs: []
  - tool: update-targeting-rules
    category: feature-management
    summary: Add, remove, or modify custom targeting rules for a flag in an environment. Rules evaluate
      top-to-bottom; first matching rule wins. Use get-flag to look up rule _ids, clause _ids, and variation
      _ids before constructing instructions.
    annotations:
    - Destructive
    required_inputs:
    - addClauses
    - addRule
    - removeClauses
    - removeRule
    - reorderRules
    - updateRuleVariationOrRollout
  - tool: update-rollout
    category: feature-management
    summary: 'Change the default rule (fallthrough) for a flag. Set a percentage rollout across variations
      or serve a single variation to all unmatched users. Weights must sum to 100. Use human-friendly
      percentages (e.g., 80 for 80%). If the environment requires approval, the response includes requiresApproval:
      true and the attempted instructions; call `create-approval-request` with the returned instructions
      to submit it for review.'
    annotations:
    - Idempotent
    required_inputs: []
  - tool: toggle-flag
    category: feature-management
    summary: 'Turn a feature flag''s targeting on or off in a specific environment. Returns the previous
      and new state. If the environment requires approval, the response includes requiresApproval: true
      and the attempted instructions; call `create-approval-request` with the returned instructions to
      submit it for review.'
    annotations:
    - Idempotent
    required_inputs: []
  - tool: update-flag-settings
    category: feature-management
    summary: 'Update a flag''s top-level settings: name, description, tags, temporary/permanent status,
      maintainer, default variations, or custom properties. Does NOT modify per-environment targeting,
      rollouts, or rules: use the targeting tools for those. Supported instruction kinds: updateName,
      updateDescription, addTags, removeTags, markTemporary, markPermanent, updateMaintainerMember, updateMaintainerTeam,
      addCustomProperties, replaceCustomProperties, removeCustomProperties, updateDefaultVariation. updateMaintainerTeam
      takes the same Value shape as updateMaintainerMember but with a team key instead of a member id
      (e.g. { kind: ''updateMaintainerTeam'', value: ''team-key'' }). Only include a maintainer instruction
      when the user explicitly asked to change the maintainer — don''t reassign it as a side effect of
      some other requested edit. addCustomProperties adds a new custom property: { kind, key, name, values[]
      }. replaceCustomProperties replaces an existing custom property''s values: { kind, key, name, values[]
      }. removeCustomProperties removes specific values from a custom property: { kind, key, values[]
      }. updateDefaultVariation sets the flag-level default variation indices used when new environments
      are provisioned: { kind, onVariation?: number, offVariation?: number } where onVariation/offVariation
      are zero-based variation indices.'
    annotations:
    - Idempotent
    required_inputs: []
  - tool: create-flag
    category: feature-management
    summary: 'Create a new feature flag in a project. Defaults to a boolean temporary flag. After creation
      the flag is OFF in all environments: use toggle-flag to enable it.'
    annotations: []
    required_inputs: []
  - tool: get-flag-status-across-envs
    category: feature-management
    summary: Check a flag's lifecycle status across all environments. Returns per-environment state (active,
      inactive, new, launched) and a summary of which environments the flag is active, inactive, or launched
      in. Use before cleanup to verify the flag is inactive everywhere.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: find-stale-flags
    category: feature-management
    summary: 'Find feature flags that are candidates for cleanup. Returns a prioritized list of stale
      flags sorted by staleness (worst first). Categories: inactive_30d (no requests in period), launched_no_changes
      (fully rolled out, no recent changes), never_requested (created but never evaluated). Defaults to
      showing temporary flags inactive for 30+ days.'
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: get-flag-health
    category: feature-management
    summary: 'Get combined health view for a single flag: lifecycle state, last-requested timestamp, targeting
      summary (rules count, targets count, on/off), age, and whether it''s temporary. Use this to assess
      if a flag is stale or needs attention.'
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: get-flag
    category: feature-management
    summary: Get detailed configuration for a single feature flag scoped to a specific environment. Returns
      the full targeting tree including rules, individual targets, fallthrough, prerequisites, and variation
      details.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: list-flags
    category: feature-management
    summary: Search and browse feature flags in a project. Returns a paginated list scoped to a single
      environment.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
crosswalk: mcp/launchdarkly-tool-crosswalk.yml

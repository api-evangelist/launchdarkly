    required_inputs: []
  - tool: create-dataset
    category: agentcontrol
    summary: Create a new offline dataset for AI evaluation. Provide a dataset name, filename, and format
      (csv, json, or jsonl). The dataset is created in pending status and must be uploaded separately.
      Returns the dataset ID and upload URL.
    annotations: []
    required_inputs: []
  - tool: get-dataset
    category: agentcontrol
    summary: Get details about a specific offline dataset by ID, including its processing status and row
      count.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: list-datasets
    category: agentcontrol
    summary: List offline datasets for a project. Returns id, name, status, row count, and creation info
      for each dataset. Datasets can be in pending, processing, completed, or failed status.
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: stop-guarded-rollout
    category: feature-management
    summary: 'Stop an active guarded rollout on a flag''s default rule (fallthrough). This immediately
      halts the progressive rollout and locks the flag to its current state. If the environment requires
      approval, the response includes requiresApproval: true and the attempted instructions; call `create-approval-request`
      with the returned instructions to submit it for review.'
    annotations:
    - Destructive
    required_inputs: []
  - tool: start-guarded-rollout
    category: feature-management
    summary: 'Start a guarded rollout on a flag''s default rule (fallthrough). A guarded rollout progressively
      increases traffic to the test variation through a series of stages while monitoring metrics for
      regressions. Each stage specifies a rolloutWeight (percentage in thousandths, e.g. 10000 = 10%)
      and a monitoring window in milliseconds. Metrics define what to monitor and whether to notify or
      rollback on regression. Requires the flag to be on and not already have an active guarded rollout.
      If the environment requires approval, the response includes requiresApproval: true and the attempted
      instructions; call `create-approval-request` with the returned instructions to submit it for review.'
    annotations: []
    required_inputs: []
  - tool: get-experiment-metric-results
    category: experimentation
    summary: 'Get detailed statistical results for a single metric on an experiment iteration. Returns,
      per treatment: sample sizes (analyzedUnitCount, trafficCount, conversionCount), the observed mean
      and standard deviation, and a `statistics` block with the lift versus control (relativeDifferences:
      estimate plus lower/upper interval bounds and, for frequentist experiments, a per-comparison pValue),
      the overall pValue, Bayesian probabilities (probabilityToBeBest, probabilityToBeatBaseline, expectedLoss),
      and an isSignificant flag. Reads from LaunchDarkly''s internal analysis API. Defaults to the current
      iteration and the latest analysis; pass iterationId to target a previous iteration. Use disableMultipleComparisonCorrection
      / disableSequentialTesting to see uncorrected numbers. Use get-experiment-results for a cross-metric
      overview, or get-experiment to discover metric keys.'
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: get-experiment-results
    category: experimentation
    summary: 'Get an overall results summary for an experiment, across every metric on the current iteration.
      Discovers the iteration''s metrics, then fetches each metric''s analysis from LaunchDarkly''s internal
      results API and returns a compact per-metric summary: which treatment is leading (isBest) — the
      arm with the highest probability to beat the baseline for Bayesian experiments, or the lowest p-value
      versus control for frequentist (note: not significance-gated, so a treatment can be flagged leading
      even when nothing is significant) — each treatment''s lift versus control, whether it''s statistically
      significant, and sample sizes. Pass iterationId to summarize a previous iteration. For the full
      per-treatment statistics (intervals, p-values, Bayesian probabilities) on one metric, use get-experiment-metric-results.'
    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: stop-experiment-iteration
    category: experimentation
    summary: 'Stop the currently running iteration of an experiment. Data collection ends and the iteration
      moves to the `stopped` status. A winning treatment is required to stop: pass `winningTreatmentId`
      (the `_id` of one of the iteration''s treatments, available from get-experiment) and an optional
      `winningReason` explaining the call. If the experiment was inconclusive, declare the baseline/control
      treatment as the winner.'
    annotations:
    - Destructive
    required_inputs: []
  - tool: save-and-start-experiment-iteration
    category: experimentation
    summary: Stop the current running iteration, create a new draft iteration with the provided field
      updates applied, and start it — the API-recommended way to mutate treatments, metrics, methodology,
      or other fields that are locked while an iteration is running. Provide `changeJustification` to
      record why a new iteration is needed. Field inputs are the same as `update-experiment`; updates
      are checked against the new iteration's not_started mutability rules. Fields not allowed in not_started
      are returned under `skipped` rather than being sent.
    annotations:
    - Destructive
    required_inputs: []
  - tool: start-experiment-iteration
    category: experimentation
    summary: Start an experiment iteration. This begins data collection for the experiment's current draft
      iteration and starts allocating live end-user traffic across its treatments. The experiment's flag
      must be toggled on, a randomization unit must be set, and at least one treatment must have a non-zero
      allocation percent.
    annotations:
    - Destructive
    required_inputs: []
  - tool: update-experiment
    category: experimentation
    summary: Update fields on an experiment or its current iteration. Which fields are mutable depends
      on the current iteration's status (not_started, running, stopped). This tool first reads the experiment's
      mutableFieldsByStatus, applies only the updates that are allowed for the current status via the
      updateExperimentFields semantic patch, and returns any rejected fields under `skipped` with the
      reason. If no provided field is mutable, the response includes `currentStatus` and `allowedFields`
      so you can retry with valid inputs.
    annotations:
    - Destructive
    required_inputs:
    - flagSettings
    - flags
    - metrics
    - treatments
  - tool: create-experiment
    category: experimentation
    summary: Create a new experiment on a flag or AgentControl Config. An experiment measures the impact
      of different variations on specified metrics. You must provide the initial iteration definition
      including a hypothesis, metrics, treatments, and flag configuration. One treatment must be marked
      as the baseline. Use `methodology` to pick the results-analysis approach (`bayesian` default, `frequentist`,
      or `export_only` for data-export-only mode). Use `analysisConfig` to set thresholds and multiple-comparison
      correction. Use `iteration.attributes` to declare slicing dimensions and `iteration.covariateId`
      to enable stratified sampling.
    annotations: []
    required_inputs: []
  - tool: get-experiment
    category: experimentation
    summary: Get detailed information about a specific experiment, including its treatments, metrics,

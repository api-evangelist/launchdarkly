specification: API Commons MCP Server
specificationVersion: '0.1'
provider: LaunchDarkly
providerId: launchdarkly
name: LaunchDarkly MCP Server
generated: '2026-08-27'
method: searched
status: published
source: https://launchdarkly.com/docs/home/getting-started/mcp
docs:
- https://launchdarkly.com/docs/home/getting-started/mcp
- https://launchdarkly.com/docs/home/getting-started/mcp-hosted
- https://launchdarkly.com/docs/home/getting-started/mcp-local
description: LaunchDarkly operates a first-party hosted MCP server covering feature management, AgentControl
  and observability, and also publishes a local stdio server for the federal and EU instances where the
  hosted server is not available. Both are official.
deployment:
  mode: both
  endpoint: https://mcp.launchdarkly.com/mcp/launchdarkly
  transport: streamable-http
  install: npx -y --package @launchdarkly/mcp-server -- mcp start --api-key <LAUNCHDARKLY_API_TOKEN>
  package: https://www.npmjs.com/package/@launchdarkly/mcp-server
  auth: oauth
  verified: probed
  note: Remote and local are DIFFERENT products here, not two ways to get the same thing. The hosted endpoint
    is OAuth and reachable by an agent with no local install; the npx package is stdio, takes a static
    API access token, and is the only option on the federal (app.launchdarkly.us) and EU (app.eu.launchdarkly.com)
    instances, which the docs state do not support the hosted server.
evidence:
- probe: POST tools/list (anonymous)
  url: https://mcp.launchdarkly.com/mcp/launchdarkly
  http_status: 401
  result: '{"error":{"code":-32001,"message":"unauthorized access"}} with WWW-Authenticate: Bearer resource_metadata="https://mcp.launchdarkly.com/.well-known/oauth-protected-resource/mcp/launchdarkly"'
  checked: '2026-08-27'
- probe: GET /.well-known/oauth-protected-resource/mcp/launchdarkly
  url: https://mcp.launchdarkly.com/.well-known/oauth-protected-resource/mcp/launchdarkly
  http_status: 200
  result: RFC 9728 protected-resource metadata; saved to well-known/launchdarkly-mcp-oauth-protected-resource.json
  checked: '2026-08-27'
- probe: GET /.well-known/oauth-authorization-server
  url: https://app.launchdarkly.com/.well-known/oauth-authorization-server
  http_status: 200
  result: 'RFC 8414 metadata: DCR at /trust/oauth/register/dcr, PKCE S256, scopes reader/writer/observability/offline_access'
  checked: '2026-08-27'
- probe: GET install page
  url: https://mcp.launchdarkly.com/mcp/launchdarkly/install
  http_status: 200
  result: Provider-published page listing all 125 tools with descriptions, required inputs and MCP annotations
  checked: '2026-08-27'
authentication:
  hosted:
    type: oauth2
    flow: authorization_code + PKCE (S256)
    authorization_endpoint: https://app.launchdarkly.com/trust/oauth/authorize
    token_endpoint: https://app.launchdarkly.com/trust/oauth/token
    dynamic_client_registration: https://app.launchdarkly.com/trust/oauth/register/dcr
    scopes:
    - reader
    - writer
    - observability
    - offline_access
  local:
    type: api-key
    parameter: --api-key
    credential: LaunchDarkly personal or service access token
    recommended_role: Writer base role, or a custom role granting all actions on proj/*:env/*:flag/* and
      proj/*:env/*:aiconfig/*
    warning: The provider explicitly warns that putting the token in the client config file risks leaking
      it into the conversation, and recommends an environment variable instead.
tools:

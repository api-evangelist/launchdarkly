  - tool: list-projects
    category: account
    summary: 'List LaunchDarkly projects in the account. Use to discover project keys before calling project-scoped
      tools. Filtering: use `query` to search by project name or key (case-insensitive), `tags` to filter
      by tag (all must match). Sorting: use `sort` with `name` or `-name`. Pagination: responses include
      `totalCount` and `pageInfo.offset`. To get the next page, set `offset` to the current offset + limit.'

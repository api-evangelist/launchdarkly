    annotations:
    - Read-only
    - Idempotent
    required_inputs: []
  - tool: delete-ai-tool
    category: agentcontrol
    summary: Permanently delete an AI tool definition. THIS IS IRREVERSIBLE. Any AgentControl Config variations

  note: 'REST operations with no corresponding MCP tool. The hosted MCP server is a deliberate subset:
    it covers flags, segments, AgentControl, experiments, metrics, approvals and observability, and leaves
    account administration, integrations, data export, audit log, code references, relay proxy configuration
    and webhooks to the REST API.'

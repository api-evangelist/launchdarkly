specification: API Commons Tool Crosswalk
specificationVersion: '0.1'
provider: LaunchDarkly
providerId: launchdarkly
generated: '2026-08-27'
method: derived
source: MCP tool inventory read verbatim from the provider-published install page https://mcp.launchdarkly.com/mcp/launchdarkly/install
  (125 tools with names, descriptions, required inputs and MCP annotations), bound against the live REST
  contract at https://app.launchdarkly.com/api/v2/openapi.json (401 operations).
note: The live MCP endpoint is OAuth-gated (HTTP 401 on an anonymous tools/list), so tool inputSchemas
  could not be introspected. Bindings are therefore by normalized name and by documented semantics, and
  confidence is recorded honestly per row rather than asserted uniformly. Where a binding is high, the
  tool inherits that operation's parameters and requestBody as its real input schema.
surfaces:
  openapi:
    url: https://app.launchdarkly.com/api/v2/openapi.json
    file: openapi/launchdarkly-rest-api-openapi.json
    gated: false
    operations: 401
  mcp:
    url: https://mcp.launchdarkly.com/mcp/launchdarkly
    gated: true
    auth: oauth
    tools: 125
    note: tools/list returns 401 with WWW-Authenticate resource_metadata pointing at /.well-known/oauth-protected-resource/mcp/launchdarkly
  graphql:
    endpoint: null
    gated: null
    note: LaunchDarkly publishes no GraphQL API. graphql/ in this repo holds a REST-derived conceptual
      schema, not a provider surface.
coverage:
  mcp_tools: 125
  rest_operations: 401
  bound: 58
  mcp_only: 67
  rest_only: 348
  confidence:
    high: 56
    medium: 2
    low: 0

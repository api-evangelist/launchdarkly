- aid: launchdarkly:webhooks-api
  name: LaunchDarkly Webhooks API
  tags:
  - Event
  - Integration
  - Notification
  - Webhook
  tags_raw:
  - Events
  - Integrations
  - Notifications
  - Webhooks
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://app.launchdarkly.com/api/v2
  humanURL: https://launchdarkly.com/docs/api/webhooks
  properties:
  - url: https://launchdarkly.com/docs/api/webhooks
    type: Documentation
  - type: AsyncAPI
    url: asyncapi/launchdarkly-webhooks-asyncapi.yml
  description: >-
    The LaunchDarkly Webhooks API allows developers to build custom integrations that subscribe to activity
    events within LaunchDarkly. When actions occur such as flag changes, project creation, or environment
    modifications, LaunchDarkly sends HTTP POST payloads to configured webhook URLs. This enables use
    cases like updating external issue trackers, notifying support systems of feature rollouts, and triggering
    downstream automation workflows based on feature flag lifecycle events.

- aid: launchdarkly:launchdarkly-adaptive-triggers-api
  name: LaunchDarkly Adaptive triggers API
  description: >-
    Adaptive triggers automatically update the targeting of a feature flag or AgentControl config when
    a trigger source, such as an observability alert, fires. Each adaptive trigger pairs a trigger source
    with a task that describes the change to make, such as updating the variation served by the default
    rule or by a specific targeting rule.


    Using the adaptive triggers API, you can create, read, update, enable, disable, and delete adaptive
    triggers.

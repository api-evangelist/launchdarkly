modified: '2026-08-27'
description: LaunchDarkly is a feature management and runtime control platform. Development teams use it to wrap
  releases in feature flags, target variations at specific users, contexts, segments and environments, run experiments
  and guarded rollouts, and turn a change back off without shipping new code. The platform now extends the same
  targeting, approval and audit machinery to AI through AgentControl, where prompts, models, tools and agent graphs
  are versioned and rolled out as configs, and to observability through session replay, errors, logs and traces.
  LaunchDarkly publishes a 401-operation REST API, more than thirty SDKs across thirteen client-side, thirteen server-side
  and four edge runtimes, a self-hosted Relay Proxy, a CLI, and a hosted MCP server exposing 125 tools to AI clients.
  LaunchDarkly is operated by Catamorphic Co.

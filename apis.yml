- aid: launchdarkly:launchdarkly-agentcontrol-api
  name: LaunchDarkly Agent Control API
  description: >-
    The AgentControl API allows you to create, retrieve, and edit AgentControl configs, config variations,
    and AI model configurations.


    **This product name has changed, but the API has not.** AgentControl was previously called AI Configs.
    Resources previously called "AI Configs" are now referred to as "AgentControl configs" or "configs."
    This is not a breaking change to the API. Existing AI Configs API endpoints, paths, request/response
    bodies, and operation IDs are unchanged. Integrations that use those resources still work and do not
    need modification.


    An AgentControl config is a resource in LaunchDarkly that you can use to customize, test, and roll
    out new large language models (LLMs) within your generative AI applications. Within each config, you
    define one or more variations, each of which includes a model configuration and one or more messages.
    The model configuration can be a standard one from the list provided by LaunchDarkly, or you can define
    your own custom AI model configuration.


    To learn more, read [AgentControl](https://launchdarkly.com/docs/home/agentcontrol).
  humanURL: https://launchdarkly.com/docs/api/webhooks
  baseURL: https://app.launchdarkly.com/api/v2
  tags:
  - AgentControl
  properties:
  - type: OpenAPI
    url: openapi/launchdarkly-agentcontrol-api-openapi.yml

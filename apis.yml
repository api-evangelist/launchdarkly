- aid: launchdarkly:launchdarkly-workflow-templates-api
  name: LaunchDarkly Workflow templates API
  description: >-
    > ### Workflows are in maintenance mode

    >

    > The workflows feature is in maintenance mode, and is planned for future deprecation at a date not
    yet specified. We will work with existing customers using workflows to migrate to a replacement solution
    when deprecation occurs.


    Workflow templates allow you to define a set of workflow stages that you can use as a starting point
    for new workflows. You can create these workflows for any flag in any environment and any project,
    and you can create as many workflows as you like from a given template.


    You can create workflow templates in two ways:

    * by specifying the desired stages, using the `stages` property of the request body

    * by specifying an existing workflow to save as a template, using the `workflowId` property of the
    request body


    You can use templates to create a workflow in any project, environment, or flag. However, when you
    create a template, you must specify a particular project, environment, and flag. This means that when
    you create a template using the `stages` property, you must also include `projectKey`, `environmentKey`,
    and `flagKey` properties in the request body. When you create a template from an existing workflow,
    it will use the project, environment, and flag of the existing workflow, so those properties can be
    omitted from the request body.


    To learn more, read [Workflows documentation](https://launchdarkly.com/docs/home/releases/workflows)
    and [Workflows API documentation](https://launchdarkly.com/docs/api/workflows).
  humanURL: https://launchdarkly.com/docs/api/webhooks
  baseURL: https://app.launchdarkly.com/api/v2
  tags:
  - Workflow templates
  properties:
  - type: OpenAPI
    url: openapi/launchdarkly-workflow-templates-api-openapi.yml

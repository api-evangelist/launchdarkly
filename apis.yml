- aid: launchdarkly:launchdarkly-dev-server-api
  name: LaunchDarkly Dev Server API
  description: The LaunchDarkly CLI ships a locally-run dev-server that syncs feature flags from a real source environment
    and then serves them offline over the same streaming interface the hosted service uses, with per-flag overrides.
    It exposes its own 15-operation HTTP+JSON API, contracted by a first-party OpenAPI published in the ldcli repository,
    including SQLite snapshot and restore of the entire local flag state. It is intended for local development,
    CI and preview environments, and the provider states explicitly that it must not be used in production.
  humanURL: https://launchdarkly.com/docs/guides/flags/ldcli-dev-server-reference
  baseURL: http://localhost:8765/dev

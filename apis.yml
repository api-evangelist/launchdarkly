  name: LaunchDarkly MCP Server
  description: LaunchDarkly operates a first-party hosted Model Context Protocol server at https://mcp.launchdarkly.com/mcp/launchdarkly,
    reachable by any MCP client over streamable HTTP and authorized with OAuth 2.0 (dynamic client registration,
    PKCE). It exposes 125 tools across feature management, AgentControl, experimentation, metrics and observability,
    each carrying MCP annotations that declare whether it is read-only, idempotent or destructive. A stdio server
    is also published to npm as @launchdarkly/mcp-server for the federal and EU instances, where the hosted server
    is not available.
